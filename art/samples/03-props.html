<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>דוגמת מופת 3 — חפצים</title>
<style>
  :root { --ink: #33373b; --muted: #6b7378; --card: #ffffff; --line: #dfe7ea; --accent: #176fbe; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, "Segoe UI", Arial, sans-serif; color: var(--ink); background: #f3f7f8; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 0 16px; }
  header { padding: 16px 0 10px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  header p { margin: 0; color: var(--muted); font-size: 14px; }
  .scene { width: 100%; height: auto; display: block; border-radius: 16px; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 0; }
  .controls button { min-height: 44px; padding: 0 14px; border-radius: 12px; border: 2px solid var(--line); background: #fff; color: var(--ink); font: inherit; cursor: pointer; }
  .controls button[aria-pressed=true] { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  h2 { font-size: 16px; margin: 18px 0 8px; }
  .gallery { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 8px; text-align: center; min-width: 0; }
  .card svg { width: 100%; height: 130px; display: block; border-radius: 10px; }
  .card b { display: block; font-size: 13px; margin-top: 6px; }
  .card code { font-size: 11px; color: var(--muted); direction: ltr; display: block; overflow-wrap: anywhere; }
  .pad { height: 32px; }
  @media (min-width: 700px) { .gallery { grid-template-columns: repeat(5, 1fr); } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>דוגמת מופת 3 — חפצים</h1>
    <p>החפצים של המשחקים: תיבה, מטבע, כוכב, יהלום וקרשים. אותם גופים ואותו אור, בצבעים קבועים (זהב תמיד זהב).</p>
  </header>
  <svg id="scene" class="scene" viewBox="0 0 900 620" role="img" aria-label="תיבת אוצר נפתחת ומטבעות"></svg>
  <div class="controls" id="themes">
    <button type="button" data-v="day" aria-pressed="true">☀️ יום</button>
    <button type="button" data-v="sunset" aria-pressed="false">🌅 שקיעה</button>
    <button type="button" data-v="ice" aria-pressed="false">❄️ קרח</button>
  </div>
  <h2>החלקים</h2>
  <div class="gallery" id="gallery"></div>
  <div class="pad"></div>
</div>

<script src="../lowpoly.js"></script>
<script>
const $ = id => document.getElementById(id);
let THEME = 'day';
const M = LP.make;
const ease = x => x < 0 ? 0 : x > 1 ? 1 : x * x * (3 - 2 * x);

// 4.5 s loop: wait → lid opens with a wobble → coins fly out → lid closes
function chestState(t) {
  const c = t % 4.5;
  let open = 0, wobble = 0;
  if (c < .9) wobble = Math.sin(c * 30) * .04 * (c > .3 ? 1 : 0);
  else if (c < 1.4) open = 2.0 * ease((c - .9) / .5);
  else if (c < 3.7) open = 2.0;
  else open = 2.0 * (1 - ease((c - 3.7) / .6));
  return { open, wobble, coinT: c - 1.2 };
}

function mainSVG(t) {
  const T = LP.useTheme(THEME);
  const cam = LP.camera({ a: .36, s: 1.5, ox: 450, oy: 400 });
  const bg = LP.camera({ a: .12, ox: 450, oy: 520 });
  let svg = `<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${T.sky[0]}"/><stop offset=".6" stop-color="${T.sky[1]}"/><stop offset="1" stop-color="${T.sky[2]}"/></linearGradient></defs>
    <rect width="900" height="620" fill="url(#sky)"/><circle cx="760" cy="90" r="40" fill="${T.sun}"/>`;
  svg += LP.draw(M.ridge({ width: 1200, h: 200, count: 5, seed: 21, fog: .5, snow: .74 }), bg);

  const st = chestState(t);
  const island = M.island({ rx: 230, ry: 130, depth: 170, seed: 5 });
  const chest = M.chest({ x: 10, y: 20, size: 120, open: st.open, rot: st.wobble });
  const kid = M.kid({ x: -150, y: -10, size: 150, rot: .7, pose: st.open > 1 ? 'cheer' : 'stand', t, seed: 3 });
  const items = [
    chest, kid,
    M.plank({ x: 150, y: 60, n: 5, unit: 22, rot: -.25 }),
    M.plank({ x: 160, y: 20, n: 3, unit: 22, rot: -.25, z: 0 }),
    M.gem({ x: -60, y: -80, size: 30, color: 'red' }), M.gem({ x: 115, y: -70, size: 26, color: 'green' }),
    M.coin({ x: -20, y: -95, size: 26, rot: .5 }), M.coin({ x: 60, y: -100, size: 22, rot: -.4 }),
    M.bush({ x: -190, y: 70, size: 40, seed: 2 }), M.pine({ x: 180, y: 100, size: 120, seed: 4 }),
  ].sort((a, b) => b.y - a.y);
  svg += LP.draw(island, cam);
  svg += `<clipPath id="top"><polygon points="${LP.outline(island.top, cam)}"/></clipPath><g clip-path="url(#top)" fill="${T.shadow}" opacity=".36">${items.map(o => LP.castShadow(o, cam)).join('')}</g>`;
  svg += items.map(o => LP.draw(o, cam) + LP.face(o, cam)).join('');
  // unit labels on the planks (the number is the point of the game)
  items.filter(o => o.n).forEach(o => {
    const p = LP.project([o.x, o.y, o.unit * .3], cam);
    svg += `<g transform="translate(${p[0].toFixed(1)},${(p[1] - 4).toFixed(1)})"><circle r="12" fill="#fff" opacity=".9"/><text text-anchor="middle" dy="5" font-size="15" font-weight="700" fill="#33373b" font-family="system-ui">${o.n}</text></g>`;
  });
  // coins flying out of the chest
  if (st.coinT > 0 && st.open > 1.5) {
    const coins = [];
    for (let i = 0; i < 9; i++) {
      const tt = st.coinT - i * .18; if (tt <= 0 || tt > 1.6) continue;
      const a = i * 2.4, vx = Math.cos(a) * 90, vy = Math.sin(a) * 50 - 20, vz = 300 + (i % 3) * 40;
      coins.push(M.coin({ x: 10 + vx * tt, y: 20 + vy * tt, z: 60 + vz * tt - 380 * tt * tt, size: 22, rot: tt * 9 + i, seed: i }));
    }
    svg += coins.filter(c => c.z > -10).sort((a, b) => b.y - a.y).map(c => LP.draw(c, cam)).join('');
  }
  // star rating (2 of 3)
  const sc = LP.camera({ a: .1, ox: 0, oy: 0 });
  [true, true, false].forEach((on, i) => {
    const pop = on ? 1 + .06 * Math.sin(t * 3 + i) : 1;
    svg += `<g transform="translate(${370 + i * 80},${i === 1 ? 92 : 104}) scale(${(i === 1 ? 1.2 : 1) * pop})">${LP.draw(M.star({ size: 64, on, rot: .25 * Math.sin(t * 1.5 + i) }), sc)}</g>`;
  });
  return svg;
}

function card(obj, he, code) {
  const cam = LP.camera({ a: .3 }), list = LP.facets(obj, cam), b = LP.bounds(list), p = Math.max(b.w, b.h) * .12, T = LP.theme;
  return `<div class="card"><svg viewBox="${(b.x - p).toFixed(0)} ${(b.y - p).toFixed(0)} ${(b.w + 2 * p).toFixed(0)} ${(b.h + 2 * p).toFixed(0)}" style="background:linear-gradient(${T.sky[1]},${T.sky[2]})">${LP.polys(list)}</svg><b>${he}</b><code>${code}</code></div>`;
}
function gallery() {
  LP.useTheme(THEME);
  $('gallery').innerHTML = [
    card(M.chest({ size: 120, rot: -.35 }), 'תיבה סגורה', 'chest()'),
    card(M.chest({ size: 120, rot: -.35, open: 2 }), 'תיבה פתוחה', 'chest({open:2})'),
    card(M.coin({ size: 60, rot: -.35 }), 'מטבע', 'coin()'),
    card(M.star({ size: 70, rot: -.2 }), 'כוכב', 'star()'),
    card(M.star({ size: 70, rot: -.2, on: false }), 'כוכב ריק', 'star({on:false})'),
    card(M.gem({ size: 60, color: 'blue' }), 'יהלום כחול', "gem({color:'blue'})"),
    card(M.gem({ size: 60, color: 'red' }), 'יהלום אדום', "gem({color:'red'})"),
    card(M.gem({ size: 60, color: 'green' }), 'יהלום ירוק', "gem({color:'green'})"),
    card(M.plank({ n: 1, unit: 40, rot: -.3 }), 'קרש 1', 'plank({n:1})'),
    card(M.plank({ n: 7, unit: 40, rot: -.15 }), 'קרש 7', 'plank({n:7})'),
  ].join('');
}

$('themes').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  THEME = b.dataset.v;
  $('themes').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
  gallery();
});
const t0 = performance.now(), still = matchMedia('(prefers-reduced-motion: reduce)').matches;
let last = 0;
function frame(now) {
  if (now - last > 33) { last = now; $('scene').innerHTML = mainSVG(still ? 2 : (now - t0) / 1000); }
  requestAnimationFrame(frame);
}
gallery();
requestAnimationFrame(frame);
</script>
</body>
</html>
