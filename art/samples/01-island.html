<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>דוגמת מופת 1 — אי מרחף</title>
<style>
  :root { --ink: #33373b; --muted: #6b7378; --card: #ffffff; --line: #dfe7ea; --accent: #176fbe; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, "Segoe UI", Arial, sans-serif; color: var(--ink); background: #f3f7f8; }
  header { padding: 16px; max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  header p { margin: 0; color: var(--muted); font-size: 14px; }
  .stage { max-width: 1100px; margin: 0 auto; padding: 0 16px; }
  .scene { width: 100%; height: auto; display: block; border-radius: 16px; }
  .themes { display: flex; gap: 8px; padding: 12px 16px 0; max-width: 1100px; margin: 0 auto; }
  .themes button { flex: 1; background: #fff; color: var(--ink); border: 2px solid var(--line); }
  .themes button[aria-pressed=true] { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .controls { display: grid; grid-template-columns: 1fr; gap: 10px; padding: 12px 16px; max-width: 1100px; margin: 0 auto; }
  .controls label { display: grid; grid-template-columns: 90px 1fr 34px; align-items: center; gap: 8px; font-size: 14px; }
  .controls input[type=range] { width: 100%; height: 32px; direction: ltr; }
  .controls output { color: var(--muted); font-variant-numeric: tabular-nums; text-align: left; }
  button { font: inherit; min-height: 44px; padding: 0 16px; border-radius: 12px; border: 0; background: var(--accent); color: #fff; cursor: pointer; }
  h2 { font-size: 16px; max-width: 1100px; margin: 18px auto 8px; padding: 0 16px; }
  .gallery { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 0 16px 32px; max-width: 1100px; margin: 0 auto; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px; text-align: center; }
  .card svg { width: 100%; height: 130px; display: block; border-radius: 10px; padding: 8px; }
  .card b { display: block; font-size: 14px; margin-top: 6px; }
  .card { min-width: 0; }
  .card code { font-size: 11px; color: var(--muted); direction: ltr; display: block; overflow-wrap: anywhere; }
  @media (min-width: 700px) {
    .themes { max-width: 520px; margin-inline-start: max(16px, calc((100% - 1100px) / 2)); padding-inline: 16px 0; }
    .controls { grid-template-columns: repeat(3, 1fr) auto; align-items: center; }
    .gallery { grid-template-columns: repeat(5, 1fr); }
  }
  /* life */
  .float { animation: float 7s ease-in-out infinite; }
  .float2 { animation: float 5.5s ease-in-out -2s infinite; }
  .float3 { animation: float 6.3s ease-in-out -4s infinite; }
  .drift { animation: drift 40s ease-in-out infinite alternate; }
  .drift2 { animation: drift 55s ease-in-out -20s infinite alternate-reverse; }
  @keyframes float { 50% { transform: translateY(-9px); } }
  @keyframes drift { to { transform: translateX(60px); } }
  @media (prefers-reduced-motion: reduce) { .float, .float2, .float3, .drift, .drift2 { animation: none; } }
</style>
</head>
<body>
<header>
  <h1>דוגמת מופת 1 — אי מרחף</h1>
  <p>Soft Low‑Poly בקוד. כל צבע נקבע מהכיוון של הפאה ביחס לאור אחד, וערכת הצבע מחליפה את כל החומרים יחד.</p>
</header>
<div class="stage"><svg id="scene" class="scene" viewBox="0 0 1200 800" role="img" aria-label="אי מרחף בסגנון low poly"></svg></div>
<div class="themes" id="themes">
  <button type="button" data-theme="day" aria-pressed="true">☀️ יום</button>
  <button type="button" data-theme="sunset" aria-pressed="false">🌅 שקיעה</button>
  <button type="button" data-theme="ice" aria-pressed="false">❄️ קרח</button>
</div>
<div class="controls">
  <label>פירוט <input id="detail" type="range" min="0" max="2" step="1" value="0"><output id="detailV"></output></label>
  <label>גיוון צבע <input id="vary" type="range" min="0" max="2" step="0.1" value="1"><output id="varyV"></output></label>
  <label>כיוון אור <input id="light" type="range" min="120" max="320" step="2" value="204"><output id="lightV"></output></label>
  <button id="seed" type="button">🎲 צורות אחרות</button>
</div>
<h2>החלקים (התחלת הספרייה)</h2>
<div class="gallery" id="gallery"></div>

<script src="../lowpoly.js"></script>
<script>
const $ = id => document.getElementById(id);
let SEED = 7, THEME = 'day';

function sceneSVG(opts) {
  const T = LP.useTheme(THEME);
  const cam = LP.camera({ ox: 600, oy: 400, lightAz: opts.light, vary: opts.vary });
  const D = opts.detail, s = n => SEED * 101 + n, M = LP.make;

  // sky, sun on the side the light comes from, soft halo
  const sunX = Math.max(140, Math.min(1060, 600 - Math.cos(opts.light * Math.PI / 180) * -520));
  let svg = `<defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${T.sky[0]}"/><stop offset=".6" stop-color="${T.sky[1]}"/><stop offset="1" stop-color="${T.sky[2]}"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="${T.glow}" stop-opacity=".95"/><stop offset=".35" stop-color="${T.glow}" stop-opacity=".5"/><stop offset="1" stop-color="${T.glow}" stop-opacity="0"/></radialGradient>
    <radialGradient id="halo"><stop offset="0" stop-color="#fff" stop-opacity=".4"/><stop offset=".7" stop-color="#fff" stop-opacity=".14"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#sky)"/>
  <circle cx="${sunX}" cy="150" r="230" fill="url(#glow)"/><circle cx="${sunX}" cy="150" r="62" fill="${T.sun}"/>`;

  // background: three ridges, each further one melts more into the sky
  [{ oy: 600, fog: .55, h: 300, seed: 1 }, { oy: 700, fog: .36, h: 230, seed: 2 }, { oy: 815, fog: .2, h: 190, seed: 3 }].forEach(r => {
    const bg = LP.camera({ a: .16, ox: 600, oy: r.oy, lightAz: opts.light, vary: opts.vary });
    svg += LP.draw(M.ridge({ width: 1700, h: r.h, count: 5, seed: s(70 + r.seed), fog: r.fog, snow: .74 }), bg);
  });
  svg += `<circle cx="600" cy="420" r="430" fill="url(#halo)"/>`;

  // far clouds
  const far = [M.cloud({ x: -380, y: 500, z: 140, size: 190, seed: s(1), detail: D, fog: .25 }),
               M.cloud({ x: 330, y: 560, z: 230, size: 230, seed: s(2), detail: D, fog: .3 })];
  svg += `<g class="drift">${far.map(c => LP.draw(c, cam)).join('')}</g>`;

  // island + everything on it, floating together
  const island = M.island({ rx: 360, ry: 210, depth: 330, seed: s(3) });
  const things = [
    M.rock({ x: -95, y: 120, size: 210, h: 1.0, seed: s(10), detail: D + 1 }),
    M.rock({ x: 45, y: 140, size: 170, h: .9, seed: s(11), detail: D + 1 }),
    M.rock({ x: 135, y: 95, size: 110, h: .8, seed: s(12), detail: D }),
    M.rock({ x: 70, y: -125, size: 48, h: .6, seed: s(13), detail: D }),
    M.tree({ x: -205, y: 5, size: 230, seed: s(20), detail: D + 1, kind: 'round' }),
    M.tree({ x: 225, y: -15, size: 200, seed: s(21), detail: D + 1, kind: 'umbrella' }),
    M.tree({ x: -55, y: -60, size: 170, seed: s(22), detail: D + 1, kind: 'branches' }),
    M.tree({ x: 300, y: 70, size: 190, seed: s(23), detail: D + 1, kind: 'tall' }),
    M.pine({ x: -295, y: -40, size: 240, seed: s(30), detail: D }),
    M.pine({ x: 105, y: -55, size: 220, seed: s(31), detail: D }),
    M.pine({ x: -15, y: 80, size: 160, seed: s(32), detail: D }),
    M.pine({ x: 215, y: 120, size: 170, seed: s(33), detail: D }),
    M.pine({ x: -160, y: 140, size: 145, seed: s(34), detail: D }),
    M.bush({ x: -125, y: -125, size: 52, seed: s(40), detail: D }),
    M.bush({ x: 170, y: -125, size: 42, seed: s(41), detail: D }),
    M.bush({ x: -235, y: -120, size: 46, seed: s(42), detail: D }),
    M.bush({ x: 20, y: -160, size: 34, seed: s(43), detail: D }),
    M.bush({ x: 300, y: -40, size: 38, seed: s(44), detail: D }),
  ].sort((a, b) => b.y - a.y); // far first
  const shadows = `<clipPath id="top"><polygon points="${LP.outline(island.top, cam)}"/></clipPath>
    <g clip-path="url(#top)" fill="${T.shadow}" opacity=".36">${things.map(t => LP.castShadow(t, cam)).join('')}</g>`;
  svg += `<g class="float">${LP.draw(island, cam)}${shadows}${things.map(t => LP.draw(t, cam)).join('')}</g>`;

  // small floating rocks
  svg += `<g class="float2">${LP.draw(M.rock({ x: -480, y: -40, z: -150, size: 70, h: 1, seed: s(50), detail: D, mat: LP.mat.earth }), cam)}</g>`;
  svg += `<g class="float3">${LP.draw(M.rock({ x: 470, y: -110, z: -230, size: 52, h: 1, seed: s(51), detail: D, mat: LP.mat.earth }), cam)}</g>`;

  // near cloud
  svg += `<g class="drift2">${LP.draw(M.cloud({ x: -560, y: -250, z: 40, size: 170, seed: s(4), detail: D }), cam)}</g>`;
  return svg;
}

function cardSVG(obj, opts, camOpts) {
  const cam = LP.camera(Object.assign({ lightAz: opts.light, vary: opts.vary }, camOpts));
  const list = LP.facets(obj, cam), b = LP.bounds(list), p = Math.max(b.w, b.h) * .08;
  const T = LP.theme;
  return `<svg viewBox="${(b.x - p).toFixed(0)} ${(b.y - p).toFixed(0)} ${(b.w + 2 * p).toFixed(0)} ${(b.h + 2 * p).toFixed(0)}" style="background:linear-gradient(${T.sky[1]},${T.sky[2]})">${LP.polys(list)}</svg>`;
}

function render() {
  const opts = { detail: +$('detail').value, vary: +$('vary').value, light: +$('light').value };
  $('detailV').textContent = opts.detail; $('varyV').textContent = opts.vary.toFixed(1); $('lightV').textContent = opts.light + '°';
  $('scene').innerHTML = sceneSVG(opts);
  const D = opts.detail, M = LP.make, s = n => SEED * 101 + n;
  const parts = [
    ['עץ עגול', "tree({kind:'round'})", M.tree({ size: 200, seed: s(60), detail: D + 1, kind: 'round' })],
    ['עץ מטריה', "tree({kind:'umbrella'})", M.tree({ size: 200, seed: s(66), detail: D + 1, kind: 'umbrella' })],
    ['עץ ענפים', "tree({kind:'branches'})", M.tree({ size: 200, seed: s(67), detail: D + 1, kind: 'branches' })],
    ['עץ גבוה', "tree({kind:'tall'})", M.tree({ size: 200, seed: s(68), detail: D + 1, kind: 'tall' })],
    ['אורן', 'pine()', M.pine({ size: 220, seed: s(61), detail: D })],
    ['סלע', 'rock()', M.rock({ size: 150, seed: s(62), detail: D + 1 })],
    ['שיח', 'bush()', M.bush({ size: 80, seed: s(63), detail: D })],
    ['ענן', 'cloud()', M.cloud({ size: 200, seed: s(64), detail: D })],
    ['רכס', 'ridge()', M.ridge({ width: 600, h: 260, count: 3, seed: s(69) }), { a: .16 }],
    ['אי', 'island()', M.island({ rx: 200, ry: 120, depth: 190, seed: s(65) })],
  ];
  $('gallery').innerHTML = parts.map(([he, code, obj, co]) => `<div class="card">${cardSVG(obj, opts, co)}<b>${he}</b><code>LP.make.${code}</code></div>`).join('');
}
['detail', 'vary', 'light'].forEach(id => $(id).addEventListener('input', render));
$('seed').addEventListener('click', () => { SEED = Math.floor(Math.random() * 9999) + 1; render(); });
$('themes').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  THEME = b.dataset.theme;
  document.querySelectorAll('#themes button').forEach(x => x.setAttribute('aria-pressed', x === b));
  render();
});
render();
</script>
</body>
</html>
