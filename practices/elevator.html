<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kidodo · הבלש והמעלית</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">

<style>
:root{--ink:#33373b;--night:#171b38;--panel:#20254a;--gold:#FFD65A;--ok:#1FA36A;--bad:#EF5C55;--sky:#2EB6EA}
*{box-sizing:border-box;margin:0}
html,body{overflow:hidden;height:100%}
body{font-family:Rubik,system-ui,sans-serif;color:var(--ink);background:var(--night);-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:0;color:inherit}
button:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
.app{position:relative;display:flex;flex-direction:column;height:100vh;height:100dvh;user-select:none;-webkit-user-select:none}
.scene{position:relative;flex:1;min-height:0;overflow:hidden}
.scene>*{position:absolute}
/* the city and the tower lose their color; every solved case gives some of it back */
.gray{transition:filter 1.2s ease;pointer-events:none}
.bg{inset:0;width:100%;height:100%;display:block}
.blinds{inset:-20%;pointer-events:none;opacity:.5;background:repeating-linear-gradient(172deg,transparent 0 34px,rgba(235,232,255,.10) 38px 52px,transparent 58px 72px);-webkit-mask-image:radial-gradient(circle at 24% 34%,#000 0,transparent 46%);mask-image:radial-gradient(circle at 24% 34%,#000 0,transparent 46%)}
.vig{inset:0;pointer-events:none;z-index:8;background:radial-gradient(ellipse at 50% 48%,transparent 52%,rgba(6,8,24,.62) 100%)}
.side{left:10px;top:10px;direction:ltr;display:flex;gap:6px;z-index:90}
.iconbtn{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#176fbe;background:#F4F8FF;box-shadow:0 4px 0 rgba(0,0,0,.28)}
.iconbtn.off{color:#8b95a5}

.slab.pop{animation:slabIn .3s cubic-bezier(.3,1.5,.5,1) both}
@keyframes slabIn{from{transform:translateY(-30px) scale(.7,1.2);opacity:0}}
.plate{display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;background:rgba(13,16,40,.62);border-radius:8px;z-index:3;transition:transform .25s,background .25s,color .25s;pointer-events:none}
.plate.cur{background:var(--gold);color:#3a2b00;transform:scale(1.22);box-shadow:0 0 14px rgba(255,214,90,.7)}
.glow{border-radius:50%;pointer-events:none;z-index:2;background:radial-gradient(circle,rgba(255,226,130,.95) 0 22%,rgba(255,214,90,.4) 45%,transparent 70%);mix-blend-mode:screen}
.floorhit{background:none;z-index:9;border-radius:6px}
.floorhit:hover{background:rgba(255,240,170,.16)}
.bulb{width:10px;height:10px;border-radius:50%;background:#ff7d6e;box-shadow:0 0 12px 4px rgba(255,110,90,.8);animation:blink 1.8s steps(1) infinite;z-index:3;pointer-events:none}
@keyframes blink{0%,100%{opacity:1}55%{opacity:.1}70%{opacity:.8}78%{opacity:.1}}

.boardx{z-index:6}
.boardx>svg{position:absolute;left:0;top:0}
.pin{position:absolute;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff9d90,#d63a3a 60%,#8f1c22);box-shadow:1px 3px 2px rgba(0,0,0,.4)}
.paper{position:absolute;background:#fbf6e6;border-radius:3px;box-shadow:0 3px 0 rgba(0,0,0,.28);display:flex;align-items:center;justify-content:center;direction:ltr;font-weight:700;color:#2b2f33;transform:rotate(-1deg)}
.paper .n{background:none;font-weight:700;font-size:inherit;line-height:1;padding:0;position:relative;display:flex;align-items:center;justify-content:center;border-radius:50%;transition:opacity .3s,transform .3s,color .3s}
.paper .n.ask{animation:ring 1.1s infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(46,182,234,.75)}70%,100%{box-shadow:0 0 0 11px rgba(46,182,234,0)}}
.paper .n.lit{color:#b06f00;transform:scale(1.18);background:radial-gradient(circle,rgba(255,226,120,.95),rgba(255,226,120,.25) 60%,transparent 72%)}
.paper .dim{opacity:.28}
.paper .s{padding:0 .12em;transition:opacity .3s}
.paper .res{color:#9aa3ad;min-width:.9em;text-align:center}
.paper .res.bad{color:var(--bad);animation:shake .4s}
.paper.blank>*{opacity:0!important;transition:none!important}
.pol.sil svg{filter:brightness(0);opacity:.7}
.pol.show{animation:qm 1s ease-in-out 3}
.paper .res.done{color:var(--ok);animation:mpop .5s}
@keyframes mpop{40%{transform:scale(1.5)}}
.pols{position:absolute;display:flex;justify-content:space-between;direction:rtl}
.pol{background:#fbf6e6;border-radius:2px;display:flex;align-items:center;justify-content:center;color:#b8b09a;font-weight:700;box-shadow:0 2px 0 rgba(0,0,0,.3);overflow:hidden}
.pol.now{outline:2px solid var(--gold)}
.pol.in svg{animation:mpop .5s}

.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.beam{inset:0;width:100%;height:100%;pointer-events:none;z-index:7;transition:opacity .3s}
.lift,.herox{left:0;top:0;will-change:transform;pointer-events:none}
.herox .hop{animation:winHop .5s cubic-bezier(.3,0,.5,1) infinite alternate}
@keyframes winHop{from{transform:translateY(0) scale(1.04,.96)}to{transform:translateY(-14%)}}
.qm{position:absolute;font-weight:700;color:var(--gold);text-shadow:0 2px 0 rgba(0,0,0,.5);animation:qm 1.6s ease-in-out infinite;pointer-events:none}
@keyframes qm{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-8px) rotate(8deg)}}
.friend{z-index:6;pointer-events:none;transform-origin:50% 100%;animation:friendIn .6s cubic-bezier(.3,1.7,.5,1) both}
@keyframes friendIn{from{transform:scale(0)}}
.plus1{z-index:10;font-weight:700;color:var(--gold);text-shadow:0 2px 0 rgba(0,0,0,.55);pointer-events:none;animation:plus 1.1s both;direction:ltr}
@keyframes plus{0%{opacity:0;transform:translateY(14px) scale(.6)}25%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0;transform:translateY(-22px)}}
.stamp{z-index:30;pointer-events:none;border:5px double currentColor;color:#ff6a5e;background:rgba(20,16,36,.55);border-radius:10px;padding:8px 18px;font-weight:700;white-space:nowrap;transform:translate(-50%,-50%) rotate(-12deg);animation:stamp .5s cubic-bezier(.3,1.5,.5,1) both}
@keyframes stamp{from{transform:translate(-50%,-50%) rotate(-30deg) scale(3);opacity:0}60%{transform:translate(-50%,-50%) rotate(-10deg) scale(.92);opacity:1}}

/* the panel under the stage: what is said, and what can be pressed now */
.panel{flex:none;position:relative;z-index:40;background:linear-gradient(180deg,var(--panel),#181c3a);padding:10px 12px max(12px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:9px;align-items:center}
.say{position:relative;width:100%;max-width:820px;background:#fff;border-radius:14px;padding:8px 14px;font-size:17px;line-height:1.3;font-weight:500;min-height:60px;display:flex;align-items:center;gap:10px;text-align:right;cursor:pointer}
.say .tail{position:absolute;top:-11px;border:11px solid transparent;border-bottom-color:#fff;border-top:0;margin-left:-11px;transition:left .25s}
.say .who{flex:none;font-size:13px;font-weight:700;color:#7a5a2e;background:#f4e6cb;border-radius:8px;padding:3px 8px}
.say .who.kid{color:#8f1c22;background:#ffdcd7}
.say .txt{animation:txtIn .3s both}
@keyframes txtIn{from{opacity:0;transform:translateY(6px)}}
.acts{width:100%;min-height:106px;display:flex;align-items:center;justify-content:center;gap:12px;direction:ltr;flex-wrap:wrap}
.big{min-width:84px;height:72px;padding:0 16px;border-radius:18px;font-size:38px;font-weight:700;background:#fff;box-shadow:0 6px 0 rgba(0,0,0,.35);transition:transform .1s}
.big:active,.lbtn:active{transform:translateY(4px)}
.big.good{background:var(--ok);color:#fff}
.lpanel{display:grid;grid-template-columns:repeat(6,48px);gap:6px;background:linear-gradient(160deg,#d9a53a,#a87620);padding:8px;border-radius:16px;box-shadow:inset 0 2px 0 rgba(255,255,255,.4),0 5px 0 rgba(0,0,0,.35)}
.lbtn{width:48px;height:44px;border-radius:50%;font-size:21px;font-weight:700;background:#fffbe9;box-shadow:0 3px 0 rgba(80,50,0,.5)}
.lbtn.on{background:var(--gold);box-shadow:0 0 0 4px #fff,0 0 18px var(--gold)}
.skipb{height:46px;padding:0 22px;border-radius:23px;background:rgba(255,255,255,.14);color:#fff;font-size:17px;font-weight:500;direction:rtl}
.pips{display:flex;gap:14px;align-items:center}
.pip{width:52px;height:52px;border-radius:50%;border:4px dashed rgba(255,255,255,.55);color:transparent;font-weight:700;font-size:21px;font-style:normal;display:flex;align-items:center;justify-content:center}
.pip.f{background:var(--gold);border:0;color:#3a2b00;animation:mpop .35s}
.pip.f.over{background:var(--bad);color:#fff}
@media(min-width:700px){.say{font-size:20px;padding:10px 18px}.acts{min-height:92px}.lpanel{grid-template-columns:repeat(11,54px)}.lbtn{width:54px;height:52px;font-size:24px}}
@media(min-width:700px) and (max-height:700px){.say{font-size:18px;min-height:50px;padding:6px 16px}.acts{min-height:80px}.big{height:64px}}
/* a low wide window (phone on its side): the panel sits beside the stage */
@media(max-height:480px) and (min-aspect-ratio:5/4){.app{flex-direction:row}.panel{width:44%;justify-content:center;order:0}.scene{order:1}.say .tail{display:none}.lpanel{grid-template-columns:repeat(4,48px)}.acts{min-height:0}.big{height:60px}.big{min-width:68px}}

.wchest{background:none;padding:0;line-height:0;filter:drop-shadow(0 6px 0 rgba(0,0,0,.3))}
.wchest.idle .chest{animation:chestCall 1.6s ease-in-out infinite;transform-origin:50% 100%}
@keyframes chestCall{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(-5deg) scale(1.04)}80%{transform:rotate(5deg) scale(1.04)}90%{transform:rotate(-3deg)}}
.party{position:absolute;left:0;right:0;bottom:max(12px,env(safe-area-inset-bottom));display:flex;align-items:flex-end;justify-content:center;gap:4px;direction:ltr;z-index:60}
.party .f{animation:friendIn .6s cubic-bezier(.3,1.7,.5,1) both}
.party .f>div{animation:winHop .55s cubic-bezier(.3,0,.5,1) infinite alternate}
.chestin{animation:friendIn .7s cubic-bezier(.3,1.6,.5,1) both;transform-origin:50% 100%}
.hand{position:absolute;left:0;top:0;z-index:70;pointer-events:none;opacity:0;filter:drop-shadow(0 4px 4px rgba(0,0,0,.4))}
.pt{position:fixed;pointer-events:none;z-index:999;will-change:transform,opacity}
.coinp{position:fixed;left:0;top:0;pointer-events:none;z-index:1001;will-change:transform,opacity;line-height:0}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:20px;z-index:80}
.endscreen{background:rgba(16,19,46,.62);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.stars{display:flex;gap:14px;align-items:flex-end}
.star{width:min(26vw,120px);aspect-ratio:100/96;animation:starIn .55s cubic-bezier(.3,1.6,.5,1) both}
.star:nth-child(2){width:min(32vw,150px)}
@keyframes starIn{from{transform:scale(0) rotate(-40deg);opacity:0}}
.rise{animation:rise .5s ease-out both}
@keyframes rise{from{transform:translateY(24px);opacity:0}}
.endbtns{position:absolute;left:0;right:0;bottom:max(22px,5dvh);display:flex;justify-content:center;gap:clamp(56px,22vw,220px)}
.endbtn{width:112px;height:64px;display:flex;align-items:center;justify-content:center;clip-path:polygon(16px 0,calc(100% - 16px) 0,100% 50%,calc(100% - 16px) 100%,16px 100%,0 50%);transition:transform .12s}
.endbtn:active{transform:scale(.93)}
.endbtn.next{background:linear-gradient(180deg,#2f8f62 0 50%,#237a52 50%)}
.endbtn.again{background:linear-gradient(180deg,#2f5f9e 0 50%,#244f88 50%)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01s!important;animation-iteration-count:1!important;transition-duration:.01s!important}}
</style>

<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const {useState,useEffect,useLayoutEffect,useRef,useMemo} = React;

/* ---------- the game's numbers — change them here, not in the logic ---------- */
const CFG={
  CASES:5,
  BIG:[4,8], TOP:10,              // the big number, and the highest floor
  SMALL:[2,3,2,3,1],              // the small numbers (shuffled; the first case is never 1)
  HIDE_FROM:2,                    // from this case (0 = first) the floor numbers above the big number are hidden: the child counts alone
  FIRST:[8,2],                    // the first riddle of the first game (with the monster)
  DEMO:[5,2],                     // the exercise of the opening explanation
  BPM:96, MUSIC_VOL:.5,
};

/* ---------- helpers ---------- */
const SPOKEN=['אֶפֶס','אַחַת','שְׁתַּיִם','שָׁלוֹשׁ','אַרְבַּע','חָמֵשׁ','שֵׁשׁ','שֶׁבַע','שְׁמוֹנֶה','תֵּשַׁע','עֶשֶׂר'];
const toSpeech=t=>t.replace(/[⁦-⁩]/g,'').replace(/\s*\+\s*/g,' ועוד ').replace(/\d+/g,m=>SPOKEN[+m]??m);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const rand=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rand(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const REDUCE=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const floorsWord=k=>k===1?'קומה אחת':k+' קומות';
const ORD=['ראשונה','שנייה','שלישית','רביעית','חמישית'];
const exText=(a,b)=>`\u2066${a} + ${b}\u2069`;      // an exercise inside a Hebrew sentence, left to right
/* five different cases. In about half of them the small number is written first, so the child really looks for the big one */
function makeCases(first){
  let sm;do{sm=shuffle(CFG.SMALL)}while(sm[0]===1);
  const flip=[false,...shuffle([true,true,false,true].slice(0,CFG.CASES-1))], used=new Set(), who=shuffle(FRIENDS).sort((a,b)=>(b.id==='monster')-(a.id==='monster'));   // the monster hides first
  if(first)sm[0]=CFG.FIRST[1];
  return sm.slice(0,CFG.CASES).map((small,i)=>{
    let big,n=0;if(first&&i===0)big=CFG.FIRST[0];else do{big=rand(CFG.BIG[0],Math.min(CFG.BIG[1],CFG.TOP-small))}while(used.has(big+'+'+small)&&n++<40);
    used.add(big+'+'+small);
    const ans=big+small, lo=Math.min(CFG.TOP-2,Math.max(big+1,ans-2)), s=rand(lo,Math.max(lo,Math.min(ans,CFG.TOP-2)));   // three floors above the big number, the right one among them
    return {big,small,ans,flip:flip[i],a:flip[i]?small:big,b:flip[i]?big:small,opts:[s,s+1,s+2],friend:who[i]};
  });
}

/* ---------- sound: everything made in code (Web Audio), no files ---------- */
let heVoice=null, actx=null, soundOn=true, musicOn=true, noiseBuf=null, musicGain=null;
const hasTTS=typeof window!=='undefined'&&'speechSynthesis' in window;
function loadVoice(){try{const hv=speechSynthesis.getVoices().filter(v=>/^(he|iw)/i.test(v.lang));heVoice=hv.find(v=>/avri|asaf|male/i.test(v.name)&&!/female/i.test(v.name))||hv[0]||null}catch(e){}}
if(hasTTS){loadVoice();try{speechSynthesis.onvoiceschanged=loadVoice}catch(e){}}
function audio(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();music()}catch(e){}}
function tone(f,d=.15,type='triangle',vol=.12,slideTo,at=0,out){
  if(!actx||(!soundOn&&!out))return;
  try{const t=actx.currentTime+at,o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
    if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,t+d);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g).connect(out||actx.destination);o.start(t);o.stop(t+d)}catch(e){}
}
function noise(d,{type='bandpass',f=800,f2,q=1,vol=.25,at=0,out}={}){
  if(!actx||(!soundOn&&!out))return;
  try{
    if(!noiseBuf){noiseBuf=actx.createBuffer(1,actx.sampleRate,actx.sampleRate);const ch=noiseBuf.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=Math.random()*2-1}
    const t=actx.currentTime+at,s=actx.createBufferSource(),fl=actx.createBiquadFilter(),g=actx.createGain();
    s.buffer=noiseBuf;fl.type=type;fl.Q.value=q;fl.frequency.setValueAtTime(f,t);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+d);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
    s.connect(fl).connect(g).connect(out||actx.destination);s.start(t);s.stop(t+d)}catch(e){}
}
const NOTES=[262,294,330,349,392,440,494,523,587,659,698];
const sfx={
  pop(){tone(500,.09,'sine',.1,1400)},
  build(){tone(70,.16,'sine',.35,48);noise(.1,{type:'lowpass',f:420,vol:.35})},
  lamp(){noise(.03,{f:3000,q:2,vol:.3});tone(2500,.05,'square',.035)},
  tap(){tone(520,.06,'sine',.08)},
  motor(s){tone(90,s,'sawtooth',.045,130);tone(45,s,'triangle',.1,65)},
  ding(){tone(659,1.1,'sine',.16);tone(523,1.6,'sine',.16,undefined,.32);tone(1318,.8,'sine',.04);tone(1046,1,'sine',.04,undefined,.32)},
  foot(at=0){noise(.07,{type:'lowpass',f:380,vol:.4,at})},
  count(f){tone(NOTES[f]*1.5,.22,'triangle',.14)},
  buzz(){tone(110,.16,'sawtooth',.09);tone(116,.16,'square',.05);tone(92,.22,'sawtooth',.09,undefined,.2);tone(98,.22,'square',.05,undefined,.2)},
  tada(){[523,659,784,1047].forEach((f,i)=>tone(f,i===3?.6:.2,'triangle',.14,undefined,i*.11))},
  stamp(){tone(55,.3,'sine',.5,40);noise(.18,{f:1400,f2:500,q:.8,vol:.28})},
  coin(){tone(988,.08,'square',.05);tone(1319,.25,'square',.05,undefined,.08)},
  jackpot(){tone(330,.12,'square',.05);tone(660,.1,'square',.05,undefined,.07);
    for(let i=0;i<7;i++){const at=.14+i*.07+Math.random()*.05,f=1600+Math.random()*900;tone(f,.09,'triangle',.08,undefined,at);tone(f*1.5,.12,'sine',.06,undefined,at+.045)}},
};
/* walking bass in A minor + a soft brush between the beats. Scheduled on the audio clock, so the course's pause stops it too */
const BASS=[110,130.8,146.8,164.8,196,164.8,146.8,123.5];
let mNext=0,mStep=0,mTimer=null;
function music(){
  if(!musicGain){musicGain=actx.createGain();musicGain.gain.value=musicOn?CFG.MUSIC_VOL:0;musicGain.connect(actx.destination)}
  if(mTimer)return;
  mNext=actx.currentTime+.15;
  mTimer=setInterval(()=>{
    if(!actx||actx.state!=='running')return;
    if(mNext<actx.currentTime-.5)mNext=actx.currentTime+.05;      // after a pause: go on from now
    const beat=60/CFG.BPM;
    while(mNext<actx.currentTime+.35){
      const at=mNext-actx.currentTime;
      if(musicOn&&at>=0){
        tone(BASS[mStep%8]/2*1.0,beat*.85,'triangle',.22,undefined,at,musicGain);tone(BASS[mStep%8],beat*.5,'sine',.05,undefined,at,musicGain);
        noise(.06,{type:'highpass',f:6500,vol:mStep%2?.05:.025,at:at+beat*.64,out:musicGain});
        if(mStep%2)noise(.12,{f:4200,q:.5,vol:.03,at,out:musicGain});
      }
      mStep++;mNext+=beat;
    }
  },120);
}
function duck(on){try{if(musicGain)musicGain.gain.setTargetAtTime(musicOn?(on?CFG.MUSIC_VOL*.4:CFG.MUSIC_VOL):0,actx.currentTime,.12)}catch(e){}}
const log=(ev,data)=>console.log('[kidodo]',ev,data||'');
const KP=window.KidodoPractice||{inCourse:false,answer(){},complete:()=>Promise.resolve(),next(){location.reload()},exit(){history.back()}};

/* ---------- particles (same as the bridge game) ---------- */
function burst(x0,y0,colors,n=22,spread=1){
  for(let i=0;i<n;i++){
    const p=document.createElement('div');p.className='pt';const s=5+Math.random()*9;
    p.style.cssText=`left:${x0}px;top:${y0}px;width:${s}px;height:${s}px;background:${colors[i%colors.length]};`+(i%3===0?'border-radius:50%;':i%3===1?'clip-path:polygon(50% 0,100% 100%,0 100%);':'border-radius:2px;');
    document.body.appendChild(p);

    const a=p.animate([{transform:'translate(0,0)',opacity:1},{transform:`translate(${dx*.7}px,${dy*.7}px) rotate(${Math.random()*360}deg)`,opacity:1,offset:.55},

  /* one floor up or down the stairs */

  /* the opening: the detective explains the key, and the scene shows it */

          :i===0?`אנחנו בקומה ${c.big}. עכשיו נטפס עוד ${rest}. לאיזו קומה נגיע?`
          :hidden?`המספרים במגדל נעלמו, סופרים לבד! מטפסים עוד ${floorsWord(c.small)}. לאיזו קומה נגיע?`

          {(()=>{const dx=beam.x-beam.tx,dy=beam.y-beam.ty,L=Math.hypot(dx,dy)||1,nx=-dy/L,ny=dx/L,r=beam.r;return <>
            <polygon points={[[beam.tx+nx*5,beam.ty+ny*5],[beam.x+nx*r,beam.y+ny*r],[beam.x-nx*r,beam.y-ny*r],[beam.tx-nx*5,beam.ty-ny*5]].map(p=>p.map(v=>v.toFixed(1)).join(',')).join(' ')} fill="url(#bm)"/>
            <circle cx={beam.x} cy={beam.y} r={r} fill="#FFE9A8" opacity=".26"/></>})()}</svg>}
        {stamp&&<div className="stamp" style={{left:cx0+leftW*.52,top:by+bh+Math.max(30,(H-by-bh-stH)*.3),fontSize:Math.max(20,Math.min(44,leftW*.125))}}>החידה נפתרה!</div>}
        <div className="vig"/>
        <div className="side">
          {KP.embedded?<span style={{width:44,height:44}} aria-hidden="true"/>:<button className="iconbtn" title="יציאה" aria-label="יציאה" onClick={()=>{hush();KP.exit()}}>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>}
          <button className={'iconbtn'+(sound?'':' off')} title="אפקטים" aria-label="אפקטים ודיבור" aria-pressed={sound} onClick={toggleSound}><SpeakerIcon on={sound}/></button>
          <button className={'iconbtn'+(mus?'':' off')} title="מוזיקה" aria-label="מוזיקה" aria-pressed={mus} onClick={toggleMusic}><MusicIcon on={mus}/></button>
        </div>
      </div>
      <div className="panel">
        <div className="say" onClick={skip} style={{visibility:bub.text?'visible':'hidden'}}>
          <span className="tail" style={{left:`clamp(24px,${(speakerX-(W-Math.min(W-24,820))/2).toFixed(0)}px,calc(100% - 24px))`}}/>
          <span className={'who'+(bub.who==='kid'?' kid':'')}>{bub.who==='kid'?'העוזר':'הבלש'}</span>
          <span className="txt" key={bub.n} aria-live="polite">{bub.text||'…'}</span></div>
        <div className="acts" role="group" aria-label="מה עושים עכשיו">
          {stage==='pick'&&[C.a,C.b].map((v,i)=><button key={i} className={'big'+(shake.k==='small'&&v===C.small?' shake':'')} onClick={()=>pick(v)}>{v}</button>)}
          {(stage==='lift'||stage==='ride')&&<div className="lpanel">{mk(11).map((_,f)=><button key={f+(shake.k==='f'+f?'-'+shake.n:'')} className={'lbtn'+(lbtn===f?' on':'')+(shake.k==='f'+f?' shake':'')} disabled={stage!=='lift'} aria-label={'קומה '+f} onClick={()=>floor(f)}>{f}</button>)}</div>}
          {demo&&stage!=='intro'&&<button className="skipb" style={stage==='climb'?{order:2}:null} onClick={skipIntro}>דילוג על ההסבר</button>}
          {stage==='climb'&&<div className="pips" role="img" aria-label={`${steps} מתוך ${C.small}`}>{mk(Math.max(C.small,steps)).map((_,i)=><i key={i} className={'pip'+(i<steps?' f':'')+(i>=C.small?' over':'')}>+1</i>)}</div>}
          {(stage==='answer'||stage==='solved')&&C.opts.map(v=><button key={v+(shake.k==='a'+v?'-'+shake.n:'')} className={'big'+(good===v?' good':'')+(shake.k==='a'+v?' shake':'')} disabled={stage!=='answer'} onClick={()=>choose(v)}>{v}</button>)}
        </div>
      </div>
      {endStage&&endStage!=='done'&&<div className="party">
        {cases.slice(0,2).map((c,i)=><div key={i} className="f" style={{animationDelay:.1*i+'s'}}><div style={{animationDelay:.13*i+'s'}}><Friend f={c.friend} h={fS*1.1} w={fS}/></div></div>)}
        <div className="chestin"><button ref={chestRef} className={'wchest'+(endStage==='chest'?' idle':'')} aria-label="לפתוח את תיבת האוצר" onClick={tapChest}><Chest open={lidOpen} s={chS}/></button></div>
        {cases.slice(2).map((c,i)=><div key={i} className="f" style={{animationDelay:.2+.1*i+'s'}}><div style={{animationDelay:.2+.13*i+'s'}}><Friend f={c.friend} h={fS*1.1} w={fS}/></div></div>)}
      </div>}
      {hand&&<TapHand x={hand.x} y={hand.y}/>}
      {endStage==='done'&&(()=>{const n=starCount(mistakes());return(
        <div className="center endscreen" style={{justifyContent:'flex-start',paddingTop:'max(70px,13dvh)'}}>
          <div className="stars" dir="ltr">{[0,1,2].map(i=><div key={i} className="star" style={{animationDelay:.15+i*.35+'s'}}><StarIcon on={i<n}/></div>)}</div>
          <div className="endbtns rise" style={{animationDelay:'1.2s'}}>
            <button className="endbtn again" onClick={start} aria-label="שוב" title="שוב">
              <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2.8" strokeLinecap="round" strokeLinejoin="round"><path d="M4 12a8 8 0 1 0 2.5-5.8"/><path d="M4 4v5h5"/></svg></button>
            <button className="endbtn next" onClick={goNext} disabled={leaving} aria-label="המשך" title="המשך">
              <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2.8" strokeLinecap="round" strokeLinejoin="round"><path d="M20 12H4M10 6l-6 6 6 6"/></svg></button>
          </div>
        </div>)})()}
    </div>);
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
