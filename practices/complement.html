<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kidodo · התאומים של 10</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>

<style>
:root{--ink:#33373b;--panel:#1d3b4a;--gold:#FFD65A;--ok:#1FA36A;--bad:#EF5C55;--sky:#2EB6EA;--blue:#3d8fe0;--twin:#FFB648}
*{box-sizing:border-box;margin:0}
html,body{overflow:hidden;height:100%}
body{font-family:Rubik,system-ui,sans-serif;color:var(--ink);background:#bfe6f5;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:0;color:inherit}
button:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
.app{position:relative;display:flex;flex-direction:column;height:100vh;height:100dvh;user-select:none;-webkit-user-select:none}
.scene{position:relative;flex:1;min-height:0;overflow:hidden}
.scene>*{position:absolute}
.bg{inset:0;width:100%;height:100%;display:block}
.cloud{animation:cloudDrift linear infinite}
@keyframes cloudDrift{from{transform:translateX(-220px)}to{transform:translateX(1300px)}}
.vig{inset:0;pointer-events:none;z-index:8;background:radial-gradient(ellipse at 50% 48%,transparent 58%,rgba(10,40,60,.28) 100%)}
.side{left:10px;top:10px;direction:ltr;display:flex;gap:6px;z-index:90}
.iconbtn{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#176fbe;background:#F4F8FF;box-shadow:0 4px 0 rgba(0,0,0,.22)}
.iconbtn.off{color:#8b95a5}

.slab.pop{animation:slabIn .3s cubic-bezier(.3,1.5,.5,1) both}
@keyframes slabIn{from{transform:translateY(-30px) scale(.7,1.2);opacity:0}}
.plate{display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;background:rgba(20,52,70,.7);border-radius:8px;z-index:3;transition:transform .25s,background .25s,color .25s;pointer-events:none;animation:friendIn .4s cubic-bezier(.3,1.7,.5,1)}
.plate.goal{background:#fff;color:#23866E;box-shadow:0 0 0 3px #58C9AD}
.plate.cur{background:var(--gold);color:#3a2b00;transform:scale(1.22);box-shadow:0 0 14px rgba(255,214,90,.7)}
.glow{border-radius:50%;pointer-events:none;z-index:2;background:radial-gradient(circle,rgba(255,236,150,.95) 0 22%,rgba(255,214,90,.4) 45%,transparent 70%)}

.cube{position:absolute;border-radius:5px;z-index:2;pointer-events:none;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.35);animation:cubeIn .22s cubic-bezier(.3,1.6,.5,1) both}
.cube.a{background:linear-gradient(180deg,#6fb3f2 0 22%,var(--blue) 22% 82%,#2a6fb8 82%)}
.cube.b{background:linear-gradient(180deg,#ffd28a 0 22%,var(--twin) 22% 82%,#e08f22 82%)}
.cube.empty{background:rgba(255,255,255,.35);border:3px dashed #2a6fb8;animation-name:cubeFade}
@keyframes cubeIn{from{transform:translateY(-22px) scale(.6);opacity:0}}
@keyframes cubeFade{from{opacity:0}}

.boardx{z-index:6}
.boardx>svg{position:absolute;left:0;top:0}
.pin{position:absolute;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff9d90,#d63a3a 60%,#8f1c22);box-shadow:1px 3px 2px rgba(0,0,0,.4)}
.paper{position:absolute;background:#fbf6e6;border-radius:3px;box-shadow:0 3px 0 rgba(0,0,0,.28);display:flex;align-items:center;justify-content:center;direction:ltr;font-weight:700;color:#2b2f33;transform:rotate(-1deg)}
.paper .n{background:none;font-weight:700;font-size:inherit;line-height:1;padding:0;position:relative;display:flex;align-items:center;justify-content:center;border-radius:8px;transition:opacity .3s,transform .3s,color .3s}
.paper .n.box{border:3px dashed #9aa3ad;background:rgba(255,255,255,.6)}
.paper .n.box.ask{border-color:var(--sky);animation:ring 1.1s infinite}
.paper .n.box.known{border-color:transparent;background:none;color:#2b2f33;animation:mpop .5s}
.paper .n.guess{color:#9aa3ad}
.paper .n.bad{color:var(--bad);animation:shake .4s}
.paper .n.done{color:var(--ok);animation:mpop .5s}
.paper .n.box.done{border-color:transparent;background:none}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(46,182,234,.75)}70%,100%{box-shadow:0 0 0 11px rgba(46,182,234,0)}}
.paper .n.lit{transform:scale(1.15);background:radial-gradient(circle,rgba(255,226,120,.95),rgba(255,226,120,.25) 60%,transparent 72%)}
.paper .dim{opacity:.3}
.paper .s{padding:0 .1em;transition:opacity .3s}
.paper.blank>*{opacity:0!important;transition:none!important}
.pol.sil svg{filter:brightness(0);opacity:.7}
@keyframes mpop{40%{transform:scale(1.5)}}
.pols{position:absolute;display:flex;justify-content:space-between;direction:rtl}
.pol{background:#fbf6e6;border-radius:2px;display:flex;align-items:center;justify-content:center;color:#b8b09a;font-weight:700;box-shadow:0 2px 0 rgba(0,0,0,.3);overflow:hidden}
.pol.now{outline:2px solid var(--gold)}
.pol.in svg{animation:mpop .5s}

.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.beam{inset:0;width:100%;height:100%;pointer-events:none;z-index:7;transition:opacity .3s}
.lift,.herox{left:0;top:0;will-change:transform;pointer-events:none}
.herox .hop{animation:winHop .5s cubic-bezier(.3,0,.5,1) infinite alternate}
@keyframes winHop{from{transform:translateY(0) scale(1.04,.96)}to{transform:translateY(-14%)}}
.qm{position:absolute;font-weight:700;color:var(--gold);text-shadow:0 2px 0 rgba(0,0,0,.45);animation:qm 1.6s ease-in-out infinite;pointer-events:none;z-index:6}
@keyframes qm{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-8px) rotate(8deg)}}
.friend{z-index:6;pointer-events:none;transform-origin:50% 100%;animation:friendIn .6s cubic-bezier(.3,1.7,.5,1) both}
@keyframes friendIn{from{transform:scale(0)}}
.stamp{z-index:30;pointer-events:none;border:5px double currentColor;color:#1f8a5c;background:rgba(255,255,255,.82);border-radius:10px;padding:8px 18px;font-weight:700;white-space:nowrap;transform:translate(-50%,-50%) rotate(-12deg);animation:stamp .5s cubic-bezier(.3,1.5,.5,1) both}
@keyframes stamp{from{transform:translate(-50%,-50%) rotate(-30deg) scale(3);opacity:0}60%{transform:translate(-50%,-50%) rotate(-10deg) scale(.92);opacity:1}}
.walker{left:0;top:0;will-change:transform;pointer-events:none;z-index:0}

/* the panel under the stage: what is said, and what can be pressed now */
.panel{flex:none;position:relative;z-index:40;background:linear-gradient(180deg,var(--panel),#132a36);padding:10px 12px max(12px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:9px;align-items:center}
.say{position:relative;width:100%;max-width:820px;background:#fff;border-radius:14px;padding:8px 14px;font-size:17px;line-height:1.3;font-weight:500;min-height:60px;display:flex;align-items:center;gap:10px;text-align:right;cursor:pointer}
.say .tail{position:absolute;top:-11px;border:11px solid transparent;border-bottom-color:#fff;border-top:0;margin-left:-11px;transition:left .25s}
.say .who{flex:none;font-size:13px;font-weight:700;color:#7a5a2e;background:#f4e6cb;border-radius:8px;padding:3px 8px}
.say .who.kid{color:#8f1c22;background:#ffdcd7}
.say .txt{animation:txtIn .3s both}
@keyframes txtIn{from{opacity:0;transform:translateY(6px)}}
.acts{width:100%;min-height:112px;display:flex;align-items:center;justify-content:center;gap:10px;direction:ltr}
/* the elevator's buttons, 1–9 */
.keys{display:grid;grid-template-columns:repeat(5,50px);gap:6px 7px;direction:ltr}
.key{width:50px;height:50px;border-radius:50%;font-size:25px;font-weight:700;color:#3a2b00;background:radial-gradient(circle at 50% 38%,#fffaf0 0 55%,#f1e4c4 75%);box-shadow:0 0 0 3px #d9ac3c,0 5px 0 rgba(0,0,0,.35);transition:transform .1s}
.key:active{transform:translateY(3px)}
.key.good,.key.pressed{background:var(--ok);color:#fff;box-shadow:0 0 0 3px #137a4c,0 5px 0 rgba(0,0,0,.35)}
.key:disabled{cursor:default}
.key.fall{animation:fall .9s cubic-bezier(.5,0,.8,.6) forwards;pointer-events:none}
@keyframes fall{0%{transform:none}15%{transform:translateY(-6px) rotate(-8deg)}100%{transform:translateY(160px) rotate(40deg);opacity:0}}
.key.gone{visibility:hidden}
.watch{flex:none;width:48px;height:56px;position:relative}
.watch svg{display:block}
.watch.over{animation:shake .4s}
.skipb{height:46px;padding:0 22px;border-radius:23px;background:rgba(255,255,255,.16);color:#fff;font-size:17px;font-weight:500;direction:rtl}
@media(min-width:700px){.say{font-size:20px;padding:10px 18px}.keys{grid-template-columns:repeat(9,58px);gap:8px}.key{width:58px;height:58px;font-size:28px}.acts{min-height:86px}}
@media(min-width:700px) and (max-height:700px){.say{font-size:18px;min-height:50px;padding:6px 16px}.acts{min-height:76px}}
/* a low wide window (phone on its side): the panel sits beside the stage */
@media(max-height:480px) and (min-aspect-ratio:5/4){.app{flex-direction:row}.panel{width:44%;justify-content:center;order:0}.scene{order:1}.say .tail{display:none}.acts{min-height:0}.keys{grid-template-columns:repeat(5,46px);gap:6px}.key{width:46px;height:46px;font-size:23px}}

.wchest{background:none;padding:0;line-height:0;filter:drop-shadow(0 6px 0 rgba(0,0,0,.25))}
.wchest.idle .chest{animation:chestBreath 1.1s ease-in-out infinite;transform-origin:50% 100%}
@keyframes chestBreath{0%,100%{transform:scale(1)}50%{transform:scale(1.13)}}
.hand{position:absolute;left:0;top:0;z-index:70;pointer-events:none;opacity:0;filter:drop-shadow(0 4px 4px rgba(0,0,0,.4))}
.pt{position:fixed;pointer-events:none;z-index:999;will-change:transform,opacity}
.coinp{position:fixed;left:0;top:0;pointer-events:none;z-index:1001;will-change:transform,opacity;line-height:0}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:20px;z-index:80}
.playb{width:112px;height:112px;border-radius:50%;background:#176fbe;box-shadow:0 8px 0 rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;padding-left:8px;animation:chestBreath 1.4s ease-in-out infinite}
.endscreen{background:rgba(16,40,56,.55);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.stars{display:flex;gap:14px;align-items:flex-end}
.star{width:min(26vw,120px);aspect-ratio:100/96;animation:starIn .55s cubic-bezier(.3,1.6,.5,1) both}
.star:nth-child(2){width:min(32vw,150px)}
@keyframes starIn{from{transform:scale(0) rotate(-40deg);opacity:0}}
.rise{animation:rise .5s ease-out both}
@keyframes rise{from{transform:translateY(24px);opacity:0}}
.endbtns{position:absolute;left:0;right:0;bottom:max(22px,5dvh);display:flex;justify-content:center;gap:clamp(56px,22vw,220px)}
/* end buttons: bevelled tiles like the rocks of ״תאומי עשר״ (one shape for every game), a white icon on the face */
.endbtn{width:92px;height:92px;display:flex;align-items:center;justify-content:center;background:none center/100% 100% no-repeat;filter:drop-shadow(0 6px 0 rgba(20,10,40,.28));transition:transform .12s}
.endbtn svg{width:40px;height:40px}
.endbtn:active{transform:scale(.93)}
.endbtn:disabled{opacity:.6}
.endbtn.next{background-image:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22 preserveAspectRatio=%22none%22%3E%3Cpolygon points=%2212,0 88,0 74,19 26,19%22 fill=%22%2372c09a%22 stroke=%22%2372c09a%22 stroke-width=%22.6%22/%3E%3Cpolygon points=%2288,0 100,12 81,26 74,19%22 fill=%22%235db78c%22 stroke=%22%235db78c%22 stroke-width=%22.6%22/%3E%3Cpolygon points=%22100,12 100,88 81,74 81,26%22 fill=%22%23288c5c%22 stroke=%22%23288c5c%22 stroke-width=%22.6%22/%3E%3Cpolygon points=%22100,88 88,100 74,81 81,74%22 fill=%22%23257f53%22 stroke=%22%23257f53%22 stroke-width=%22.6%22/%3E%3Cpolygon points=%2288,100 12,100 26,81 74,81%22 fill=%22%2322774e%22 stroke=%22%2322774e%22 stroke-width=%22.6%22/%3E%3Cpolygon points=%2212,100 0,88 19,74 26,81%22 fill=%22%232c9965%22 stroke=%22%232c9965%22 stroke-width=%22.6%22/%3E%3Cpolygon points=%220,88 0,12 19,26 19,74%22 fill=%22%234cb080%22 stroke=%22%234cb080%22 stroke-width=%22.6%22/%3E%3Cpolygon points=%220,12 12,0 26,19 19,26%22 fill=%22%2361b98f%22 stroke=%22%2361b98f%22 stroke-width=%22.6%22/%3E%3Cpolygon points=%2226,19 74,19 81,26 81,74 74,81 26,81 19,74 19,26%22 fill=%22%232fa36b%22/%3E%3Cpolygon points=%2226,19 74,19 70,24 30,24%22 fill=%22%2348ae7d%22/%3E%3C/svg%3E")}
.endbtn.again{background-image:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22 preserveAspectRatio=%22none%22%3E%3Cpolygon points=%2212,0 88,0 74,19 26,19%22 fill=%22%237b9dea%22 stroke=%22%237b9dea%22 stroke-width=%22.6%22/%3E%3Cpolygon points=%2288,0 100,12 81,26 74,19%22 fill=%22%23688fe7%22 stroke=%22%23688fe7%22 stroke-width=%22.6%22/%3E%3Cpolygon points=%22100,12 100,88 81,74 81,26%22 fill=%22%23345fc1%22 stroke=%22%23345fc1%22 stroke-width=%22.6%22/%3E%3Cpolygon points=%22100,88 88,100 74,81 81,74%22 fill=%22%233057af%22 stroke=%22%233057af%22 stroke-width=%22.6%22/%3E%3Cpolygon points=%2288,100 12,100 26,81 74,81%22 fill=%22%232d51a4%22 stroke=%22%232d51a4%22 stroke-width=%22.6%22/%3E%3Cpolygon points=%2212,100 0,88 19,74 26,81%22 fill=%22%233968d3%22 stroke=%22%233968d3%22 stroke-width=%22.6%22/%3E%3Cpolygon points=%220,88 0,12 19,26 19,74%22 fill=%22%235883e4%22 stroke=%22%235883e4%22 stroke-width=%22.6%22/%3E%3Cpolygon points=%220,12 12,0 26,19 19,26%22 fill=%22%236c92e7%22 stroke=%22%236c92e7%22 stroke-width=%22.6%22/%3E%3Cpolygon points=%2226,19 74,19 81,26 81,74 74,81 26,81 19,74 19,26%22 fill=%22%233D6FE0%22/%3E%3Cpolygon points=%2226,19 74,19 70,24 30,24%22 fill=%22%235480e4%22/%3E%3C/svg%3E")}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01s!important;animation-iteration-count:1!important;transition-duration:.01s!important}.cloud{animation:none}}

<div id="root"></div>
<script type="text/babel" data-presets="react">
const {useState,useEffect,useLayoutEffect,useRef,useMemo} = React;

/* ---------- the game's numbers — change them here, not in the logic ---------- */
const CFG={
  CASES:5, TOP:10,
  FIRST:8,                        // the known number of the first riddle of the first game
  GUESS_S:10,                     // the stopwatch: seconds to guess
  PAIRS:[[1,9],[2,8],[3,7],[4,6],[5,5]],   // the opening explanation
  SUPPORT_AFTER:2,                // mistakes in one riddle → the cubes of the known number + empty cubes up to 10
  BPM:100, MUSIC_VOL:.45,
};

/* ---------- helpers ---------- */
const SPOKEN=['אֶפֶס','אַחַת','שְׁתַּיִם','שָׁלוֹשׁ','אַרְבַּע','חָמֵשׁ','שֵׁשׁ','שֶׁבַע','שְׁמוֹנֶה','תֵּשַׁע','עֶשֶׂר'];
const toSpeech=t=>t.replace(/[⁦-⁩]/g,'').replace(/\s*\+\s*/g,' ועוד ').replace(/\s*=\s*/g,' זה ').replace(/\d+/g,m=>SPOKEN[+m]??m);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const rand=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rand(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const REDUCE=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const ORD=['ראשונה','שנייה','שלישית','רביעית','חמישית'];
const exText=t=>`⁦${t}⁩`;      // an exercise inside a Hebrew sentence, left to right
/* five riddles, five different known numbers. The known number sits in the left box or the right one (never three times the same) */
function makeCases(first){
  let nums;do{nums=shuffle([1,2,3,4,5,6,7,8,9]).slice(0,CFG.CASES)}while(nums.filter(n=>n>=6).length<2||nums.filter(n=>n<=4).length<2);
  if(first&&!nums.includes(CFG.FIRST))nums[0]=CFG.FIRST;else if(first)nums=[CFG.FIRST,...nums.filter(n=>n!==CFG.FIRST)];
  let side=[];do{side=['L',...Array.from({length:CFG.CASES-1},()=>Math.random()<.5?'L':'R')]}while(side.join('').includes('LLL')||side.join('').includes('RRR'));
  const who=shuffle(FRIENDS).slice(0,CFG.CASES-1).concat([TREASURE]);
  return nums.map((a,i)=>({a,b:CFG.TOP-a,side:side[i],friend:who[i]}));
}

/* ---------- sound: everything made in code (Web Audio), no files ---------- */
let heVoice=null, actx=null, soundOn=true, musicOn=true, noiseBuf=null, musicGain=null;
const hasTTS=typeof window!=='undefined'&&'speechSynthesis' in window;
function loadVoice(){try{const hv=speechSynthesis.getVoices().filter(v=>/^(he|iw)/i.test(v.lang));heVoice=hv.find(v=>/avri|asaf|male/i.test(v.name)&&!/female/i.test(v.name))||hv[0]||null}catch(e){}}
if(hasTTS){loadVoice();try{speechSynthesis.onvoiceschanged=loadVoice}catch(e){}}
function audio(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();music()}catch(e){}}
function tone(f,d=.15,type='triangle',vol=.12,slideTo,at=0,out){
  if(!actx||(!soundOn&&!out))return;
  try{const t=actx.currentTime+at,o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
    if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,t+d);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g).connect(out||actx.destination);o.start(t);o.stop(t+d)}catch(e){}
}
function noise(d,{type='bandpass',f=800,f2,q=1,vol=.25,at=0,out}={}){
  if(!actx||(!soundOn&&!out))return;
  try{
    if(!noiseBuf){noiseBuf=actx.createBuffer(1,actx.sampleRate,actx.sampleRate);const ch=noiseBuf.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=Math.random()*2-1}
    const t=actx.currentTime+at,s=actx.createBufferSource(),fl=actx.createBiquadFilter(),g=actx.createGain();
    s.buffer=noiseBuf;fl.type=type;fl.Q.value=q;fl.frequency.setValueAtTime(f,t);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+d);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
    s.connect(fl).connect(g).connect(out||actx.destination);s.start(t);s.stop(t+d)}catch(e){}
}
const NOTES=[262,294,330,349,392,440,494,523,587,659,698];
const sfx={
  pop(){tone(500,.09,'sine',.1,1400)},
  build(){tone(70,.16,'sine',.35,48);noise(.1,{type:'lowpass',f:420,vol:.35})},
  lamp(){noise(.03,{f:3000,q:2,vol:.3});tone(2500,.05,'square',.035)},
  tap(){tone(520,.06,'sine',.08)},
  cube(k){tone(NOTES[Math.min(10,k)]*1.5,.12,'triangle',.1)},
  motor(s){tone(90,s,'sawtooth',.045,130);tone(45,s,'triangle',.1,65)},
  ding(){tone(659,1.1,'sine',.16);tone(523,1.6,'sine',.16,undefined,.32);tone(1318,.8,'sine',.04);tone(1046,1,'sine',.04,undefined,.32)},
  whoosh(){noise(1.1,{f:300,f2:3200,q:.7,vol:.3});tone(200,1,'sine',.08,1400)},
  tick(){tone(1800,.03,'square',.03)},
  buzz(){tone(110,.16,'sawtooth',.09);tone(116,.16,'square',.05);tone(92,.22,'sawtooth',.09,undefined,.2);tone(98,.22,'square',.05,undefined,.2)},
  tada(){[523,659,784,1047].forEach((f,i)=>tone(f,i===3?.6:.2,'triangle',.14,undefined,i*.11))},
  stamp(){tone(55,.3,'sine',.5,40);noise(.18,{f:1400,f2:500,q:.8,vol:.28})},
  fall(){tone(700,.6,'triangle',.08,160)},
  coin(){tone(988,.08,'square',.05);tone(1319,.25,'square',.05,undefined,.08)},
  jackpot(){tone(330,.12,'square',.05);tone(660,.1,'square',.05,undefined,.07);

  const x0=r.left+r.width/2, y0=r.top+r.height*.38, H=window.innerHeight;
  n=Math.min(n,Math.max(0,140-liveCoins)); if(REDUCE)n=Math.min(n,8);

    const T=Math.max(1.1,(-vy+Math.sqrt(vy*vy+2*g*(H-y0+60)))/g), spin=2+Math.floor(Math.random()*4), frames=[];
    for(let k=0;k<=12;k++){const t=T*k/12, x=x0+vx*t-s/2, y=y0+vy*t+.5*g*t*t-s/2;

      for(let i=0;i<list.length;i++){let p=pool[i];if(!p){p=document.createElementNS(SVGNS,'polygon');p.setAttribute('stroke-width','.7');p.setAttribute('stroke-linejoin','round');g.appendChild(p);pool.push(p)}
        const q=list[i].pts,f=list[i].fill;p.setAttribute('points',q[0][0].toFixed(1)+','+q[0][1].toFixed(1)+' '+q[1][0].toFixed(1)+','+q[1][1].toFixed(1)+' '+q[2][0].toFixed(1)+','+q[2][1].toFixed(1));

  useEffect(()=>{const a=ref.current.animate([{transform:`translate(${x-14}px,${y+18}px)`,opacity:1},{transform:`translate(${x-14}px,${y}px) scale(.92)`,opacity:1,offset:.45},
    {transform:`translate(${x-14}px,${y+18}px)`,opacity:1}],{duration:1000,iterations:Infinity,easing:'ease-in-out'});return()=>a.cancel()},[x,y]);
  return <div ref={ref} className="hand"><HandIcon/></div>;
}
const other=s=>s==='L'?'R':'L';
const mk=n=>Array.from({length:n});

/* ---------- app ---------- */
function App(){
  const [cases,setCases]=useState(()=>makeCases(true));
  const [ci,setCi]=useState(0);
  const [stage,setStageS]=useState('intro'), stageRef=useRef('intro');   // explain intro guess ride solved end

  const [bub,setBub]=useState({who:'det',text:'',n:0}), [talk,setTalk]=useState(null);
  const [lit,setLit]=useState(null);                 // 'sum' | 'L' | 'R' : what the flashlight is on
  const [target,setTarget]=useState(null);           // {k:'num',which} | {k:'floor',f}
  const [hint,setHint]=useState(false), [known,setKnown]=useState(false), [who,setWho]=useState(false);

  const [pairs,setPairs]=useState([]);               // the explanation: [{p,q,n}] — the pairs stand side by side, n cubes shown
  const [support,setSupport]=useState(false), [blank,setBlank]=useState(null), [boom,setBoom]=useState(false);   // blank: floors above it are bare walls (nothing to count)
  const [shown,setShown]=useState([]);               // floor numbers on the tower: 10 (the goal), the known number, where the elevator stopped
  const [cur,setCur]=useState(null);
  const [qm,setQm]=useState(false);
  const [stamp,setStamp]=useState(false), [friend,setFriend]=useState(null), [found,setFound]=useState(0), [home,setHome]=useState([]);
  const [pose,setPose]=useState('stand'), [rot,setRot]=useState(0), [expr,setExpr]=useState('happy'), [hop,setHop]=useState(false), [heroOn,setHeroOn]=useState(false), [onStreet,setOnStreet]=useState(false);
  const [mood,setMood]=useState('calm');
  const [sound,setSound]=useState(true), [mus,setMus]=useState(true);
  const [endStage,setEndStageS]=useState(null), endRef=useRef(null), setEndStage=v=>{endRef.current=v;setEndStageS(v)};
  const [lidOpen,setLidOpen]=useState(false), [hand,setHand]=useState(null), [leaving,setLeaving]=useState(false);
  const [size,setSize]=useState({w:360,h:440});
  const sceneRef=useRef(null), heroRef=useRef(null), heroIn=useRef(null), liftB=useRef(null), liftF=useRef(null), chestRef=useRef(null), friendRef=useRef(null);
  const numRefs={sum:useRef(null),L:useRef(null),R:useRef(null)};
  const fast=useRef(false), firstGame=useRef(true), run=useRef(0), stats=useRef(null), wait=useRef(null), toldGuess=useRef(false), fallenRef=useRef(new Set());
  const C=cases[ci];

  useLayoutEffect(()=>{const el=sceneRef.current;const m=()=>setSize({w:el.clientWidth,h:el.clientHeight});m();
    if(typeof ResizeObserver==='undefined'){window.addEventListener('resize',m);return()=>window.removeEventListener('resize',m)}
    const ro=new ResizeObserver(m);ro.observe(el);return()=>ro.disconnect()},[]);

  /* ---------- geometry ---------- */
  const W=size.w, H=size.h, stH=Math.max(22,Math.round(H*.07)), sink=Math.round(stH*.3);     // the building stands a little inside the ground
  const fh=Math.max(16,(H-stH+sink-8)/11.95), CW=Math.min(W,H*1.75), cx0=(W-CW)/2;
  const nw=Math.max(24,Math.round(fh*.9)), cw=Math.round(fh*.82);
  const TW=Math.round(Math.min(fh*5.2,CW*.47-nw-cw)), over=TW*.08;
  const tx=Math.round(cx0+CW-Math.max(8,CW*.02)-over-TW);
  const sw=Math.round(Math.min(TW*.28,fh*1.25)), xL=TW*.61, xR=TW*.87, winX=sw+(xL-sw)*.5;
  const yb=H-stH, Y=f=>yb+sink-f*fh, LY=f=>Y(f-1);          // floors 1–10: floor f stands on the line Y(f-1)
  const cubeX=tx-nw-cw-2;                                    // the column of cubes, beside the floor numbers
  const leftW=cubeX-6-cx0, bw=Math.round(Math.min(leftW-10,fh*8.5,400)), ef=Math.min(50,bw/5.6), polS=Math.max(8,Math.min(48,(bw-28)/5)), paperH=Math.max(48,ef*1.6), bh=Math.round(paperH+polS*1.08+30);
  const bx=Math.round(cx0+Math.max(6,(leftW-bw)*.35)), by=62;
  const dh=Math.round(Math.min(leftW*.84,(H-by-bh-stH)*1.02,300)), dw=dh*DET_AR, detX0=cx0+Math.max(2,leftW*.02)+(leftW>400?leftW*.06:0), detY=H-stH*.35-dh;
  // the explanation's five pairs of cubes, side by side up to floor 10; the detective steps aside if they need his place
  const pg=Math.max(3,Math.round(cw*.22)), pairX=j=>cubeX+cw-(5*cw+4*pg)+j*(cw+pg);
  const detX=detX0-(stage==='explain'?Math.max(0,Math.min(dw*.72,detX0+dw*.82-pairX(0)+4)):0);
  const hs=dh*.66, heroStreetX=Math.min(detX0+dw*.98,cubeX-hs*HERO_AR*.3)+(leftW>400?leftW*.12:0), small=Math.min(1,fh*1.02/hs);
  const geo=useRef({});geo.current={Y,LY,tx,sw,hs,H,stH,fh,heroStreetX,small,yb};
  const spot=s=>{const g=geo.current;return s.k==='street'?{x:g.heroStreetX,y:g.H-g.stH*.3,s:1}:{x:g.tx+g.sw/2,y:g.LY(s.f),s:g.small*.92}};
  const at=useRef({a:{k:'lift',f:1},b:{k:'lift',f:1},p:1}), liftLv=useRef(1);
  function place(){
    const g=geo.current,m=at.current,a=spot(m.a),b=spot(m.b),q=m.p,x=a.x+(b.x-a.x)*q,y=a.y+(b.y-a.y)*q,s=a.s+(b.s-a.s)*q,w=g.hs*HERO_AR;
    if(heroRef.current)heroRef.current.style.transform=`translate(${(x-w/2).toFixed(1)}px,${(y-g.hs).toFixed(1)}px) scale(${s.toFixed(3)})`;
    [liftB,liftF].forEach(r=>{if(r.current)r.current.style.transform=`translate(${(g.tx+g.sw/2-g.sw*.92).toFixed(1)}px,${(g.LY(liftLv.current)-g.fh*.95).toFixed(1)}px)`});
  }
  useLayoutEffect(place);
  const tween=(ms,fn)=>new Promise(res=>{if(REDUCE)ms=Math.min(ms,60);const t0=performance.now();
    const f=now=>{const q=fast.current?1:Math.min(1,Math.max(0,(now-t0)/ms));fn(q);place();if(q<1)requestAnimationFrame(f);else res()};requestAnimationFrame(f)});
  const ease=q=>q<.5?2*q*q:1-Math.pow(-2*q+2,2)/2;

  /* ---------- flashlight ---------- */
  const [beam,setBeam]=useState(null);
  useLayoutEffect(()=>{
    if(!target){setBeam(null);return}
    let x,y,r;
    if(target.k==='num'){const el=numRefs[target.which].current;if(!el)return;const e=el.getBoundingClientRect(),s=sceneRef.current.getBoundingClientRect();x=e.left+e.width/2-s.left;y=e.top+e.height/2-s.top;r=Math.max(22,ef*.8)}
    else{x=tx+winX;y=LY(target.f)-fh*.5;r=fh*.62}
    const aim=Math.max(.05,Math.min(2.3,Math.atan2(detY+SHOULDER[1]*dh-y,x-(detX+SHOULDER[0]*dh))));
    const tp=tipOf(aim);
    setBeam({x,y,r,aim,tx:detX+tp[0]*dh,ty:detY+tp[1]*dh});
  },[target,size,ci,known,detX]);
  const aim=beam?beam.aim:.35;

  /* ---------- where the two characters look (the eyes and the body follow) ---------- */
  const actsRef=useRef(null), detRef=useRef(null), beamT=useRef(0);
  useEffect(()=>{beamT.current=performance.now()},[beam]);
  const mid=(el,fy=.5)=>{const r=el&&el.getBoundingClientRect();return r&&r.width?[r.left+r.width/2,r.top+r.height*fy]:null};
  const beamPt=()=>{const s=sceneRef.current&&beam&&sceneRef.current.getBoundingClientRect();return s?[s.left+beam.x,s.top+beam.y]:null};
  const waiting=stage==='guess'&&keysOn;
  const look=(el,p)=>p?LP.lookAt(el,p[0],p[1]):[0,0];     // [0,0] = at the child who plays
  const mouse=useRef({x:0,y:0,t:-1e9});
  useEffect(()=>{const m=e=>{if(e.pointerType==='mouse')mouse.current={x:e.clientX,y:e.clientY,t:performance.now()}};window.addEventListener('pointermove',m);return()=>window.removeEventListener('pointermove',m)},[]);
  const mouseNow=()=>performance.now()-mouse.current.t<1300?[mouse.current.x,mouse.current.y]:null;    // the mouse moves: the eyes follow it
  function heroInput(el){
    const now=performance.now(), c=now%4600, lit=now-beamT.current<1700, mo=mouseNow();
    let l;
    if(mo)l=look(el,mo);
    else if(pose==='walk'||pose==='cheer'||stage==='ride')l=[0,0];
    else if(stage==='end')l=look(el,mid(chestRef.current));
    else if(lit&&beam)l=look(el,beamPt());
    else if(talk==='det')l=look(el,beam&&c>3300?beamPt():mid(detRef.current,.4));
    else if(talk==='kid')l=[0,0];
    else if(waiting)l=c<2300?look(el,mid(actsRef.current)):c<3300?[0,0]:look(el,beamPt()||mid(numRefs.sum.current));
    return {look:l,talking:talk==='kid'&&pose==='stand',pose,expression:expr,rot,idle:waiting&&!talk,mood:mood==='happy'?'happy':'calm'};
  }
  function detInput(el){

    else if(lit&&beam)l=look(el,beamPt());

  }

  /* ---------- talk ---------- */
  const fin=useRef(null);

    return new Promise(res=>{
      let done=false,tm;const end=()=>{if(done)return;done=true;clearTimeout(tm);if(fin.current===end){fin.current=null;setTalk(null);duck(false)}res()};fin.current=end;
      setTalk(who);duck(true);

      if(voice&&soundOn&&hasTTS&&(heVoice||window.KidodoVoice)){
        try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(toSpeech(text));u.voice=heVoice;u.lang=heVoice?heVoice.lang:'he-IL';u.rate=.95;u.pitch=who==='det'?.75:1.35;u.onend=end;u.onerror=end;speechSynthesis.speak(u);tm=setTimeout(end,est*2.2+2500)}

  /* ---------- the elevator ---------- */
  async function rideTo(from,to,ck,ms){

    at.current={a:{k:'lift',f:from},b:{k:'lift',f:to},p:0};
    await tween(ms,q=>{const e=ease(q);at.current.p=e;liftLv.current=from+(to-from)*e});ck();

  }
  const popIn=()=>[heroIn,liftB,liftF].forEach(r=>{const el=r.current&&(r===heroIn?r.current:r.current.firstChild);if(el&&!REDUCE)el.animate([{transform:'scale(0)'},{transform:'scale(1.18)',offset:.6},{transform:'scale(1)'}],{duration:500,easing:'ease-out'})});
  /* too far: out through the roof — and it bursts into pieces; then it is back in its place */
  async function flyAway(from,ck){

    at.current={a:{k:'lift',f:from},b:{k:'lift',f:to},p:0};
    await tween(ms,q=>{const e=q*q;at.current.p=e;liftLv.current=from+(to-from)*e});ck();

  /* ---------- the flow ---------- */

  const answered=v=>{const r=wait.current;wait.current=null;if(r)r(v)};
  const narr=useRef(null);      // the running explanation of a riddle; a press stops it

  function resetCase(){

    setFallen([]);setFalling(null);fallenRef.current=new Set();setTimer(0);setSupport(false);setBlank(null);setShown([10]);setStamp(false);setFriend(null);setHop(false);setQm(false);
    stats.current.caseWrong=0;setPose('stand');setExpr('happy');setMood('calm');setRot(0);
  }
  /* the opening: what the twins of 10 are, shown as two towers of cubes that together reach floor 10 */
  async function explain(ck){
    const nap=async ms=>{await sleep(fast.current?0:ms);ck()};
    setStage('explain');setShown([10]);
    const talk=say('det','היום נתנסה בלעשות השלמה לעשר.');
    if(!REDUCE)for(let f=1;f<=10;f++){setBuilt(f);sfx.build();await nap(140)}else setBuilt(10);
    setHeroOn(true);popIn();
    await talk;ck();
    setPose('think');setExpr(undefined);
    await say('det','לכל מספר קטן, יש את התאום שלו. שאם נחבר אותם, נרכיב את המספר 10.');ck();
    setPose('stand');setExpr('happy');
    const done=[];
    for(const [p,q] of CFG.PAIRS){                    // the numbers are shown, not read aloud
      const line=say('det',exText(`${p} + ${q} = 10`),{voice:false});
      for(let k=1;k<=10;k++){setPairs(done.concat([{p,q,n:k}]));sfx.cube(k);await nap(k===p?260:85)}
      done.push({p,q,n:10});await line;ck();await nap(400);

  async function play(list,tk,withIntro){

    const nap=async ms=>{await sleep(ms);ck()};
    fast.current=false;resetCase();
    if(withIntro){
      setBub({who:'det',text:'',n:0});await nap(350);
      try{await explain(()=>{ck();if(fast.current)throw 'skip'})}catch(e){if(e!=='skip')throw e}
      hush();fast.current=false;setBuilt(10);setPairs([]);setTarget(null);setHeroOn(true);setPose('stand');setExpr('happy');await nap(300);
    }else{if(!REDUCE)for(let f=1;f<=10;f++){setBuilt(f);sfx.build();await nap(90)}setBuilt(10);setHeroOn(true);popIn()}
    for(let i=0;i<list.length;i++){

      setCi(i);resetCase();setStage('intro');await nap(250);
      // the riddle
      setWho(true);setQm(true);
      const head=long?'איך נתאמן? לפנינו חידה.':i===list.length-1?'חידה אחרונה.':'חידה הבאה.';
      const story=c.friend===TREASURE?'החיות השאירו לנו הפתעה בקומה 10.':`${c.friend.name} ${c.friend.ran} בקומה 10.`;
      await say('det',i===0?`${head} ${story}`:head);ck();
      setHint(true);sfx.tap();
      await nap(250);
      sfx.lamp();setLit('sum');setTarget({k:'num',which:'sum'});
      await say('det',long?'הרמז הראשון: סכום התרגיל הוא 10.':'הסכום הוא 10.');ck();
      sfx.lamp();setLit(side);setTarget({k:'num',which:side});setKnown(true);sfx.pop();
      const arrived=rideTo(1,c.a,ck).then(()=>{setShown([10,c.a]);setBlank(c.a);sfx.ding()});
      // from here the buttons can be pressed (a child who already knows does not wait); what the detective says goes on meanwhile
      setKeysOn(true);
      for(let tries=0;;tries++){
        const id=narr.current={}, on=()=>narr.current===id;
        const picked=ask('guess');
        (async()=>{
          if(tries===0){
            await say('det',long?`הרמז השני: ${c.a}.`:`הרמז: ${c.a}.`);if(!on())return;
            sfx.lamp();setLit(miss);setTarget({k:'num',which:miss});
            if(long){await say('det','ועכשיו, אנחנו צריכים לגלות מה מסתתר כאן.');if(!on())return}
            await arrived;if(!on())return;
          }
          await say('det',tries?`ננסה שוב. מי התאום של ${c.a}?`:long?`מי התאום של ${c.a}? נחשו, ונבדוק במעלית!`:`מי התאום של ${c.a}?`);if(!on())return;
          setTimer(t=>t+1);
        })();
        const v=await picked;ck();narr.current=null;hush();setTimer(0);
        await arrived;ck();
        setStage('ride');setGuess(v);setLit(null);setTarget(null);setPose('stand');setExpr('joy');setMood('calm');
        const to=c.a+v;
        say('kid',to>10?`${v}! למעלה!`:`${v}! בודקים!`);
        await nap(500);
        if(to<=10)await rideTo(c.a,to,ck);
        else{await flyAway(c.a,ck)}
        if(to===10)break;
        // not the twin: the floor shows where we got to; the number falls and cannot be pressed again
        stats.current.wrong++;stats.current.caseWrong++;
        setBad(true);setPose('stand');setExpr('sad');setMood('unhappy');sfx.buzz();
        if(to<10){setShown([10,c.a,to]);setTarget({k:'floor',f:to})}
        fallenRef.current.add(v);setFalling(v);sfx.fall();setTimeout(()=>{setFallen([...fallenRef.current]);setFalling(f=>f===v?null:f)},900);
        await say('det',`${v} הוא לא התאום של ${c.a}.`);ck();
        setTarget(null);
        if(to<10){await rideTo(to,c.a,ck,400+(to-c.a)*160);setShown([10,c.a])}
        setBad(false);setGuess(null);setExpr('happy');
        if(stats.current.caseWrong===CFG.SUPPORT_AFTER){

          await say('det',`הקוביות הכחולות הן ${c.a}. כמה קוביות ריקות יש עד קומה 10?`);ck();
        }

      }

      setStage('solved');setGood(true);setGuess(null);setQm(false);setBlank(null);setTarget({k:'floor',f:10});sfx.ding();sfx.tada();
      setPose('cheer');setExpr('joy');setMood('happy');setHop(true);setFriend(c.friend);setFound(i+1);
      await nap(250);
      const fr=friendRef.current&&friendRef.current.getBoundingClientRect();if(fr)burst(fr.left+fr.width/2,fr.top+fr.height/2,['#FFD65A','#fff','#2EB6EA','#58C9AD'],20);
      await say('det',`נכון, ${c.b} הוא התאום של ${c.a}!`);ck();
      setStamp(true);sfx.stamp();
      const L=side==='L'?c.a:c.b, R=side==='L'?c.b:c.a;
      log('CASE',{n:i+1,known:c.a,twin:c.b,wrong:stats.current.caseWrong});
      if(c.friend!==TREASURE){
        await say('kid',`מצאנו את ${c.friend.name}! ${exText(`${L} + ${R} = 10`)}`);ck();
        await nap(300);setStamp(false);setHop(false);setPose('stand');
        // back to the forest
        setFriend(null);sfx.pop();setHome(h=>h.concat([{id:c.friend.id,from:tx+TW*.5}]));
        setTarget(null);
        await rideTo(10,1,ck,1100);await nap(250);
      }else{
        await say('kid',`מצאנו את ${c.friend.name}! ${exText(`${L} + ${R} = 10`)}`);ck();
        await nap(500);setStamp(false);
      }
    }
    // all the animals are home: the treasure comes down to the detective
    setStage('end');setTarget(null);hush();setHop(false);
    chestFrom.current=friendRef.current&&friendRef.current.getBoundingClientRect();setFriend(null);setEndStage('chest');
    [523,659,784,1047,1319].forEach((f,j)=>tone(f,.25,'triangle',.12,undefined,j*.12));
    log('GAME_OVER',{won:true,wrong:stats.current.wrong,answers:stats.current.answers});
    say('det','כל החיות חזרו ליער, ומצאנו את תיבת האוצר!');
    (async()=>{try{setPose('stand');setShown([]);await rideTo(10,1,ck,1100);setCur(null);setPose('cheer');setHop(true)}catch(e){}})();
    await nap(1100+3000);
    if(endRef.current==='chest')setHand(true);
  }
  const chestFrom=useRef(null), chestFly=useRef(null);
  useLayoutEffect(()=>{const el=chestFly.current,from=chestFrom.current;if(endStage!=='chest'||!el||!from||REDUCE)return;
    const r=el.getBoundingClientRect(),dx=from.left+from.width/2-(r.left+r.width/2),dy=from.bottom-r.bottom,k=from.width/r.width;
    el.animate([{transform:`translate(${dx}px,${dy}px) scale(${k})`},{transform:`translate(${dx*.5}px,${dy*.75-40}px) scale(${(1+k)/2})`,offset:.5},{transform:'none',offset:.86},{transform:'scale(1.06,.92)',offset:.93},{transform:'none'}],{duration:1000,easing:'ease-in-out'});
    setTimeout(()=>sfx.stamp(),860)},[endStage]);

  function start(){
    audio();narr.current=null;hush();const tk=++run.current,first=firstGame.current,list=makeCases(first);firstGame.current=false;
    stats.current={wrong:0,caseWrong:0,answers:0,correct:0};doneReq.current=null;wait.current=null;toldGuess.current=false;
    at.current={a:{k:'lift',f:1},b:{k:'lift',f:1},p:1};liftLv.current=1;setOnStreet(false);setHeroOn(!first&&REDUCE);
    setCases(list);setCi(0);setFound(0);setHome([]);setBuilt(REDUCE?10:0);setEndStage(null);setLidOpen(false);setHand(null);setLeaving(false);
    log('game_start',{cases:list.map(c=>c.a+'|'+c.side)});
    play(list,tk,first).catch(e=>{if(e!=='stop')console.error(e)});
  }

  /* ---------- what the child presses ---------- */
  function choose(v){if(stageRef.current!=='guess'||!wait.current||fallenRef.current.has(v))return;audio();sfx.tap();
    const ok=C.a+v===CFG.TOP;stats.current.answers++;KP.answer(ok);log('ANSWER',{known:C.a,chosen:v,correct:ok});
    if(ok)stats.current.correct++;
    setGuess(v);answered(v)}      // the pressed button lights green at once
  function timeUp(){
    if(stageRef.current!=='guess'||!wait.current)return;
    const first=!toldGuess.current;toldGuess.current=true;
    say('det',first?'אל תפחדו לנחש! אנחנו רוצים להרגיש את המרחק בין הקומות, ולא רק לספור.':'אל תפחדו לנחש!');
  }
  function skipIntro(){fast.current=true;hush()}

  // keyboard: 1–9 press the elevator's buttons
  useEffect(()=>{const onKey=e=>{if(/^[1-9]$/.test(e.key))choose(+e.key)};
    window.addEventListener('keydown',onKey);return()=>window.removeEventListener('keydown',onKey)});

  /* ---------- end: chest → coins → stars (as in the other games) ---------- */
  function tapChest(){
    if(endRef.current!=='chest')return;
    audio();setHand(null);setEndStage('coins');setLidOpen(true);sfx.jackpot();
    const t0=performance.now(),el=chestRef.current;
    const iv=setInterval(()=>{coinBurst(el,9);if(Math.random()<.5)sfx.coin();if(performance.now()-t0>3000)clearInterval(iv)},200);
    setTimeout(()=>{clearInterval(iv);setEndStage('done');finish()},3200);
  }
  const mistakes=()=>stats.current?stats.current.wrong:0;
  useEffect(()=>{if(endStage!=='done')return;const n=starCount(mistakes());for(let i=0;i<3;i++)setTimeout(()=>i<n?tone(784+i*196,.3,'sine',.12):tone(260,.15,'triangle',.05),150+i*350)},[endStage]);
  const doneReq=useRef(null);
  function finish(){const s=stats.current;if(!doneReq.current)doneReq.current=KP.complete({answers:s.answers,correct:s.correct,wrong:s.wrong,stars:starCount(s.wrong)});return doneReq.current}
  async function goNext(){if(leaving)return;setLeaving(true);hush();await finish();KP.next()}
  function toggleSound(){const v=!sound;setSound(v);soundOn=v;audio();if(!v)hush()}
  function toggleMusic(){const v=!mus;setMus(v);musicOn=v;audio();duck(false)}

  useEffect(()=>{if(KP.claimCorner)KP.claimCorner()},[]);
  const bubRef=useRef(bub);bubRef.current=bub;
  useEffect(()=>{if(KP.onResume)KP.onResume(()=>{const b=bubRef.current;if(wait.current&&b.text)say(b.who,b.text)})},[]);
  // opened on its own (not inside the course, which has its own Play): a browser speaks only after a tap, so the game waits for one
  const [ready,setReady]=useState(!!KP.embedded);
  useEffect(()=>{if(ready)start();return()=>{run.current++;narr.current=null;hush()}},[ready]);

  /* ---------- render ---------- */
  const box=which=>{
    const isKnown=which===C.side, val=isKnown?(known?C.a:null):good?C.b:guess;
    const cls='n box'+(isKnown&&known?' known':'')+(!isKnown&&good?' done':'')+(!isKnown&&!good&&guess!=null?(bad?' bad':' guess'):'')
      +(!isKnown&&stage==='guess'&&keysOn&&guess==null?' ask':'')+(lit===which?' lit':'');
    return <span ref={numRefs[which]} key={which+(bad?'b':'')} className={cls} style={{width:Math.max(34,ef*1.15),height:Math.max(34,ef*1.25)}}>{val!=null?val:''}</span>};
  const speakerX=bub.who==='det'?detX+dw*.42:onStreet?heroStreetX:tx+sw/2;
  const bgS=Math.max(W/1200,H/800), bgX=(W-1200*bgS)/2;
  const chW=Math.max(40,Math.min(230,Math.max(dh*.86,leftW*.66))), chH=chW*CHEST_VB[3]/CHEST_VB[2], chX=Math.max(detX+dw*.66,heroStreetX-chW*.9);
  const bushXs=useMemo(()=>[.05,.27,.45,.62,.9].map(k=>Math.round(cx0+CW*k)),[cx0,CW]);
  const cubes=pairs.length?pairs.flatMap((pr,j)=>mk(pr.n).map((_,k)=>({key:'p'+j+'-'+k,x:pairX(j),k,cls:k<pr.p?'a':'b',
      lab:k===Math.floor((pr.p-1)/2)&&pr.n>=pr.p?pr.p:k===pr.p+Math.floor((pr.q-1)/2)&&pr.n>=10?pr.q:null})))
    :support?mk(CFG.TOP).map((_,k)=>({key:'s'+k,x:cubeX,k,cls:k<C.a?'a':'empty',lab:null})):[];
  return(
    <div className="app" onPointerDownCapture={()=>audio()}>
      <div className="scene" ref={sceneRef}>
        <MeadowBG x0={Math.floor((tx-over-nw-cw-bgX)/bgS/10)*10} x1={Math.ceil((tx+TW+over+8-bgX)/bgS/10)*10}/>
        <Ground w={W} h={stH}/>
        <Walkers list={home} x0={cx0+4} x1={cx0+CW-4} y={yb+3} h={fh*1.25} bushes={bushXs}/>
        <Bushes xs={bushXs} y={yb+4} s={fh*1.15}/>
        {/* the tower */}
        <div style={{inset:0,zIndex:1,pointerEvents:'none'}}>
          {mk(10).map((_,i)=>{const F=i+1;return i<built&&<div key={F} className="slab pop" style={{position:'absolute',left:tx-PAD,top:Y(F)-PAD,zIndex:i}}>
            <FloorArt w={TW} fh={fh} sw={sw} winX={winX} x0={null} x1={null} seed={F+1} lit={F===10} plain={blank!=null&&F>blank&&F<10} noLedge={blank!=null&&F===10}/></div>})}
          {built>=10&&<div className="slab pop" style={{position:'absolute',left:tx-PAD,top:Y(10)-fh*1.05*1.8,zIndex:20}}><RoofArt w={TW} h={fh*1.05}/></div>}
        </div>
        {cur!=null&&cur>0&&stage!=='ride'&&<div className="glow" style={{left:tx+winX-fh*.75,top:LY(cur)-fh*1.25,width:fh*1.5,height:fh*1.5}}/>}
        {built>=10&&shown.map(f=><div key={f} className={'plate'+(f===10&&cur!==10?' goal':'')+(cur===f&&stage!=='ride'?' cur':'')} style={{left:tx-nw,top:LY(f)-fh*.86,width:nw-5,height:fh*.72,fontSize:Math.max(14,fh*.5)}}>{f}</div>)}
        {cubes.map(({key,x,k,cls,lab})=><div key={key} className={'cube '+cls} style={{left:x,top:Y(k+1)+1,width:cw,height:fh-3,fontSize:Math.max(12,Math.min(fh*.55,cw*.7)),zIndex:6}}>{lab}</div>)}
        {built>=10&&<>
          <div ref={liftB} className="lift" style={{zIndex:3,opacity:boom?0:1}}><div style={{transformOrigin:'50% 100%'}}><LiftArt w={sw*.92} h={fh*.95} part="back"/></div></div>
          <div ref={liftF} className="lift" style={{zIndex:5,opacity:boom?0:1}}><div style={{transformOrigin:'50% 100%'}}><LiftArt w={sw*.92} h={fh*.95} part="front"/></div></div></>}
        {qm&&built>=10&&<span className="qm" style={{left:tx+winX-fh*.28,top:LY(10)-fh*1.05,fontSize:fh*.8}}>?</span>}
        {friend&&<div ref={friendRef} className="friend" key={friend.id} style={{left:tx+xL-fh*.75*friend.ar,top:LY(10)-fh*1.5}}><Friend f={friend} h={fh*1.5}/></div>}
        {/* the clue board */}
        <div className="boardx" style={{left:bx,top:by,width:bw,height:bh,opacity:stage==='explain'?0:1,transition:'opacity .4s'}}>
          <BoardArt w={bw} h={bh}/>
          <div className={'paper'+(hint?'':' blank')} style={{left:9,top:11,width:bw-18,height:paperH,fontSize:ef}} role="img" aria-label={hint?`${C.side==='L'&&known?C.a:'ריבוע'} ועוד ${C.side==='R'&&known?C.a:'ריבוע'} שווה 10`:''}>
            {box('L')}<span className="s">+</span>{box('R')}<span className="s">=</span>
            <span ref={numRefs.sum} className={'n'+(lit==='sum'?' lit':'')+(good?' done':'')} style={{minWidth:ef*1.2}}>10</span></div>
          <div className="pin" style={{left:bw/2-6,top:5}}/>
          <div className="pols" style={{left:12,right:12,bottom:11}}>
            {cases.map((c,i)=><div key={i} className={'pol'+(i<found?' in':i===ci&&who?' now sil':'')} style={{width:polS,height:polS*1.08,fontSize:polS*.5}}>{i<found||i===ci&&who?<Friend f={c.friend} h={polS*.86} w={polS*.86}/>:'?'}</div>)}</div>
        </div>
        {/* the detective and the child's hero */}
        <div ref={detRef} style={{left:detX,top:detY,zIndex:5,pointerEvents:'none',transition:'left .6s ease-in-out'}}><Detective s={dh} aim={aim} resting={!beam} input={detInput}/></div>
        <div ref={heroRef} className="herox" style={{width:hs*HERO_AR,height:hs,zIndex:onStreet?6:4,transformOrigin:'50% 100%',opacity:heroOn&&built>=10&&!boom?1:0,transition:boom?'none':'opacity .25s'}}>
          <div ref={heroIn} style={{transformOrigin:'50% 100%'}}><div className={hop?'hop':''} style={{transformOrigin:'50% 100%'}}><Hero s={hs} input={heroInput}/></div></div>
        </div>
        {beam&&<svg className="beam"><defs><linearGradient id="bm" gradientUnits="userSpaceOnUse" x1={beam.tx} y1={beam.ty} x2={beam.x} y2={beam.y}><stop offset="0" stopColor="#FFF3C4" stopOpacity=".85"/><stop offset="1" stopColor="#FFE08A" stopOpacity=".35"/></linearGradient></defs>
          {(()=>{const dx=beam.x-beam.tx,dy=beam.y-beam.ty,L=Math.hypot(dx,dy)||1,nx=-dy/L,ny=dx/L,r=beam.r;return <>
            <polygon points={[[beam.tx+nx*5,beam.ty+ny*5],[beam.x+nx*r,beam.y+ny*r],[beam.x-nx*r,beam.y-ny*r],[beam.tx-nx*5,beam.ty-ny*5]].map(p=>p.map(v=>v.toFixed(1)).join(',')).join(' ')} fill="url(#bm)"/>
            <circle cx={beam.x} cy={beam.y} r={r} fill="#FFE9A8" opacity=".38"/></>})()}</svg>}
        {stamp&&<div className="stamp" style={{left:cx0+leftW*.52,top:by+bh+Math.max(30,(H-by-bh-stH)*.3),fontSize:Math.max(20,Math.min(44,leftW*.13))}}>נמצא!</div>}
        <div className="vig"/>
        {endStage&&<div style={{left:chX,top:H-stH*.2-chH,width:chW,zIndex:20}}>
          <div className="glow" style={{position:'absolute',left:-chW*.3,top:-chW*.35,width:chW*1.6,height:chW*1.6,opacity:.6,zIndex:0}}/>
          <div ref={chestFly} style={{position:'relative',zIndex:1,transformOrigin:'50% 100%'}}><button ref={chestRef} className={'wchest'+(endStage==='chest'?' idle':'')} aria-label="לפתוח את תיבת האוצר" onClick={tapChest}><Chest open={lidOpen} s={chW}/></button></div>
          {hand&&<TapHand x={chW/2} y={chH*.5}/>}
        </div>}
        <div className="side">
          {KP.embedded?<span style={{width:44,height:44}} aria-hidden="true"/>:<button className="iconbtn" title="יציאה" aria-label="יציאה" onClick={()=>{hush();KP.exit()}}>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>}
          <button className={'iconbtn'+(sound?'':' off')} title="אפקטים" aria-label="אפקטים ודיבור" aria-pressed={sound} onClick={toggleSound}><SpeakerIcon on={sound}/></button>
          <button className={'iconbtn'+(mus?'':' off')} title="מוזיקה" aria-label="מוזיקה" aria-pressed={mus} onClick={toggleMusic}><MusicIcon on={mus}/></button>
        </div>
      </div>
      <div className="panel">
        <div className="say" onClick={hush} style={{visibility:bub.text?'visible':'hidden'}}>
          <span className="tail" style={{left:`clamp(24px,${(speakerX-(W-Math.min(W-24,820))/2).toFixed(0)}px,calc(100% - 24px))`}}/>
          <span className={'who'+(bub.who==='kid'?' kid':'')}>{bub.who==='kid'?'העוזר':'הבלש'}</span>
          <span className="txt" key={bub.n} aria-live="polite">{bub.text||'…'}</span></div>
        <div className="acts" ref={actsRef} role="group" aria-label="מה עושים עכשיו">
          {stage==='explain'&&<button className="skipb" onClick={skipIntro}>דילוג על ההסבר</button>}
          {(stage==='guess'&&keysOn||stage==='ride')&&<>
            <Stopwatch key={'w'+ci} run={stage==='guess'&&timer>0?timer:0} onEnd={timeUp}/>
            <div className="keys" aria-label={`מי התאום של ${C.a}?`}>
              {[1,2,3,4,5,6,7,8,9].map(v=><button key={v} className={'key'+(fallen.includes(v)?' gone':falling===v?' fall':'')+(good&&v===C.b?' good':guess===v&&!falling?' pressed':'')}
                disabled={stage!=='guess'||fallen.includes(v)} aria-label={String(v)} onClick={()=>choose(v)}>{v}</button>)}</div></>}
        </div>
      </div>
      {!ready&&<div className="center" style={{background:'rgba(16,40,56,.35)'}}><button className="playb" aria-label="להתחיל" onClick={()=>{audio();setReady(true)}}>
        <svg width="54" height="54" viewBox="0 0 24 24"><path d="M8 5l12 7-12 7z" fill="#fff"/></svg></button></div>}
      {endStage==='done'&&(()=>{const n=starCount(mistakes());return(
        <div className="center endscreen" style={{justifyContent:'flex-start',paddingTop:'max(70px,13dvh)'}}>
          <div className="stars" dir="ltr">{[0,1,2].map(i=><div key={i} className="star" style={{animationDelay:.15+i*.35+'s'}}><StarIcon on={i<n}/></div>)}</div>
          <div className="rise" style={{marginTop:14,animationDelay:'1s'}}><div ref={KP.coinBadge}/></div>
          <div className="endbtns rise" style={{animationDelay:'1.2s'}}>
            <button className="endbtn again" onClick={start} aria-label="שוב" title="שוב">
              <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2.8" strokeLinecap="round" strokeLinejoin="round"><path d="M4 12a8 8 0 1 0 2.5-5.8"/><path d="M4 4v5h5"/></svg></button>
            <button className="endbtn next" onClick={goNext} disabled={leaving} aria-label="המשך" title="המשך">
              <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2.8" strokeLinecap="round" strokeLinejoin="round"><path d="M20 12H4M10 6l-6 6 6 6"/></svg></button>
          </div>
        </div>)})()}
    </div>);
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
