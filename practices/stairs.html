<style>

@keyframes skyIn{from{opacity:0}}

.side{left:10px;top:10px;direction:ltr;display:flex;gap:6px;z-index:90}

.world{left:0;top:0;width:0;height:0;direction:ltr;will-change:transform}

.slab{pointer-events:none}

.endbtn.next{background-image:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22 preserveAspectRatio=%22none%22%3E%3Cpolygon points=%2212,0 88,0 74,19 26,19%22 fill=%22%2372c09a%22 stroke=%22%2372c09a%22 stroke-width=%22.6%22/%3E%3Cpolygon points=%2288,0 100,12 81,26 74,19%22 fill=%22%235db78c%22 stroke=%22%235db78c%22 stroke-width=%22.6%22/%3E%3Cpolygon points=%22100,12 100,88 81,74 81,26%22 fill=%22%23288c5c%22 stroke=%22%23288c5c%22 stroke-width=%22.6%22/%3E%3Cpolygon points=%22100,88 88,100 74,81 81,74%22 fill=%22%23257f53%22 stroke=%22%23257f53%22 stroke-width=%22.6%22/%3E%3Cpolygon points=%2288,100 12,100 26,81 74,81%22 fill=%22%2322774e%22 stroke=%22%2322774e%22 stroke-width=%22.6%22/%3E%3Cpolygon points=%2212,100 0,88 19,74 26,81%22 fill=%22%232c9965%22 stroke=%22%232c9965%22 stroke-width=%22.6%22/%3E%3Cpolygon points=%220,88 0,12 19,26 19,74%22 fill=%22%234cb080%22 stroke=%22%234cb080%22 stroke-width=%22.6%22/%3E%3Cpolygon points=%220,12 12,0 26,19 19,26%22 fill=%22%2361b98f%22 stroke=%22%2361b98f%22 stroke-width=%22.6%22/%3E%3Cpolygon points=%2226,19 74,19 81,26 81,74 74,81 26,81 19,74 19,26%22 fill=%22%232fa36b%22/%3E%3Cpolygon points=%2226,19 74,19 70,24 30,24%22 fill=%22%2348ae7d%22/%3E%3C/svg%3E")}
.endbtn.again{background-image:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22 preserveAspectRatio=%22none%22%3E%3Cpolygon points=%2212,0 88,0 74,19 26,19%22 fill=%22%237b9dea%22 stroke=%22%237b9dea%22 stroke-width=%22.6%22/%3E%3Cpolygon points=%2288,0 100,12 81,26 74,19%22 fill=%22%23688fe7%22 stroke=%22%23688fe7%22 stroke-width=%22.6%22/%3E%3Cpolygon points=%22100,12 100,88 81,74 81,26%22 fill=%22%23345fc1%22 stroke=%22%23345fc1%22 stroke-width=%22.6%22/%3E%3Cpolygon points=%22100,88 88,100 74,81 81,74%22 fill=%22%233057af%22 stroke=%22%233057af%22 stroke-width=%22.6%22/%3E%3Cpolygon points=%2288,100 12,100 26,81 74,81%22 fill=%22%232d51a4%22 stroke=%22%232d51a4%22 stroke-width=%22.6%22/%3E%3Cpolygon points=%2212,100 0,88 19,74 26,81%22 fill=%22%233968d3%22 stroke=%22%233968d3%22 stroke-width=%22.6%22/%3E%3Cpolygon points=%220,88 0,12 19,26 19,74%22 fill=%22%235883e4%22 stroke=%22%235883e4%22 stroke-width=%22.6%22/%3E%3Cpolygon points=%220,12 12,0 26,19 19,26%22 fill=%22%236c92e7%22 stroke=%22%236c92e7%22 stroke-width=%22.6%22/%3E%3Cpolygon points=%2226,19 74,19 81,26 81,74 74,81 26,81 19,74 19,26%22 fill=%22%233D6FE0%22/%3E%3Cpolygon points=%2226,19 74,19 70,24 30,24%22 fill=%22%235480e4%22/%3E%3C/svg%3E")}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}

<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const {useState,useEffect,useLayoutEffect,useRef,useMemo} = React;

/* ---------- the game's numbers — change them here, not in the logic ---------- */
const CFG={
  TOP:10,                                  // no step above this one
  DEMO:[3,2],                              // the exercise of the opening explanation
  // the first game: [start, [how many steps, ...]] for each tower
  FIRST:[[2,[3,2]],[3,[3,1,2]],[5,[3,2]]],
  // the games after it: the same amounts, shuffled, and another start
  STARTS:[[1,5],[2,4],[4,5]],
  RIGHT_AT:[0,0,1,1,1,2,2],                // where the right answer is among the three (1, 2 = ״one step less״ is also there)
  SUPPORT_AFTER:2,                         // this many mistakes in one exercise → the child builds the steps again
  HOP:430, FLY:340,                        // ms
};

/* ---------- helpers ---------- */
const SPOKEN=['אֶפֶס','אַחַת','שְׁתַּיִם','שָׁלוֹשׁ','אַרְבַּע','חָמֵשׁ','שֵׁשׁ','שֶׁבַע','שְׁמוֹנֶה','תֵּשַׁע','עֶשֶׂר','אַחַת עֶשְׂרֵה','שְׁתֵּים עֶשְׂרֵה'];
const toSpeech=t=>t.replace(/(^|\D)2 מדרגות/g,'$1שְׁתֵּי מדרגות').replace(/\d+/g,m=>SPOKEN[+m]??m);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const rand=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rand(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const REDUCE=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const stepsWord=k=>k===1?'מדרגה אחת':k+' מדרגות';
const andSteps=k=>k===1?'עוד מדרגה אחת':`עוד ${k} מדרגות`;
/* three towers: the feet count (the child builds every step) → think first → without seeing the steps */
const MODES=['feet','think','blind'];
function makeGame(first){
  let plan=CFG.FIRST;
  if(!first)do{plan=CFG.FIRST.map(([,ks],i)=>{const [a,b]=CFG.STARTS[i];return [rand(a,Math.min(b,CFG.TOP-ks.reduce((x,y)=>x+y,0))),shuffle(ks)]})}
    while(plan[0][1][plan[0][1].length-1]===plan[1][1][0]||plan[1][1][2]===plan[2][1][0]);   // never the same amount twice in a row
  let at;do at=shuffle(CFG.RIGHT_AT);while(at[2]===0);let n=0;   // the first ״think first״ exercise always offers ״one step less״
  return plan.map(([start,ks],i)=>{let N=start;
    return {i,mode:MODES[i],start,ex:ks.map(k=>{const ans=N+k,p=Math.min(at[n++],k),s=ans-p,e={N,k,ans,opts:[s,s+1,s+2]};N=ans;return e})}});
}

/* ---------- sound: everything made in code (Web Audio), no files ---------- */
let heVoice=null, actx=null, soundOn=true, noiseBuf=null;
const hasTTS=typeof window!=='undefined'&&'speechSynthesis' in window;
function loadVoice(){try{const hv=speechSynthesis.getVoices().filter(v=>/^(he|iw)/i.test(v.lang));heVoice=hv.find(v=>/hila|carmit|female|woman/i.test(v.name))||hv.find(v=>!/avri|asaf|male/i.test(v.name))||hv[0]||null}catch(e){}}
if(hasTTS){loadVoice();try{speechSynthesis.onvoiceschanged=loadVoice}catch(e){}}
function audio(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume()}catch(e){}}
function tone(f,d=.15,type='triangle',vol=.12,slideTo,at=0,out){
  if(!actx||(!soundOn&&!out))return;
  try{const t=actx.currentTime+at,o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
    if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,t+d);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g).connect(out||actx.destination);o.start(t);o.stop(t+d)}catch(e){}
}
function noise(d,{type='bandpass',f=800,f2,q=1,vol=.25,at=0,out}={}){
  if(!actx||(!soundOn&&!out))return;
  try{
    if(!noiseBuf){noiseBuf=actx.createBuffer(1,actx.sampleRate,actx.sampleRate);const ch=noiseBuf.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=Math.random()*2-1}
    const t=actx.currentTime+at,s=actx.createBufferSource(),fl=actx.createBiquadFilter(),g=actx.createGain();
    s.buffer=noiseBuf;fl.type=type;fl.Q.value=q;fl.frequency.setValueAtTime(f,t);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+d);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
    s.connect(fl).connect(g).connect(out||actx.destination);s.start(t);s.stop(t+d)}catch(e){}
}

const NOTES=[262,294,330,349,392,440,494,523,587,659,698,784];
const sfx={
  pop(){tone(500,.09,'sine',.1,1400)},
  tap(){tone(520,.06,'sine',.08)},
  lit(){tone(1250,.12,'sine',.06)},
  fly(){noise(.22,{f:900,f2:2600,q:1.2,vol:.08})},
  build(){noise(.07,{f:900,q:3,vol:.3});tone(190,.08,'triangle',.12)},      // a step knocks into place
  hop(f){tone(NOTES[Math.min(NOTES.length-1,f)],.2,'triangle',.13)},         // every step one note higher
  down(f){tone(NOTES[Math.min(NOTES.length-1,f)],.12,'sine',.08)},
  buzz(){tone(196,.18,'triangle',.1,165);tone(165,.3,'triangle',.1,130,.18)},
  tada(){[523,659,784,1047].forEach((f,i)=>tone(f,i===3?.6:.2,'triangle',.14,undefined,i*.11))},
  water(){noise(.9,{type:'lowpass',f:500,f2:1500,vol:.12})},
  gem(){[1047,1319,1568,2093].forEach((f,i)=>tone(f,.35,'sine',.08,undefined,i*.07))},
  thud(){noise(.14,{type:'lowpass',f:500,vol:.5});tone(110,.18,'sine',.2,60)},
  coin(){tone(988,.08,'square',.05);tone(1319,.25,'square',.05,undefined,.08)},
  jackpot(){tone(330,.12,'square',.05);tone(660,.1,'square',.05,undefined,.07);
    for(let i=0;i<7;i++){const at=.14+i*.07+Math.random()*.05,f=1600+Math.random()*900;tone(f,.09,'triangle',.08,undefined,at);tone(f*1.5,.12,'sine',.06,undefined,at+.045)}},
};
const log=(ev,data)=>console.log('[kidodo]',ev,data||'');
const KP=window.KidodoPractice||{inCourse:false,answer(){},complete:()=>Promise.resolve(),next(){location.reload()},exit(){history.back()}};

/* ---------- particles (same as the bridge game) ---------- */
function burst(x0,y0,colors,n=22,spread=1){
  for(let i=0;i<n;i++){
    const p=document.createElement('div');p.className='pt';const s=5+Math.random()*9;
    p.style.cssText=`left:${x0}px;top:${y0}px;width:${s}px;height:${s}px;background:${colors[i%colors.length]};`+(i%3===0?'border-radius:50%;':i%3===1?'clip-path:polygon(50% 0,100% 100%,0 100%);':'border-radius:2px;');

        try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(toSpeech(text));u.voice=heVoice;u.lang=heVoice?heVoice.lang:'he-IL';u.rate=.95;u.pitch=1.2;u.onend=end;u.onerror=end;speechSynthesis.speak(u);tm=setTimeout(end,est*2.2+2500)}
        catch(e){tm=setTimeout(end,est)}
      }else tm=setTimeout(end,est);
    });
  }
  const hush=()=>{if(hasTTS)try{speechSynthesis.cancel()}catch(e){};if(fin.current)fin.current()};

  /* ---------- movement ---------- */
  const ask=st=>{setStage(st);return new Promise(res=>{wait.current=res})};
  const answered=v=>{const r=wait.current;wait.current=null;if(r)r(v)};
  // a small step flies from its place to the tower
  async function flyTile(i,f,ck){
    const el=tileRefs.current[i],s=sceneRef.current.getBoundingClientRect(),r=el&&el.getBoundingClientRect();
    setUsed(i+1);sfx.fly();
    const g=geo.current,x1=g.colX(f),y1=g.baseY+(cam.current-f)*g.fh+8,x0=r&&r.width?r.left-s.left+r.width/2:x1,y0=r&&r.width?r.top-s.top+r.height/2:y1;
    const b=flyRef.current;b.style.opacity=1;
    await tween(CFG.FLY,q=>{const e=ease(q),k=1+(g.sw/g.tW-1)*e;b.style.transform=`translate(${(x0+(x1-x0)*e).toFixed(1)}px,${(y0+(y1-y0)*e-Math.sin(q*Math.PI)*g.fh*.5).toFixed(1)}px) translate(-50%,-50%) scale(${k.toFixed(3)})`});
    b.style.opacity=0;ck();
    setSlabs(l=>[...l,f]);setPopF(f);sfx.build();
  }
  async function hopTo(from,to,ms,ck){
    setPose('jump');setRot(to%2!==from%2?(to%2?.75:-.75):0);
    const g=geo.current;
    await tween(ms,q=>{hp.current={x:from<to?from+q:to+(1-q),y:from+(to-from)*ease(q),a:Math.sin(q*Math.PI)*g.fh*.42}});ck();
    hp.current={x:to,y:to,a:0};place();setPose('stand');setRot(0);
  }
  // one step up: it flies to its place, and he hops on it. Nothing is counted aloud
  async function up(N,i,ck){
    const f=N+i+1;
    await flyTile(i,f,ck);await hopTo(f-1,f,CFG.HOP,ck);sfx.hop(f);
    await sleep(fast.current?0:130);ck();
  }
  async function climbSteps(N,n,ck){for(let i=0;i<n;i++)await up(N,i,ck)}
  // back down: the steps return to the alien
  async function down(N,f,ck){
    for(let x=f;x>N;x--){await hopTo(x,x-1,300,ck);sfx.down(x-1);setSlabs(l=>l.filter(v=>v!==x));setUsed(x-1-N);await sleep(60);ck()}
  }
  // the water covers what was climbed, and the camera goes up
  async function rise(to,ck){
    sfx.water();const c0=cam.current,w0=wl.current,w1=to-.62;
    await tween(1100,q=>{wl.current=w0+(w1-w0)*ease(Math.min(1,q*1.15));cam.current=c0+(to-c0)*ease(q)});ck();
  }
  function setTower(N,b){
    cam.current=N;wl.current=N-.62;hp.current={x:N,y:N,a:0};
    setSlabs([N-2,N-1,N].filter(f=>f>=0));setPopF(null);setPlates([{f:N}]);setLitP(null);setUsed(0);setTilesOn(false);setCover(null);setLeft(false);setOh(false);setExOn(false);setGood(null);setChosen(null);setBad(false);setLit(null);
    setPose('stand');setRot(0);setExpr('happy');setMood('calm');setHop(false);setTi(b);place();
  }
  const resetEx=(N,k,ans,opts)=>{setEx({N,k,ans,opts});setUsed(0);setLeft(false);setCover(null);setOh(false);setGood(null);setChosen(null);setBad(false);setLit(null);setLitP(null);setPlates([{f:N}]);setExpr('happy');setMood('calm');setHop(false);setHand(null)};

  /* ---------- the opening: the key, shown on 3 + 2 ---------- */
  async function explain(ck){
    const [N,k]=CFG.DEMO,nap=async ms=>{await sleep(fast.current?0:ms);ck()};
    setDemo(true);setTower(N,0);setEx({N,k,ans:N+k,opts:[]});setStage('explain');setWorldOn(true);sfx.thud();
    await say('עכשיו בואו נתנסה במפתח המדרגות.');ck();
    setPeek(true);sfx.gem();
    await say('למעלה מחכים לנו שלושה יהלומים. כדי להגיע אליהם, נבנה מדרגות.');setPeek(false);ck();
    setLitP(N);sfx.lit();
    await say(`אנחנו כבר במדרגה ${N}. מה שלמטה כבר טיפסנו, אז לא סופרים אותו שוב.`);ck();
    setLitP(null);setTilesOn(true);setExOn(true);setLit('k');sfx.pop();
    await say(`יש לנו עוד ${k} מדרגות.`);ck();
    setLit(null);setStage('climb');
    const line=say('כל מדרגה מעלה אותנו במספר אחד.');
    await nap(1000);
    for(let i=0;i<k;i++){await up(N,i,ck);setPlates(l=>[...l,{f:N+i+1}]);sfx.pop();await nap(700)}
    await line;ck();
    setGood(N+k);setPose('cheer');setMood('happy');sfx.tada();
    await say(`הגענו למדרגה ${N+k}. ${N} ועוד ${k} הם ${N+k}.`);ck();
    await nap(500);
  }

  /* ---------- one exercise ---------- */
  const narr=useRef(null);
  async function exercise(t,j,ck){
    const {N,k,ans,opts}=t.ex[j],nap=async ms=>{await sleep(ms);ck()};
    const fresh=t.mode==='feet'?(j===0?`אנחנו במדרגה ${N}, ויש לנו ${andSteps(k)}. לחצו ונבנה אותן.`:`עכשיו ${andSteps(k)}. לחצו ובונים!`)
      :t.mode==='think'?(j===0?`הפעם קודם חושבים. אנחנו במדרגה ${N}, ויש ${andSteps(k)}. לאיזו מדרגה נגיע?`:`${andSteps(k)}. לאיזו מדרגה נגיע?`)
      :(j===0?`ועכשיו בלי לראות. אנחנו במדרגה ${N}, ו${andSteps(k)}. לאיזו מדרגה נגיע?`:`אנחנו במדרגה ${N}, ו${andSteps(k)}. לאיזו מדרגה נגיע?`);
    resetEx(N,k,ans,opts);setExOn(true);setTilesOn(true);if(t.mode==='blind')setCover('on');
    setLit('k');sfx.pop();setTimeout(()=>setLit(l=>l==='k'?null:l),2200);
    let wrongs=0,support=t.mode==='feet',first=true;
    const ok=v=>{const r=v===ans;stats.current.answers++;KP.answer(r);log('ANSWER',{q:N+'+'+k,chosen:v,off:v-ans,correct:r,mode:support?'feet':t.mode});if(r)stats.current.correct++;else{stats.current.wrong++;wrongs++}setChosen(v);return r};
    for(;;){
      if(support){
        /* the feet count: every press is one step */
        setCover(c=>c?'away':c);
        say(first?fresh:'בואו נבנה אותן ביחד. לחצו, ונעלה מדרגה ועוד מדרגה.');
        taps.current=0;
        setStage('build');armHand('tile');
        for(let i=0;i<k;i++){
          while(taps.current<=i){await new Promise(r=>{wait.current=r});ck()}
          setHand(null);
          await up(N,i,ck);
        }
        setPlates([{f:N}]);
        for(let n=0;;n++){
          say(n?'לאיזו מדרגה הגענו?':j===0||!first?`בנינו ${k===1?'מדרגה אחת':'את כל המדרגות'}. לאיזו מדרגה הגענו?`:'לאיזו מדרגה הגענו?');
          const v=await ask('answer');ck();hush();
          if(ok(v))break;
          // look again: from where we started, the steps that were built light up one by one, without numbers
          setStage('climb');setBad(true);setMood('unhappy');setExpr('sad');sfx.buzz();
          const line=say(`בואו נסתכל שוב: התחלנו במדרגה ${N}, ועלינו ${stepsWord(k)}.`);
          setLitP(N);await nap(1500);setLitP(null);
          for(let i=1;i<=k;i++){setFlash(N+i);sfx.hop(N+i);await nap(800)}
          setFlash(null);await line;ck();setChosen(null);setBad(false);setMood('calm');setExpr('happy');
        }
        break;
      }
      /* think first, then climb and see */
      say(first?fresh:`ננסה שוב: אנחנו במדרגה ${N}, ו${andSteps(k)}. לאיזו מדרגה נגיע?`);first=false;
      const v=await ask('answer');ck();hush();
      const right=ok(v);
      setStage('climb');setLit(null);
      if(cover0(t)){setCover('away');await nap(600)}
      const n=Math.max(0,Math.min(k,v-N));
      say(v===N?`נשארים במדרגה ${N}!`:`מטפסים למדרגה ${v}!`);await nap(650);
      if(n)await climbSteps(N,n,ck);else await hopTo(N,N,500,ck);
      if(right)break;
      setMood('unhappy');setExpr('sad');setBad(true);sfx.buzz();
      const rest=k-n;
      if(rest>0){                                    // a step is left in the air
        if(n)setPlates([{f:N},{f:N+n,c:'bad'}]);
        setLeft(true);
        await say(n===0?`נשארנו במקום, ויש לנו ${andSteps(k)}.`:rest===1?'נשארה לנו עוד מדרגה! את המדרגה שעמדנו עליה לא סופרים.':`נשארו לנו ${andSteps(rest)}!`);ck();
      }else{                                         // no more steps, and he is not there
        setOh(true);
        await say(`נגמרו המדרגות, ועוד לא הגענו למדרגה ${v}.`);ck();
      }
      setOh(false);setLeft(false);setPlates([{f:N}]);setBad(false);setChosen(null);
      if(n){say('חוזרים ומנסים שוב.');await down(N,N+n,ck)}
      setMood('calm');setExpr('happy');
      if(wrongs>=CFG.SUPPORT_AFTER)support=true;
      await nap(300);
    }
    /* solved */
    setStage('solved');setGood(ans);setChosen(null);setPlates([{f:N},{f:ans,c:'good'}]);setPose('cheer');setExpr('joy');setMood('happy');sfx.tada();
    await say(`${N} ועוד ${k} הם ${ans}.`);ck();
    setTilesOn(false);setExOn(false);setPose('stand');setPlates([{f:ans}]);
    await rise(ans,ck);
    // what is far under the water is not drawn any more
    setSlabs(l=>l.filter(f=>f>=ans-3));
  }
  const cover0=t=>t.mode==='blind';

  async function play(g,tk,withIntro){
    const ck=()=>{if(tk!==run.current)throw 'stop'},nap=async ms=>{await sleep(ms);ck()};
    fast.current=false;setWorldOn(false);
    await nap(350);
    if(withIntro){
      try{await explain(()=>{ck();if(fast.current)throw 'skip'})}catch(e){if(e!=='skip')throw e}
      hush();fast.current=false;setPeek(false);if(flyRef.current)flyRef.current.style.opacity=0;setExOn(false);setTilesOn(false);setWorldOn(false);await nap(380);
    }
    setDemo(false);
    for(let i=0;i<g.length;i++){
      const t=g[i];
      setTower(t.start,i);setStage('intro');await nap(60);setWorldOn(true);sfx.thud();await nap(450);
      if(i>0){await say(i===1?'מגדל שני!':'מגדל אחרון!');ck()}
      for(let j=0;j<t.ex.length;j++){await exercise(t,j,ck)}
      // the diamond of this tower comes out of the cloud
      setStage('gem');setPose('cheer');setExpr('joy');setMood('happy');setHop(true);
      await gemFlight(i,ck);
      setHop(false);setPose('stand');
      log('TOWER',{n:i+1,wrong:stats.current.wrong});
      if(i<g.length-1){setWorldOn(false);await nap(400)}
    }
    // all three: the chest
    setStage('end');setPlates([]);setHop(true);setPose('cheer');setEndStage('fly');
    [523,659,784,1047,1319].forEach((f,j)=>tone(f,.25,'triangle',.12,undefined,j*.12));
    log('GAME_OVER',{won:true,...stats.current});
    await nap(1100);sfx.thud();
    for(let i=0;i<3;i++)await gemToChest(i,ck);
    setEndStage('chest');
    say('שלושה יהלומים! התיבה שלנו.');setHop(false);setPose('stand');
    await nap(3000);
    if(endRef.current==='chest')setHand('chest');
  }
  // the diamonds open the chest: one by one, from their places into it
  async function gemToChest(i,ck){
    const s=sceneRef.current.getBoundingClientRect(),a=gemsRef.current.children[i].getBoundingClientRect(),b=chestRef.current.getBoundingClientRect(),c=r=>[r.left-s.left+r.width/2,r.top-s.top+r.height*.5],[x0,y0]=c(a),[x1,y1]=c(b);
    setGemShow(i);setGems(g=>g-1);await sleep(30);ck();
    await tween(620,q=>{const e=ease(q);if(gemRef.current)gemRef.current.style.transform=`translate(${(x0+(x1-x0)*e).toFixed(1)}px,${(y0+(y1-y0)*e-Math.sin(q*Math.PI)*50).toFixed(1)}px) translate(-50%,-50%) scale(${(.55+.35*Math.sin(q*Math.PI)).toFixed(3)})`});ck();
    setGemShow(null);sfx.gem();burst(b.left+b.width/2,b.top+b.height/2,GEMS[i].c,10);await sleep(120);ck();
  }
  async function gemFlight(i,ck){

  function start(){
    audio();hush();const tk=++run.current,first=firstGame.current,g=makeGame(first);firstGame.current=false;
    stats.current={wrong:0,answers:0,correct:0};doneReq.current=null;wait.current=null;

  /* ---------- what the child presses ---------- */
  function build(){if(stageRef.current!=='build'||!ex)return;audio();if(taps.current>=ex.k)return;sfx.tap();taps.current++;hush();setHand(null);const r=wait.current;wait.current=null;if(r)r()}
  function choose(v){if(stageRef.current!=='answer'||!wait.current)return;audio();sfx.tap();answered(v)}
  function skipIntro(){fast.current=true;hush()}
  // 3 seconds without a press → a hand
  const handT=useRef(0);
  function armHand(k){clearTimeout(handT.current);handT.current=setTimeout(()=>{if(stageRef.current==='build'&&taps.current===0)setHand(k)},3000)}

  const keyBuf=useRef({s:'',t:0});
  useEffect(()=>{const onKey=e=>{
      if(stageRef.current!=='answer'||!/^[0-9]$/.test(e.key)||!ex)return;
      const b=keyBuf.current;b.s=(performance.now()-b.t<1200?b.s:'')+e.key;b.t=performance.now();const s=b.s;

  }
  const mistakes=()=>stats.current?stats.current.wrong:0;
  useEffect(()=>{if(endStage!=='done')return;const n=starCount(mistakes());for(let i=0;i<3;i++)setTimeout(()=>i<n?tone(784+i*196,.3,'sine',.12):tone(260,.15,'triangle',.05),150+i*350)},[endStage]);
  const doneReq=useRef(null);

  async function goNext(){if(leaving)return;setLeaving(true);hush();await finish();KP.next()}
  function toggleSound(){const v=!sound;setSound(v);soundOn=v;audio();if(!v)hush()}

  useEffect(()=>{if(KP.claimCorner)KP.claimCorner()},[]);
  const bubRef=useRef(bub);bubRef.current=bub;
  useEffect(()=>{if(KP.onResume)KP.onResume(()=>{const b=bubRef.current;if((stageRef.current==='answer'||stageRef.current==='build')&&wait.current&&b.text)say(b.text)})},[]);
  useEffect(()=>{start();return()=>{run.current++;hush()}},[]);

  /* ---------- render ---------- */
  const mk=n=>Array.from({length:n}), K=ex?ex.k:0;
  const cloudW=Math.min(fw*.95,fh*3.2), hideW=Math.min(cw-18,(tileH+14)*1.75);

  const chW=Math.max(70,Math.min(170,lw*.72)), chH=chW*CHEST_VB[3]/CHEST_VB[2], isW=chW*1.35, chX=lx+lw/2, chY=baseY-fh*.12;
  return(
    <div className="app" onPointerDownCapture={()=>audio()}>
      <div className={'scene'+(stage==='build'?' tap':'')} ref={sceneRef} onClick={build}>
        <Sky key={ti} i={ti}/>
        {/* the cloud where the diamonds wait */}
        {peek&&[0,1,2].map(i=><div key={i} className="gemx" style={{left:tx+fw/2+(i-1)*cloudW*.3-fh*.22,top:74+cloudW*.2,zIndex:1,animation:'popIn .6s both',animationDelay:i*.15+'s'}}><Gem i={i} h={fh*.5}/></div>)}

        {/* the tower */}
        <div ref={worldRef} className="world" style={{zIndex:5}}>
          <div className="fade" style={{opacity:worldOn?1:0,position:'absolute',left:0,top:0}}>
            {slabs.slice().sort((a,b)=>b-a).map(f=><div key={f} className={'slab'+(f===popF?' pop':'')+(f===flash?' flash':'')} style={{position:'absolute',left:colX(f)-sw/2-12,top:-f*fh-gt*.5-6}}><Slab w={sw} h={sh} gt={gt} seed={f*13+5} b={ti}/></div>)}
            {plates.map(p=><div key={p.f} ref={litP===p.f||plates.length===1?platesRef:null} className={'plate'+(litP===p.f?' lit':'')+(p.c?' '+p.c:'')} style={{position:'absolute',left:colX(p.f)-pw/2,top:-p.f*fh+gt*.62,width:pw,height:pw*.78,fontSize:pw*.58}}>{p.f}</div>)}
            <div ref={heroRef} className="hero" style={{position:'absolute',left:0,top:0,width:hs*HERO_AR,height:hs,zIndex:6}}>
              <div className={hop?'hop':''}><Hero s={hs} input={heroInput}/></div>
              {oh&&[[-4,-16,0],[42,-30,.3],[84,-14,.6]].map(([l,t,d],i)=><span key={i} className="oh" style={{position:'absolute',left:l+'%',top:t+'%',fontSize:hs*.28,animationDelay:d+'s'}}>?</span>)}
            </div>
          </div>
        </div>
        <div ref={waterRef} className="water"><WaterTop W={W}/><div className="wbody"/></div>
        {/* the alien with the exercise and the steps that are left */}
        <div className="card" style={{left:cxx,top:ey,width:cw,height:ch,opacity:exOn?1:0}}><i style={{height:tileH+16}}/></div>
        <div ref={exRef} className="exer" role="img" aria-label={ex?`${ex.N} ועוד ${ex.k}`:''} style={{left:exx,top:ey,width:ew,height:eh,fontSize:ef,opacity:exOn?1:0}}>
          {ex&&<><span className={lit==='N'?'lit':''}>{ex.N}</span><span>+</span><span ref={kRef} className={'k'+(lit==='k'?' lit':'')}>{ex.k}</span><span>=</span>
            <span key={good!=null?'g':chosen!=null?'c'+chosen+bad:'q'} className={good!=null?'done':bad?'bad':chosen!=null?'':'q'} style={{minWidth:'1.15em',textAlign:'center'}}>{good!=null?good:chosen!=null?chosen:'?'}</span></>}
        </div>
        {tilesOn&&<div className="tiles" style={tileRow} key={(ex?ex.N+'-'+ex.k:'')+ti+demo}>
          {mk(K).map((_,i)=><div key={i} ref={el=>{tileRefs.current[i]=el}} className={'tile'+(i<used?' gone':'')+(stage==='build'&&i===used?' next':'')+(left&&i>=used?' left':'')} style={{animationDelay:stage==='build'||left?'0s':i*.12+'s'}}><TileArt w={tW} seed={i*7+3} b={ti}/></div>)}</div>}
        {cover&&tilesOn&&<div className={'hide'+(cover==='away'?' away':'')} style={{left:cxx+cw/2-hideW/2,top:tileY+tileH/2,marginTop:-hideW*.29}}><CloudArt w={hideW} seed={6} kind="round"/><b style={{fontSize:tW*.5,paddingTop:hideW*.08}}>+{K}</b></div>}
        <div ref={flyRef} className="fly" style={{opacity:0}}><TileArt w={tW} seed={3} b={ti}/></div>
        <div ref={alienRef} className="alien" style={{left:ax,top:endStage?alTop-tileH-eh*.6:ay,opacity:1,transition:'top .8s'}}><Alien h={endStage?Math.min(ah,baseY-chH-(alTop-tileH-eh*.6)-18>70?Math.min(ah,baseY-chH-(alTop-tileH-eh*.6)-18):70):ah} input={alienInput}/></div>
        <div className="gems" ref={gemsRef} role="img" aria-label={`${gems} יהלומים`}>{GEM_COL.map((c,i)=><span key={i} className={'sl'+((endStage?i>=3-gems:i<gems)?' in':' off')}><Gem i={i} h={24}/></span>)}</div>
        {gemShow!=null&&<div ref={gemRef} className="gemx"><Gem i={gemShow} h={fh*.8}/></div>}
        {endStage&&<div className="isle" style={{left:chX-isW/2,top:chY-chH,width:isW,height:chH}}>
          <div style={{position:'absolute',left:-12,top:chH-isW*.1-4}}><Slab w={isW} h={isW*.26} gt={isW*.14} seed={9} b={ti}/></div>
          <div style={{position:'absolute',left:(isW-chW)/2,bottom:0}}><button ref={chestRef} className={'wchest'+(endStage==='chest'?' idle':'')} aria-label="לפתוח את תיבת האוצר" onClick={tapChest}><Chest open={lidOpen} s={chW}/></button></div>
          {hand==='chest'&&<TapHand x={isW/2} y={chH*.5}/>}
        </div>}
        {hand==='tile'&&stage==='build'&&<TapHand x={cxx+cw/2-(K-1)*(tW+tileRow.gap)/2+used*(tW+tileRow.gap)} y={tileY+tileH*.6}/>}
        <div className="side" onClick={e=>e.stopPropagation()}>
          {KP.embedded?<span style={{width:44,height:44}} aria-hidden="true"/>:<button className="iconbtn" title="יציאה" aria-label="יציאה" onClick={()=>{hush();KP.exit()}}>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>}
          <button className={'iconbtn'+(sound?'':' off')} title="קול" aria-label="צלילים ודיבור" aria-pressed={sound} onClick={toggleSound}><SpeakerIcon on={sound}/></button>
        </div>
      </div>
      <div className="panel">
        <div className="say" onClick={hush} style={{visibility:bub.text?'visible':'hidden'}}>
          <span className="tail" style={{left:`clamp(24px,${(ax+aw/2-(W-Math.min(W-24,820))/2).toFixed(0)}px,calc(100% - 24px))`}}/>
          <span className="txt" key={bub.n} aria-live="polite">{bub.text||'…'}</span></div>
        <div className="acts" ref={actsRef} role="group" aria-label="מה עושים עכשיו">
          {demo&&<button className="skipb" onClick={skipIntro}>דילוג על ההסבר</button>}
          {stage==='build'&&used<K&&<button className="big stepb" aria-label="להוסיף מדרגה" onClick={build}><span>מדרגה</span><TileArt w={54} seed={3} b={ti}/></button>}
          {stage==='answer'&&ex.opts.map(v=><button key={v} className="big" onClick={()=>choose(v)}>{v}</button>)}
        </div>
      </div>
      {endStage==='done'&&(()=>{const n=starCount(mistakes());return(
        <div className="center endscreen" style={{justifyContent:'flex-start',paddingTop:'max(70px,13dvh)'}}>
          <div className="stars" dir="ltr">{[0,1,2].map(i=><div key={i} className="star" style={{animationDelay:.15+i*.35+'s'}}><StarIcon on={i<n}/></div>)}</div>
          <div className="rise" style={{marginTop:14,animationDelay:'1s'}}><div ref={KP.coinBadge}/></div>
          <div className="endbtns rise" style={{animationDelay:'1.2s'}}>
            <button className="endbtn again" onClick={start} aria-label="שוב" title="שוב">
              <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2.8" strokeLinecap="round" strokeLinejoin="round"><path d="M4 12a8 8 0 1 0 2.5-5.8"/><path d="M4 4v5h5"/></svg></button>
            <button className="endbtn next" onClick={goNext} disabled={leaving} aria-label="המשך" title="המשך">
              <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2.8" strokeLinecap="round" strokeLinejoin="round"><path d="M20 12H4M10 6l-6 6 6 6"/></svg></button>
          </div>
        </div>)})()}
    </div>);
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
