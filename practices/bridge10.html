<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kidodo · בונים גשר</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.23.5/babel.min.js"></script>
<script src="/practices/kidodo-practice.js"></script>
<style>
:root{--ink:#33373b;--blue:#3D6FE0;--kblue:#176fbe;--coral:#FF6450;--yellow:#FFC531;--teal:#1FB5A2;--purple:#8E5CF0;--panel:#FFF7E6}
*{box-sizing:border-box;margin:0}
html,body{overflow:hidden;height:100%}
body{font-family:Fredoka,system-ui,sans-serif;color:var(--ink);background:#CDEBFA;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:0}
.bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
.app{position:relative;z-index:1;max-width:960px;margin:0 auto;padding:10px 14px 12px;display:flex;flex-direction:column;gap:8px;height:100vh;height:100dvh}

/* header (same frame as the other practices) */
header{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:6px;flex:none}
.title{justify-self:start;min-width:0;max-width:100%;font-weight:700;font-size:16px;display:flex;align-items:center;gap:6px;color:var(--kblue);background:rgba(255,255,255,.88);padding:6px 14px 6px 12px;clip-path:polygon(0 0,100% 0,calc(100% - 12px) 100%,0 100%)}
.title svg{flex:none}
.title span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;gap:6px;justify-content:flex-end}
@media(max-width:419px){.title span{display:none}.title{padding:6px 16px 6px 8px}}
@media(min-width:700px){header{gap:10px}.title{font-size:19px;gap:8px;padding:6px 14px 6px 16px}.tools{gap:8px}}
.iconbtn{width:44px;height:44px;border-radius:50%;font-size:19px;color:var(--kblue);background:#F4F8FF;box-shadow:0 4px 0 rgba(23,111,190,.22)}
.iconbtn:disabled{opacity:.45}
.treasure{display:flex;align-items:center;gap:8px;padding:4px 0}
.treasure .chest{width:48px;height:38px}
.pbar{width:64px;height:16px;border-radius:8px;background:rgba(23,111,190,.16);overflow:hidden}
@media(min-width:700px){.treasure{gap:10px;padding:4px 14px}.treasure .chest{width:62px;height:50px}.pbar{width:130px;height:18px;border-radius:9px}}
.pfill{height:100%;border-radius:9px;background:linear-gradient(180deg,#FFD95A 0 50%,#FFC531 50%);transition:width .8s cubic-bezier(.3,1.4,.5,1)}
.chest.bump{animation:bump .5s}
@keyframes bump{30%{transform:scale(1.25,.85)}60%{transform:scale(.9,1.15)}}
.lid{transition:transform .5s cubic-bezier(.3,1.6,.5,1);transform-origin:10px 30px;transform-box:view-box}
.chest.open .lid{transform:rotate(-35deg) translate(-6px,-10px)}

/* board */
.stage{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;gap:6px}
.scene{position:relative;flex:none;height:clamp(190px,42dvh,340px);overflow:hidden;border-radius:18px}
.scene>*{position:absolute}
.rcliff{transition:left .9s cubic-bezier(.5,0,.3,1)}
.cells{display:flex;transition:width .9s cubic-bezier(.5,0,.3,1);pointer-events:none}
.cells i{flex:none;border:2.5px dashed rgba(255,255,255,.85);border-left-width:0;background:rgba(255,255,255,.18)}
.cells i:first-child{border-left-width:2.5px}
.cells.hot i{background:rgba(255,229,120,.45);border-color:#fff}
.measure{display:flex;align-items:center;justify-content:center;transition:width .9s cubic-bezier(.5,0,.3,1),opacity .3s;pointer-events:none}
.measure::before{content:"";position:absolute;left:0;right:0;top:50%;height:3px;margin-top:-1.5px;background:#fff;border-radius:2px}
.measure::after{content:"";position:absolute;left:0;right:0;top:50%;height:14px;margin-top:-7px;border-left:3px solid #fff;border-right:3px solid #fff}
.mnum{position:relative;z-index:1;min-width:44px;height:36px;padding:0 10px;border-radius:18px;background:#fff;color:var(--coral);font-weight:700;font-size:24px;line-height:36px;text-align:center;box-shadow:0 4px 0 rgba(23,111,190,.22)}
.mnum.pop{animation:mpop .6s}
@keyframes mpop{40%{transform:scale(1.35)}}
.hero{transition:left 1.9s linear;z-index:3;pointer-events:none}
.hero.snap{transition:none}
.hero .in.show{animation:heroIn .6s both}
@keyframes heroIn{from{transform:translateY(-140px)}60%{transform:translateY(0) scale(1.06,.92)}to{transform:none}}
.coin2{z-index:2;animation:bob 1.4s ease-in-out infinite alternate;transition:left .9s cubic-bezier(.5,0,.3,1)}
@keyframes bob{to{transform:translateY(-8px)}}
.wave{animation:wave 3s ease-in-out infinite alternate}
@keyframes wave{to{transform:translateX(14px)}}

/* number planks (flat 3D, one colour per original plank) */
.plank{--D:8px;position:relative;display:flex;height:var(--T);direction:ltr}
.seg{position:relative;height:100%;background:var(--m);background-image:repeating-linear-gradient(90deg,transparent 0 calc(var(--U) - 2px),rgba(0,0,0,.16) calc(var(--U) - 2px) var(--U))}
.seg::before{content:"";position:absolute;left:0;right:0;top:calc(-1 * var(--D));height:var(--D);background:var(--l);clip-path:polygon(var(--D) 0,calc(100% + var(--D)) 0,100% 100%,0 100%);width:calc(100% + var(--D))}
.seg+.seg{box-shadow:inset 3px 0 0 rgba(255,255,255,.75)}
.pside{position:absolute;right:calc(-1 * var(--D));top:calc(-1 * var(--D));bottom:0;width:var(--D);background:var(--d);clip-path:polygon(0 var(--D),100% 0,100% calc(100% - var(--D)),0 100%)}
.pshadow{position:absolute;left:-10px;right:0;bottom:-8px;height:8px;background:rgba(23,80,130,.18);clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%);z-index:-1}
.pnum{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.18);pointer-events:none}
.psum{position:absolute;left:50%;bottom:calc(100% + var(--D) + 4px);transform:translateX(-50%);white-space:nowrap;font-weight:700;font-size:15px;color:var(--ink);background:rgba(255,255,255,.9);padding:1px 9px;border-radius:10px;pointer-events:none}
.plank.hl{animation:hl .9s ease-in-out 3}
@keyframes hl{50%{transform:translateY(-6px) scale(1.06);filter:brightness(1.15)}}
.plank.merged{animation:merge .5s}
@keyframes merge{30%{transform:scale(1.12,.86)}65%{transform:scale(.96,1.06)}}
.bridge .pside,.bridge .pshadow{display:none}
.bridge.fit{animation:fitIn .45s cubic-bezier(.3,1.4,.5,1) both}
@keyframes fitIn{from{transform:translateY(-60px)}}
.bridge.short{transform-origin:0 50%;animation:tipOff 1.3s cubic-bezier(.5,0,.8,.6) both}
@keyframes tipOff{0%{transform:translateY(-60px)}25%{transform:translateY(0)}45%{transform:rotate(14deg)}100%{transform:translate(20px,170px) rotate(40deg);opacity:.2}}
.bridge.long{animation:noFit 1.2s both}
@keyframes noFit{0%{transform:translateY(-60px)}25%{transform:translateY(0)}35%,55%,75%{transform:translateX(-8px)}45%,65%{transform:translateX(8px)}85%{transform:none;opacity:1}100%{transform:translateY(60px);opacity:0}}

/* tray */
.tray{position:relative;flex:1;min-height:110px;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:30px 26px;padding:24px 8px 10px;border-radius:18px;background:rgba(255,255,255,.35)}
.tray.dead{opacity:.6}
.drag{touch-action:none;cursor:grab;position:relative;z-index:1}
.drag.dragging{cursor:grabbing;z-index:30}
.drag.back{transition:transform .28s cubic-bezier(.3,1.3,.5,1)}
.drag.dragging .plank{filter:brightness(1.08)}
.slotgone{visibility:hidden}
.fall{animation:fall .8s cubic-bezier(.3,.9,.4,1) both}
@keyframes fall{0%{transform:translateY(-300px)}45%{transform:translateY(0) scale(1.08,.88)}62%{transform:translateY(-22px) scale(.97,1.04)}80%{transform:translateY(0)}90%{transform:translateY(-5px)}100%{transform:none}}
.reset{position:absolute;top:6px;left:6px;width:44px;height:44px;border-radius:50%;font-size:22px;color:var(--kblue);background:#fff;box-shadow:0 4px 0 rgba(23,111,190,.22);z-index:2}
.reset:disabled{opacity:.4}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}

/* talk */
.talk{display:flex;align-items:flex-end;gap:12px;min-height:86px;flex:none}
.bubble{flex:1;background:#fff;padding:10px 14px;font-size:17px;line-height:1.45;font-weight:500;position:relative;box-shadow:0 6px 0 rgba(23,111,190,.18);margin-bottom:14px;border-radius:14px}
@media(min-width:700px){.bubble{padding:12px 18px;font-size:19px}}
.bubble::before{content:"";position:absolute;right:-16px;bottom:14px;border:12px solid transparent;border-left-color:#fff;border-right:0}
.bubble .txt{animation:txtIn .35s both}
@keyframes txtIn{from{opacity:0;transform:translateY(6px)}}
.spawn{position:relative;flex:none;display:flex;justify-content:center;padding-bottom:6px}
.spawn::before{content:"";position:absolute;bottom:0;left:50%;width:90px;height:30px;margin-left:-45px;border-radius:50%;background:#9FD3F2;box-shadow:0 0 0 5px rgba(255,255,255,.7),0 0 0 11px rgba(255,255,255,.3)}
.spawn svg{position:relative}
.mascot{flex:none;overflow:visible}
.mascot .body{transform-origin:50% 100%;transform-box:fill-box}
.mascot.talking .body{animation:mbob .32s infinite alternate}
@keyframes mbob{to{transform:scale(1.03,.97) rotate(-2deg)}}
.mascot .mouth{transform-origin:center;transform-box:fill-box;transform:scaleY(.35)}
.mascot.talking .mouth{animation:mouth .16s infinite alternate}
@keyframes mouth{from{transform:scaleY(.25)}to{transform:scaleY(1.3)}}
.mascot .eye{transform-origin:center;transform-box:fill-box;animation:blink 4s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.mascot .arm{transform-origin:0 0;transform-box:fill-box}
.mascot.talking .arm{animation:arm .5s infinite alternate}
@keyframes arm{to{transform:rotate(-40deg)}}
.mascot .feather{transform-origin:0 100%;transform-box:fill-box;animation:feather 1.6s infinite alternate}
@keyframes feather{to{transform:rotate(12deg)}}
.mascot .leg,.mascot .armS{transform-origin:50% 0;transform-box:fill-box}
.mascot.walking .l1{animation:legA .26s infinite alternate}
.mascot.walking .l2,.mascot.walking .armS{animation:legA .26s infinite alternate-reverse}
@keyframes legA{from{transform:rotate(28deg)}to{transform:rotate(-28deg)}}
.mascot.walking .body{animation:wbob .13s infinite alternate}
@keyframes wbob{to{transform:translateY(-1.5px)}}
.cheer .body{animation:cheer .35s 3 alternate}
@keyframes cheer{to{transform:translateY(-10px)}}

/* screens */
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:20px;z-index:5}
.center .h1,.center .note{background:rgba(255,255,255,.85);padding:6px 18px;border-radius:20px}
.cta{min-height:56px;font-size:26px;font-weight:700;padding:14px 48px;color:#fff;background:linear-gradient(180deg,#FF8270 0 50%,#FF6450 50%);clip-path:polygon(16px 0,calc(100% - 16px) 0,100% 50%,calc(100% - 16px) 100%,16px 100%,0 50%);transition:transform .12s}
.cta:active{transform:scale(.93)}
.h1{font-size:30px;font-weight:700}
.note{color:#5c6066;font-size:16px;max-width:440px}
.bigchest{background:none;padding:0;line-height:0;touch-action:manipulation;filter:drop-shadow(0 10px 0 rgba(23,111,190,.2))}
.bigchest .chest{width:min(72vw,300px,42dvh);height:auto}
.bigchest.idle .chest{animation:chestCall 1.6s ease-in-out infinite}
@keyframes chestCall{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(-5deg) scale(1.04)}80%{transform:rotate(5deg) scale(1.04)}90%{transform:rotate(-3deg)}}
.bigchest:active .chest{transform:scale(.94)}
.bigchest:focus-visible{outline:4px solid #fff;outline-offset:6px;border-radius:20px}
.coin{position:fixed;left:0;top:0;border-radius:50%;pointer-events:none;z-index:1001;will-change:transform,opacity;
  background:radial-gradient(circle at 35% 30%,#FFF4B0 0 18%,#FFD84A 19% 55%,#E9A913 56% 100%);box-shadow:inset 0 0 0 3px #C98A00}
.coin::after{content:"";position:absolute;inset:26%;border-radius:50%;border:2px solid rgba(201,138,0,.55)}
@media(prefers-reduced-motion:reduce){.bigchest.idle .chest,.coin2,.wave{animation:none}}
.pt{position:fixed;pointer-events:none;z-index:999;will-change:transform,opacity}
.flycoin{position:fixed;width:30px;height:30px;margin:-15px 0 0 -15px;z-index:1000;pointer-events:none}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const {useState,useEffect,useRef} = React;

/* ---------- helpers ---------- */
const SPOKEN=['אֶפֶס','אַחַת','שְׁתַּיִם','שָׁלוֹשׁ','אַרְבַּע','חָמֵשׁ','שֵׁשׁ','שֶׁבַע','שְׁמוֹנֶה','תֵּשַׁע','עֶשֶׂר','אַחַת עֶשְׂרֵה','שְׁתֵּים עֶשְׂרֵה'];
const toSpeech=t=>t.replace(/\d+/g,m=>SPOKEN[+m]??m).replace(/־/g,' ').replace(/\+/g,' ועוד ');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const rand=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const shuffle=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
const ROUNDS=5, MAXLEN=10;
const GEMC=['#FF6450','#3D6FE0','#1FB5A2','#8E5CF0','#FFC531'];
/* plank colours: light (top) / main (front) / dark (side) */
const PC=[{l:'#FF9887',m:'#FF6450',d:'#C9402F'},{l:'#8AABFF',m:'#3D6FE0',d:'#2546A8'},{l:'#C2A6FF',m:'#8E5CF0',d:'#6A3CC4'}];
const total=p=>p.segs.reduce((s,x)=>s+x.n,0);
/* can some of the planks (one or more) make exactly `gap`? */
function reachable(vals,gap){const n=vals.length;for(let m=1;m<(1<<n);m++){let s=0;for(let i=0;i<n;i++)if(m&(1<<i))s+=vals[i];if(s===gap)return true}return false}

let lastGap=null;
function genRound(i){
  const [lo,hi]=i<2?[5,7]:[7,10];
  let gap,g=0; do{gap=rand(lo,hi);g++}while(gap===lastGap&&g<50); lastGap=gap;
  const a=rand(1,Math.min(4,gap-1)), b=gap-a, c=rand(1,4);
  const ids=shuffle([0,1,2]);
  const planks=[a,b,c].map((n,k)=>({id:`r${i}-${k}`,segs:[{n,c:ids[k]}],key:k<2}));
  return {gap,planks:shuffle(planks),wrong:0};
}

/* ---------- sound: everything made in code (Web Audio), no files ---------- */
let heVoice=null, actx=null, soundOn=true, noiseBuf=null;
const hasTTS=typeof window!=='undefined'&&'speechSynthesis' in window;
function loadVoice(){try{const hv=speechSynthesis.getVoices().filter(v=>/^(he|iw)/i.test(v.lang));heVoice=hv.find(v=>/hila|carmit|female|woman/i.test(v.name))||hv.find(v=>!/avri|asaf|male/i.test(v.name))||hv[0]||null}catch(e){}}
if(hasTTS){loadVoice();try{speechSynthesis.onvoiceschanged=loadVoice}catch(e){}}
function audio(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume()}catch(e){}}
function tone(f,d=.15,type='triangle',vol=.12,slideTo){
  if(!actx||!soundOn)return;
  try{const t=actx.currentTime,o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
    if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,t+d);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g).connect(actx.destination);o.start(t);o.stop(t+d)}catch(e){}
}
function noise(d,{type='bandpass',f=800,f2,q=1,vol=.25}={}){
  if(!actx||!soundOn)return;
  try{
    if(!noiseBuf){noiseBuf=actx.createBuffer(1,actx.sampleRate,actx.sampleRate);const ch=noiseBuf.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=Math.random()*2-1}
    const t=actx.currentTime,s=actx.createBufferSource(),fl=actx.createBiquadFilter(),g=actx.createGain();
    s.buffer=noiseBuf;fl.type=type;fl.Q.value=q;fl.frequency.setValueAtTime(f,t);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+d);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
    s.connect(fl).connect(g).connect(actx.destination);s.start(t);s.stop(t+d)}catch(e){}
}
const sfx={
  pick(){tone(520,.06,'sine',.08)},
  drop(){tone(360,.06,'sine',.07)},
  knock(){noise(.07,{f:900,q:3,vol:.35});tone(190,.09,'triangle',.14)},           // wood on wood
  merge(){sfx.knock();setTimeout(()=>{noise(.06,{f:1300,q:4,vol:.3});tone(260,.08,'triangle',.12)},90);setTimeout(()=>tone(784,.14,'sine',.08),190)},
  thud(){noise(.14,{type:'lowpass',f:500,vol:.5});tone(110,.18,'sine',.2,60)},
  splash(){noise(.7,{type:'lowpass',f:3200,f2:300,vol:.35});setTimeout(()=>noise(.35,{f:1800,f2:600,q:.8,vol:.18}),120)},
  nope(){tone(220,.14,'square',.05);setTimeout(()=>tone(165,.2,'square',.05),130)},
  step(i){tone(i%2?330:294,.05,'triangle',.06)},
  win(){[523,659,784,1047].forEach((f,j)=>setTimeout(()=>tone(f,.2),j*110))},
  coin(){tone(988,.08,'square',.05);setTimeout(()=>tone(1319,.25,'square',.05),80)},
  jackpot(){tone(330,.12,'square',.05);setTimeout(()=>tone(660,.1,'square',.05),70);
    for(let i=0;i<7;i++)setTimeout(()=>{const f=1600+Math.random()*900;tone(f,.09,'triangle',.08);setTimeout(()=>tone(f*1.5,.12,'sine',.06),45)},140+i*70+Math.random()*50)},
};
const log=(ev,data)=>console.log('[kidodo]',ev,data||'');
/* link to the course (public/practices/kidodo-practice.js). Opened alone, it does nothing. */
const KP=window.KidodoPractice||{inCourse:false,answer(){},complete:()=>Promise.resolve(),next(){location.reload()},exit(){history.back()}};

/* ---------- particles ---------- */
function burst(x0,y0,colors,n=22,spread=1){
  for(let i=0;i<n;i++){
    const p=document.createElement('div');p.className='pt';const s=5+Math.random()*9;
    p.style.cssText=`left:${x0}px;top:${y0}px;width:${s}px;height:${s}px;background:${colors[i%colors.length]};`+(i%3===0?'border-radius:50%;':i%3===1?'clip-path:polygon(50% 0,100% 100%,0 100%);':'border-radius:2px;');
    document.body.appendChild(p);
    const ang=-Math.PI/2+(Math.random()-.5)*2.4*spread, dist=50+Math.random()*110, dx=Math.cos(ang)*dist, dy=Math.sin(ang)*dist;
    const a=p.animate([{transform:'translate(0,0)',opacity:1},{transform:`translate(${dx*.7}px,${dy*.7}px) rotate(${Math.random()*360}deg)`,opacity:1,offset:.55},
      {transform:`translate(${dx}px,${dy+90}px) rotate(${Math.random()*720}deg) scale(.4)`,opacity:0}],{duration:700+Math.random()*500,easing:'cubic-bezier(.15,.7,.4,1)'});
    a.onfinish=()=>p.remove();
  }
}
let liveCoins=0;
function coinBurst(el,n=26){
  if(!el)return; const r=el.getBoundingClientRect(); if(!r.width)return;
  const x0=r.left+r.width/2, y0=r.top+r.height*.38, H=window.innerHeight;
  const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  n=Math.min(n,Math.max(0,140-liveCoins)); if(reduce)n=Math.min(n,8);
  for(let i=0;i<n;i++){
    const c=document.createElement('div');c.className='coin';const s=20+Math.random()*16;c.style.width=c.style.height=s+'px';
    document.body.appendChild(c);liveCoins++;
    const vx=(Math.random()-.5)*Math.min(900,window.innerWidth*1.6), vy=-(520+Math.random()*520), g=1500;
    const T=Math.max(1.1,(-vy+Math.sqrt(vy*vy+2*g*(H-y0+60)))/g), spin=2+Math.floor(Math.random()*4), frames=[];
    for(let k=0;k<=12;k++){const t=T*k/12, x=x0+vx*t-s/2, y=y0+vy*t+.5*g*t*t-s/2;
      frames.push({transform:`translate(${x}px,${y}px) scaleX(${Math.cos(k/12*spin*Math.PI*2).toFixed(2)})`,opacity:k===0?0:1})}
    const a=c.animate(frames,{duration:T*1000,delay:i*18,easing:'linear',fill:'both'});
    a.onfinish=()=>{c.remove();liveCoins--};
  }
}
/* the coin the hero picked up flies into the chest */
function flyCoin(fromEl,toEl){
  return new Promise(res=>{
    if(!fromEl||!toEl){res();return}
    const a=fromEl.getBoundingClientRect(),b=toEl.getBoundingClientRect();

/* cliff (low-poly rock with a grass cap). w×h, grass on top, facets shaded from the left */

  poly([[e,0],[e+dir*6,h*.35],[e-dir*4,h*.7],[e+dir*8,h],[e+dir*(w*.45),h],[e+dir*(w*.35),h*.5],[e+dir*(w*.4),0]],'#C97B36');

function River({w,h}){

  poly([[0,0],[w,0],[w,h],[0,h]],'#5AB3E6');

/* a number plank: one segment per original plank, unit lines every U px */

/* drag with pointer; onDrop(e) returns true when the drop was used (no fly-back) */
function Drag({onDrop,onStart,disabled,children}){
  const [o,setO]=useState({x:0,y:0}),[d,setD]=useState(false),[back,setBack]=useState(false),st=useRef(null);
  const down=e=>{if(disabled)return;e.preventDefault();const el=e.currentTarget;st.current={sx:e.clientX,sy:e.clientY,el};
    try{el.setPointerCapture(e.pointerId)}catch(_){};setBack(false);setD(true);onStart&&onStart()};
  const move=e=>{const q=st.current;if(!q)return;setO({x:e.clientX-q.sx,y:e.clientY-q.sy})};
  const up=e=>{const q=st.current;if(!q)return;st.current=null;setD(false);
    const used=onDrop?onDrop(e,q.el):false;
    if(used){setO({x:0,y:0})}else{setBack(true);setO({x:0,y:0});sfx.drop()}};
  return <div className={'drag'+(d?' dragging':'')+(back?' back':'')} style={{transform:`translate(${o.x}px,${o.y}px)`}}
    onPointerDown={down} onPointerMove={move} onPointerUp={up} onPointerCancel={up}>{children}</div>;
}

    setPlanks(next);R.current.planks=next;setMergedId(m.id);setMergeN(x=>x+1);setHl([]);sfx.merge();
    stats.current[R.current.ri].merges++;
    log('merge',{a,b,sum:a+b});
    (async()=>{
      await say(`⁦${a}+${b}⁩ זה ${a+b}!`); if(!alive())return;   // LTR isolate, so "1+4" is not shown as "4+1"
      if(!reachable(next.map(total),round.gap)){
        setPhase('busy');
        await say(`אופס, עם הקרשים האלה אי אפשר לבנות גשר באורך ${round.gap}. נפרק אותם ונתחיל שוב.`); if(!alive())return;
        resetPlanks();setPhase('build');
      }
      armNudges(alive);
    })();
    return true;
  }

  async function tryBridge(p){
    const alive=newFlow(); clearNudges();hush();
    const {round,ri}=R.current, n=total(p), g=round.gap;
    const state=n===g?'fit':n<g?'short':'long';
    setPhase('busy');setBridge({p,state});setHl([]);
    KP.answer(state==='fit');log('bridge_attempt',{gap:g,plank:n,correct:state==='fit'});
    await sleep(160); if(!alive())return;
    if(state==='fit'){
      sfx.thud();setHot(true);
      await sleep(350);setHot(false);
      sfx.win();
      await say(`${n}! בדיוק ברוחב הנהר. הגשר מוכן!`); if(!alive())return;
      // walk across
      setHero({at:'right',walk:true,vis:true,snap:false,cheer:false});
      for(let k=0;k<14;k++)later(alive,k*135,()=>sfx.step(k));
      await sleep(1900); if(!alive())return;
      setHero(h=>({...h,walk:false,cheer:true}));
      sfx.coin();setCoinVis(false);
      await flyCoin(coinRef.current,chestRef.current); if(!alive())return;
      setProgress(ri+1);setBumpN(b=>b+1);tone(988,.25,'sine');setTimeout(()=>tone(1319,.3,'sine'),120);
      log('round_done',stats.current[ri]);
      await sleep(500); if(!alive())return;
      if(ri+1<ROUNDS){
        if(ri===0) await say('יש! עוד ארבעה גשרים, ותיבת האוצר תתמלא.');
        if(!alive())return;
        playRound(ri+1);return;
      }
      log('session_done',stats.current);
      setScreen('end');setLidOpen(false);setTaps(0);
      [523,659,784,1047,1319].forEach((f,j)=>setTimeout(()=>tone(f,.25),j*120));
      await sleep(700); if(!alive())return;
      await say('כל הכבוד! בנינו חמישה גשרים, וחיברנו מספרים עד 10. מילאנו את תיבת האוצר! לחצו עליה.');
      return;
    }
    // wrong: too short falls into the river, too long does not fit
    round.wrong++;stats.current[ri].wrong++;
    if(state==='short'){
      await sleep(450);if(!alive())return;
      const sc=sceneRef.current.getBoundingClientRect();
      setTimeout(()=>{sfx.splash();burst(sc.left+Lx+n*U,sc.top+groundY+40,['#7FC8F0','#fff','#3D9BD6'],20,.8)},450);
    }else{ sfx.thud();setTimeout(sfx.nope,350) }
    await sleep(1250); if(!alive())return;
    setBridge(null);setTrayN(x=>x+1);
    const msg=state==='short'?`${n} קצר מדי. הנהר ברוחב ${g}, חסר עוד ${g-n}.`:`${n} ארוך מדי. הנהר ברוחב ${g}.`;
    if(round.wrong>=2){
      resetPlanks(true);
      setHl(round.planks.filter(x=>x.key).map(x=>x.id));
      setPhase('build');
      await say(msg+' רמז: שני הקרשים שקופצים יוצרים ביחד '+g+'.');
    }else{
      setPhase('build');
      await say(msg+' ננסה שוב!');
    }
    if(alive())armNudges(alive);
  }

  function tapChest(){
    audio();hush();
    const first=taps===0;setTaps(t=>t+1);log('chest_tap',taps+1);
    setLidOpen(false);setTimeout(()=>setLidOpen(true),70);
    setTimeout(()=>{sfx.jackpot();coinBurst(bigChestRef.current,first?34:22)},200);
  }
  async function goNext(){
    if(leaving)return;setLeaving(true);hush();
    await KP.complete({rounds:ROUNDS,firstTry:stats.current.filter(s=>s&&!s.wrong).length});
    KP.next();
  }
  function toggleSound(){const v=!sound;setSound(v);soundOn=v;if(!v&&hasTTS)try{speechSynthesis.cancel()}catch(e){}}
  useEffect(()=>()=>{clearNudges();hush()},[]);

  /* ---------- render ---------- */
  const Header=(
    <header>
      <div className="title"><BridgeIcon s={26}/><span>בונים גשר</span></div>
      <div className="treasure" style={screen==='end'?{visibility:'hidden'}:null}>
        <div className="pbar"><div className="pfill" style={{width:(progress/ROUNDS*100)+'%'}}/></div>
        <Chest key={'c'+bumpN} innerRef={chestRef} count={progress} bump={bumpN>0}/>
      </div>
      <div className="tools">
        {screen!=='end'&&<button className="iconbtn" title="חזרה על ההוראה" aria-label="חזרה על ההוראה" onClick={()=>say(lastSay.current)} disabled={screen!=='play'||!lastSay.current}>↻</button>}
        <button className="iconbtn" title="קול" aria-label="קול" onClick={toggleSound}>{sound?'🔊':'🔇'}</button>
        {KP.inCourse&&<button className="iconbtn" title="חזרה לקורס" aria-label="חזרה לקורס" onClick={()=>{hush();KP.exit()}}>✕</button>}
      </div>
    </header>);

  const riverTop=groundY+Math.round(T*.6);
  const Scene=(
    <div className="scene" ref={sceneRef}>
      <div style={{left:0,top:riverTop,width:W,height:H-riverTop}}><River w={W} h={Math.max(10,H-riverTop)}/></div>
      <div style={{left:0,top:groundY,width:Lx,height:H-groundY}}><Cliff w={Lx} h={H-groundY} side="l"/></div>
      <div className="rcliff" style={{left:Rx,top:groundY,width:W-Lx-5*U,height:H-groundY}}><Cliff w={W-Lx-5*U} h={H-groundY} side="r"/></div>
      {round&&<>
        <div className={'cells'+(hot?' hot':'')} style={{left:Lx,top:groundY,width:gap*U,height:T,opacity:bridge?0:1}}>
          {Array.from({length:gap},(_,k)=><i key={k} style={{width:U,height:T}}/>)}</div>
        <div className="measure" style={{left:Lx,top:groundY-T-30,width:gap*U,height:36,opacity:bridge&&bridge.state==='fit'?0:1}}>
          <span key={measurePop} className="mnum pop">{gap}</span></div>
      </>}
      {bridge&&<div style={{left:Lx,top:bridge.state==='long'?groundY-T:groundY,zIndex:2}}>
        <div className={'bridge '+bridge.state}><Plank p={bridge.p} U={U} T={T} showSum={false}/></div></div>}
      {coinVis&&<div className="coin2" ref={coinRef} style={{left:Rx+Math.max(10,Math.min(26,(W-Rx)/2-17)),top:groundY-Math.round(hs*.5)-10}}><Coin s={Math.round(hs*.5)}/></div>}
      <div className={'hero'+(hero.snap?' snap':'')} style={{left:heroX,top:groundY-hs+2,width:hw,height:hs,opacity:hero.vis?1:0}}>
        <div className={'in'+(hero.vis?' show':'')} key={hero.vis?'v'+ri:'h'}>
          <Player s={hs} view="side" shadow={false} happy walking={hero.walk} cheer={hero.cheer}/></div></div>
    </div>);

  const inBridge=bridge?bridge.p.id:null;
  const Tray=(
    <div className="tray">
      <button className="reset" title="לפרק את הקרשים" aria-label="לפרק את הקרשים" disabled={phase!=='build'||planks.length===(round?round.planks.length:0)} onClick={()=>{hush();resetPlanks()}}>↺</button>
      {planks.map((p,k)=>(
        <div key={p.id+'-'+trayN} className={'fall'+(p.id===inBridge?' slotgone':'')} style={{animationDelay:(mergedId?0:k*.12)+'s'}}>
          <Drag disabled={phase!=='build'} onStart={()=>{audio();sfx.pick();setHot(true)}} onDrop={(e,el)=>{const used=onDrop(p.id,e,el);setHot(false);return used}}>
            <Plank key={mergedId===p.id?'m'+mergeN:'p'} p={p} U={U} T={T} cls={(hl.includes(p.id)?'hl ':'')+(mergedId===p.id?'merged':'')}/>
          </Drag>
        </div>))}
    </div>);

  const Talk=(
    <div className="talk">
      <div className="spawn"><Player s={92} talking={!!talking}/></div>
      <div className="bubble" aria-live="polite"><div className="txt" key={capN}>{caption||'…'}</div></div>
    </div>);

  let overlay=null;
  if(screen==='start'){
    overlay=(<div className="center" key="start">
      <div className="fall"><Player s={130}/></div>
      <div className="h1 fall" style={{animationDelay:'.2s'}}>בונים גשר</div>
      <div className="note fall" style={{animationDelay:'.35s'}}>מחברים קרשים עד שהם בדיוק ברוחב הנהר, ועוזרים לחבר שלנו להגיע למטבע.</div>
      <div className="fall" style={{animationDelay:'.5s'}}><button className="cta" onClick={start}>מתחילים</button></div>
      {hasTTS&&!heVoice&&<div className="note">לא נמצא קול בעברית בדפדפן הזה, אז הקריינות תופיע ככתוביות.</div>}
    </div>);
  }else if(screen==='end'){
    overlay=(<div className="center" key="end">
      <div className="h1 fall">כל הכבוד!</div>
      <div className="fall" style={{animationDelay:'.15s'}}>
        <button ref={bigChestRef} className={'bigchest'+(taps===0?' idle':'')} onClick={tapChest} aria-label="לפתוח את תיבת האוצר">
          <Chest key={'big'+taps} count={ROUNDS} open={lidOpen} bump={taps>0} s={300}/></button></div>
      <div className="note fall" style={{animationDelay:'.3s'}}>{taps===0?'לחצו על התיבה':'אפשר ללחוץ שוב!'}</div>
      <div className="fall" style={{animationDelay:'.6s'}}><button className="cta" onClick={goNext} disabled={leaving}>המשך</button></div>
    </div>);
  }

  return(<>
    <LowPolyBG/>
    <div className="app">{Header}
      <div className="stage" style={screen==='play'?null:{visibility:'hidden'}}>{Scene}{Tray}</div>
      {screen==='play'&&Talk}
      {overlay}
    </div></>);
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
