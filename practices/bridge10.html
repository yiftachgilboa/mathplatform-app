<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kidodo · בונים גשר</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.23.5/babel.min.js"></script>
<script src="/practices/kidodo-practice.js"></script>
<style>
:root{--ink:#33373b;--blue:#3D6FE0;--kblue:#176fbe;--coral:#FF6450;--yellow:#FFC531;--teal:#1FB5A2;--purple:#8E5CF0;--panel:#FFF7E6}
*{box-sizing:border-box;margin:0}
html,body{overflow:hidden;height:100%}
body{font-family:Fredoka,system-ui,sans-serif;color:var(--ink);background:#CDEBFA;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:0}
.bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
.app{position:relative;z-index:1;display:flex;flex-direction:column;height:100vh;height:100dvh}
.top{flex:none;width:100%;max-width:960px;margin:0 auto;padding:10px 14px 0;display:flex;flex-direction:column;gap:6px;position:relative;z-index:8;pointer-events:none}
.top>*{pointer-events:auto}

/* header (same frame as the other practices) */
header{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:6px;flex:none}
.title{justify-self:start;min-width:0;max-width:100%;font-weight:700;font-size:16px;display:flex;align-items:center;gap:6px;color:var(--kblue);background:rgba(255,255,255,.88);padding:6px 14px 6px 12px;clip-path:polygon(0 0,100% 0,calc(100% - 12px) 100%,0 100%)}
.title svg{flex:none}
.title span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;gap:6px;justify-content:flex-end}
@media(max-width:419px){.title span{display:none}.title{padding:6px 16px 6px 8px}}
@media(min-width:700px){header{gap:10px}.title{font-size:19px;gap:8px;padding:6px 14px 6px 16px}.tools{gap:8px}}
.iconbtn{width:44px;height:44px;border-radius:50%;font-size:19px;color:var(--kblue);background:#F4F8FF;box-shadow:0 4px 0 rgba(23,111,190,.22)}
.iconbtn:disabled{opacity:.45}
.treasure{display:flex;align-items:center;gap:8px;padding:4px 0}
.treasure .chest{width:48px;height:38px}
.pbar{width:64px;height:16px;border-radius:8px;background:rgba(23,111,190,.16);overflow:hidden}
@media(min-width:700px){.treasure{gap:10px;padding:4px 14px}.treasure .chest{width:62px;height:50px}.pbar{width:130px;height:18px;border-radius:9px}}
.pfill{height:100%;border-radius:9px;background:linear-gradient(180deg,#FFD95A 0 50%,#FFC531 50%);transition:width .8s cubic-bezier(.3,1.4,.5,1)}
.chest.bump{animation:bump .5s}
@keyframes bump{30%{transform:scale(1.25,.85)}60%{transform:scale(.9,1.15)}}
.lid{transition:transform .5s cubic-bezier(.3,1.6,.5,1);transform-origin:10px 30px;transform-box:view-box}
.chest.open .lid{transform:rotate(-35deg) translate(-6px,-10px)}

/* board: the whole lower screen. Ground + river at the bottom, edge to edge; planks lie anywhere above */
.board{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.board>*{position:absolute}
.world{will-change:transform}
.world>*{position:absolute}
.far{will-change:transform}
.wchest{background:none;padding:0;line-height:0;touch-action:manipulation;z-index:3;filter:drop-shadow(0 8px 0 rgba(23,80,130,.18))}
.wchest .chest{width:100%;height:auto;display:block}
.wchest.idle .chest{animation:chestCall 1.6s ease-in-out infinite}
.wchest:active .chest{transform:scale(.94)}
.endpanel{left:0;right:0;top:8px;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:70;text-align:center;padding:0 16px}
.endpanel .h1,.endpanel .note{background:rgba(255,255,255,.88);padding:6px 18px;border-radius:20px}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick .5s ease-in-out infinite alternate}
@keyframes flick{0%{transform:scale(1,1)}50%{transform:scale(.9,1.14)}100%{transform:scale(1.08,.86)}}
.ember{animation:ember 1.6s linear infinite}
@keyframes ember{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-70px);opacity:0}}
.spike{transform-box:fill-box;transform-origin:50% 100%;animation:spike 1.8s ease-in-out infinite alternate}
@keyframes spike{to{transform:translateY(-4px) scaleY(1.06)}}
.bub{transform-box:fill-box;transform-origin:center;animation:bub 2.4s ease-in infinite}
@keyframes bub{0%{transform:translateY(24px) scale(.3);opacity:0}30%{opacity:1}85%{transform:translateY(-6px) scale(1);opacity:1}100%{transform:translateY(-8px) scale(1.7);opacity:0}}
.mon{animation:mon 2.2s ease-in-out infinite alternate}
@keyframes mon{to{transform:translateY(-14px)}}
.mon .meye{transform-box:fill-box;transform-origin:center;animation:blink 3.5s infinite}
.mon .mmouth{transform-box:fill-box;transform-origin:50% 0;animation:chomp 1.1s ease-in-out infinite alternate}
@keyframes chomp{from{transform:scaleY(.3)}to{transform:scaleY(1)}}
@media(prefers-reduced-motion:reduce){.flame,.ember,.spike,.bub,.mon,.mon .mmouth,.wchest.idle .chest{animation:none}}
.measure.hot::before{background:#FFE27A}.measure.hot::after{border-color:#FFE27A}.measure.hot .mnum{transform:scale(1.2);color:#fff;background:var(--coral)}
.hand{position:absolute;left:0;top:0;z-index:60;pointer-events:none;opacity:0;filter:drop-shadow(0 4px 4px rgba(23,80,130,.3))}
.demoline{position:absolute;left:0;top:0;width:5px;border-radius:3px;background:#fff;transform-origin:top;z-index:59;pointer-events:none;opacity:0;box-shadow:0 0 8px #fff}
.ghost{position:absolute;left:0;top:0;z-index:58;pointer-events:none;opacity:0}
.measure{display:flex;align-items:center;justify-content:center;transition:width .9s cubic-bezier(.5,0,.3,1),opacity .3s;pointer-events:none}
.measure::before{content:"";position:absolute;left:0;right:0;top:50%;height:3px;margin-top:-1.5px;background:#fff;border-radius:2px}
.measure::after{content:"";position:absolute;left:0;right:0;top:50%;height:14px;margin-top:-7px;border-left:3px solid #fff;border-right:3px solid #fff}
.mnum{transition:transform .2s,background .2s,color .2s;position:relative;z-index:1;min-width:44px;height:36px;padding:0 10px;border-radius:18px;background:#fff;color:var(--coral);font-weight:700;font-size:24px;line-height:36px;text-align:center;box-shadow:0 4px 0 rgba(23,111,190,.22)}
.mnum.pop{animation:mpop .6s}
@keyframes mpop{40%{transform:scale(1.35)}}
.hero{z-index:3;pointer-events:none}
.hero .in.show{animation:heroIn .6s both}
@keyframes heroIn{from{transform:translateY(-140px)}60%{transform:translateY(0) scale(1.06,.92)}to{transform:none}}
.coin2{z-index:2;animation:bob 1.4s ease-in-out infinite alternate;pointer-events:none}
@keyframes bob{to{transform:translateY(-8px)}}
.wave{animation:wave 3s ease-in-out infinite alternate}
@keyframes wave{to{transform:translateX(14px)}}

/* number planks: flat, one colour per original plank, a line on every unit */
.pk{z-index:5;touch-action:none;cursor:grab}
.pk.dragging{cursor:grabbing;z-index:40}
.pk.home{transition:left .3s cubic-bezier(.3,1.3,.5,1),top .3s cubic-bezier(.3,1.3,.5,1)}
.plank{position:relative;display:flex;height:var(--T);direction:ltr;border-radius:calc(var(--T)*.32);overflow:visible}
.seg{position:relative;height:100%;background:var(--m);background-image:repeating-linear-gradient(90deg,transparent 0 calc(var(--U) - 2px),rgba(0,0,0,.14) calc(var(--U) - 2px) var(--U))}
.seg:first-child{border-radius:calc(var(--T)*.32) 0 0 calc(var(--T)*.32)}.seg:last-child{border-radius:0 calc(var(--T)*.32) calc(var(--T)*.32) 0}.seg:only-child{border-radius:calc(var(--T)*.32)}
.seg+.seg{box-shadow:inset 3px 0 0 #fff}
.pnum{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.18);pointer-events:none}
.psum{position:absolute;left:50%;bottom:calc(100% + 5px);transform:translateX(-50%);white-space:nowrap;font-weight:700;font-size:15px;color:var(--ink);background:rgba(255,255,255,.9);padding:1px 9px;border-radius:10px;pointer-events:none}
.pk.dragging .plank{filter:brightness(1.08);box-shadow:0 10px 18px rgba(23,80,130,.25)}
.plank.hl{animation:hl .9s ease-in-out 3}
@keyframes hl{50%{transform:translateY(-6px) scale(1.06);filter:brightness(1.15)}}
.plank.merged{animation:merge .5s}
@keyframes merge{30%{transform:scale(1.12,.86)}65%{transform:scale(.96,1.06)}}
.plank.split{animation:split .45s}
@keyframes split{30%{transform:scale(.9,1.1) rotate(-3deg)}}
.plank.nope{animation:shake .4s}
.bridge{z-index:2}
.bridge.fit{animation:fitIn .45s cubic-bezier(.3,1.4,.5,1) both}
@keyframes fitIn{from{transform:translateY(-60px)}}
.bridge.short{transform-origin:0 50%;animation:tipOff 1.3s cubic-bezier(.5,0,.8,.6) both}
@keyframes tipOff{0%{transform:translateY(-60px)}25%{transform:translateY(0)}45%{transform:rotate(14deg)}100%{transform:translate(20px,170px) rotate(40deg);opacity:.2}}
.bridge.long{animation:noFit 1.2s both}
@keyframes noFit{0%{transform:translateY(-60px)}25%{transform:translateY(0)}35%,55%,75%{transform:translateX(-8px)}45%,65%{transform:translateX(8px)}85%{transform:none;opacity:1}100%{transform:translateY(60px);opacity:0}}
.trail{left:0;top:0;pointer-events:none;z-index:50;overflow:visible}
.trail polyline{fill:none;stroke:#fff;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 4px rgba(255,255,255,.9))}
.trail.fade{animation:tfade .35s forwards}
@keyframes tfade{to{opacity:0}}
.reset{top:8px;left:12px;width:44px;height:44px;border-radius:50%;font-size:22px;color:var(--kblue);background:#fff;box-shadow:0 4px 0 rgba(23,111,190,.22);z-index:6}
.reset:disabled{opacity:.4}
.fall{animation:fall .8s cubic-bezier(.3,.9,.4,1) both}
@keyframes fall{0%{transform:translateY(-300px)}45%{transform:translateY(0) scale(1.08,.88)}62%{transform:translateY(-22px) scale(.97,1.04)}80%{transform:translateY(0)}90%{transform:translateY(-5px)}100%{transform:none}}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}

/* talk */
.talk{display:flex;align-items:flex-end;gap:10px;min-height:64px;flex:none}
.bubble{flex:1;background:#fff;padding:8px 14px;font-size:16px;line-height:1.4;font-weight:500;position:relative;box-shadow:0 5px 0 rgba(23,111,190,.18);margin-bottom:10px;border-radius:14px}
@media(min-width:700px){.bubble{padding:12px 18px;font-size:19px}}
.bubble::before{content:"";position:absolute;right:-16px;bottom:14px;border:12px solid transparent;border-left-color:#fff;border-right:0}
.bubble .txt{animation:txtIn .35s both}
@keyframes txtIn{from{opacity:0;transform:translateY(6px)}}
.spawn{position:relative;flex:none;display:flex;justify-content:center;padding-bottom:6px}
.spawn::before{content:"";position:absolute;bottom:0;left:50%;width:70px;height:22px;margin-left:-35px;border-radius:50%;background:#9FD3F2;box-shadow:0 0 0 5px rgba(255,255,255,.7),0 0 0 11px rgba(255,255,255,.3)}
.spawn svg{position:relative}
.speechbtn{position:absolute;left:-14px;bottom:-4px;width:44px;height:44px;border-radius:50%;background:#fff;color:var(--kblue);box-shadow:0 3px 0 rgba(23,111,190,.22);display:flex;align-items:center;justify-content:center;z-index:2}
.speechbtn svg{position:static}
.mascot{flex:none;overflow:visible}
.mascot .body{transform-origin:50% 100%;transform-box:fill-box}
.mascot.talking .body{animation:mbob .32s infinite alternate}
@keyframes mbob{to{transform:scale(1.03,.97) rotate(-2deg)}}
.mascot .mouth{transform-origin:center;transform-box:fill-box;transform:scaleY(.35)}
.mascot.talking .mouth{animation:mouth .16s infinite alternate}
@keyframes mouth{from{transform:scaleY(.25)}to{transform:scaleY(1.3)}}
.mascot .eye{transform-origin:center;transform-box:fill-box;animation:blink 4s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.mascot .arm{transform-origin:0 0;transform-box:fill-box}
.mascot.talking .arm{animation:arm .5s infinite alternate}
@keyframes arm{to{transform:rotate(-40deg)}}
.mascot .feather{transform-origin:0 100%;transform-box:fill-box;animation:feather 1.6s infinite alternate}
@keyframes feather{to{transform:rotate(12deg)}}
.mascot .leg,.mascot .armS{transform-origin:50% 0;transform-box:fill-box}
.mascot.walking .l1{animation:legA .26s infinite alternate}
.mascot.walking .l2,.mascot.walking .armS{animation:legA .26s infinite alternate-reverse}
@keyframes legA{from{transform:rotate(28deg)}to{transform:rotate(-28deg)}}
.mascot.walking .body{animation:wbob .13s infinite alternate}
@keyframes wbob{to{transform:translateY(-1.5px)}}
.cheer .body{animation:cheer .35s 3 alternate}
@keyframes cheer{to{transform:translateY(-10px)}}

/* screens */
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:20px;z-index:5}
.center .h1,.center .note{background:rgba(255,255,255,.85);padding:6px 18px;border-radius:20px}
.cta{min-height:56px;font-size:26px;font-weight:700;padding:14px 48px;color:#fff;background:linear-gradient(180deg,#FF8270 0 50%,#FF6450 50%);clip-path:polygon(16px 0,calc(100% - 16px) 0,100% 50%,calc(100% - 16px) 100%,16px 100%,0 50%);transition:transform .12s}
.cta:active{transform:scale(.93)}
.h1{font-size:30px;font-weight:700}
.note{color:#5c6066;font-size:16px;max-width:440px}
.bigchest{background:none;padding:0;line-height:0;touch-action:manipulation;filter:drop-shadow(0 10px 0 rgba(23,111,190,.2))}
.bigchest .chest{width:min(72vw,300px,42dvh);height:auto}
.bigchest.idle .chest{animation:chestCall 1.6s ease-in-out infinite}
@keyframes chestCall{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(-5deg) scale(1.04)}80%{transform:rotate(5deg) scale(1.04)}90%{transform:rotate(-3deg)}}
.bigchest:active .chest{transform:scale(.94)}
.bigchest:focus-visible{outline:4px solid #fff;outline-offset:6px;border-radius:20px}
.coin{position:fixed;left:0;top:0;border-radius:50%;pointer-events:none;z-index:1001;will-change:transform,opacity;
  background:radial-gradient(circle at 35% 30%,#FFF4B0 0 18%,#FFD84A 19% 55%,#E9A913 56% 100%);box-shadow:inset 0 0 0 3px #C98A00}
.coin::after{content:"";position:absolute;inset:26%;border-radius:50%;border:2px solid rgba(201,138,0,.55)}
@media(prefers-reduced-motion:reduce){.bigchest.idle .chest,.coin2,.wave{animation:none}}
.pt{position:fixed;pointer-events:none;z-index:999;will-change:transform,opacity}
.flycoin{position:fixed;width:30px;height:30px;margin:-15px 0 0 -15px;z-index:1000;pointer-events:none}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const {useState,useEffect,useRef} = React;

/* ---------- helpers ---------- */
const SPOKEN=['אֶפֶס','אַחַת','שְׁתַּיִם','שָׁלוֹשׁ','אַרְבַּע','חָמֵשׁ','שֵׁשׁ','שֶׁבַע','שְׁמוֹנֶה','תֵּשַׁע','עֶשֶׂר','אַחַת עֶשְׂרֵה','שְׁתֵּים עֶשְׂרֵה'];
const toSpeech=t=>t.replace(/\d+/g,m=>SPOKEN[+m]??m).replace(/־/g,' ').replace(/\+/g,' ועוד ');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const rand=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const shuffle=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
const ROUNDS=5, MAXLEN=10;
const GEMC=['#FF6450','#3D6FE0','#1FB5A2','#8E5CF0','#FFC531'];
/* plank colours (flat): coral, blue, purple */
const PC=[{m:'#FF6450'},{m:'#3D6FE0'},{m:'#8E5CF0'}];
const total=p=>p.segs.reduce((s,x)=>s+x.n,0);
/* can some of the planks (one or more) make exactly `gap`? */
function reachable(vals,gap){const n=vals.length;for(let m=1;m<(1<<n);m++){let s=0;for(let i=0;i<n;i++)if(m&(1<<i))s+=vals[i];if(s===gap)return true}return false}

let lastGap=null;
function genRound(i){
  const [lo,hi]=i<2?[5,7]:[7,10];
  let gap,g=0; do{gap=rand(lo,hi);g++}while(gap===lastGap&&g<50); lastGap=gap;
  const a=rand(1,Math.min(4,gap-1)), b=gap-a, c=rand(1,4);
  const ids=shuffle([0,1,2]);
  const planks=(i===0?[a,b]:[a,b,c]).map((n,k)=>({id:`r${i}-${k}`,segs:[{n,c:ids[k]}],key:k<2}));   // first scene: just the two that make it
  return {gap,planks:shuffle(planks),wrong:0};
}

/* ---------- sound: everything made in code (Web Audio), no files ---------- */
let heVoice=null, actx=null, soundOn=true, speechOn=true, noiseBuf=null;
const hasTTS=typeof window!=='undefined'&&'speechSynthesis' in window;
function loadVoice(){try{const hv=speechSynthesis.getVoices().filter(v=>/^(he|iw)/i.test(v.lang));heVoice=hv.find(v=>/hila|carmit|female|woman/i.test(v.name))||hv.find(v=>!/avri|asaf|male/i.test(v.name))||hv[0]||null}catch(e){}}
if(hasTTS){loadVoice();try{speechSynthesis.onvoiceschanged=loadVoice}catch(e){}}
function audio(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume()}catch(e){}}
function tone(f,d=.15,type='triangle',vol=.12,slideTo){
  if(!actx||!soundOn)return;
  try{const t=actx.currentTime,o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
    if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,t+d);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g).connect(actx.destination);o.start(t);o.stop(t+d)}catch(e){}
}
function noise(d,{type='bandpass',f=800,f2,q=1,vol=.25}={}){
  if(!actx||!soundOn)return;
  try{
    if(!noiseBuf){noiseBuf=actx.createBuffer(1,actx.sampleRate,actx.sampleRate);const ch=noiseBuf.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=Math.random()*2-1}
    const t=actx.currentTime,s=actx.createBufferSource(),fl=actx.createBiquadFilter(),g=actx.createGain();
    s.buffer=noiseBuf;fl.type=type;fl.Q.value=q;fl.frequency.setValueAtTime(f,t);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+d);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
    s.connect(fl).connect(g).connect(actx.destination);s.start(t);s.stop(t+d)}catch(e){}
}
const sfx={
  pick(){tone(520,.06,'sine',.08)},
  drop(){tone(360,.06,'sine',.07)},
  knock(){noise(.07,{f:900,q:3,vol:.35});tone(190,.09,'triangle',.14)},           // wood on wood
  merge(){sfx.knock();setTimeout(()=>{noise(.06,{f:1300,q:4,vol:.3});tone(260,.08,'triangle',.12)},90);setTimeout(()=>tone(784,.14,'sine',.08),190)},
  thud(){noise(.14,{type:'lowpass',f:500,vol:.5});tone(110,.18,'sine',.2,60)},
  splash(){noise(.7,{type:'lowpass',f:3200,f2:300,vol:.35});setTimeout(()=>noise(.35,{f:1800,f2:600,q:.8,vol:.18}),120)},
  chop(){noise(.18,{type:'highpass',f:5000,f2:900,vol:.3});setTimeout(()=>{noise(.06,{f:1100,q:3,vol:.3});tone(240,.07,'triangle',.1)},140)},   // knife swish + clack
  sizzle(){noise(.8,{type:'highpass',f:2500,f2:6000,vol:.22});tone(90,.4,'sawtooth',.06,50)},
  crack(){sfx.knock();setTimeout(()=>{noise(.08,{f:2200,q:2,vol:.3});tone(150,.1,'triangle',.12)},120)},
  chomp(){tone(140,.09,'square',.09,80);setTimeout(()=>tone(120,.12,'square',.09,60),160)},
  nope(){tone(220,.14,'square',.05);setTimeout(()=>tone(165,.2,'square',.05),130)},
  step(i){tone(i%2?330:294,.05,'triangle',.06)},
  win(){[523,659,784,1047].forEach((f,j)=>setTimeout(()=>tone(f,.2),j*110))},
  coin(){tone(988,.08,'square',.05);setTimeout(()=>tone(1319,.25,'square',.05),80)},
  jackpot(){tone(330,.12,'square',.05);setTimeout(()=>tone(660,.1,'square',.05),70);
    for(let i=0;i<7;i++)setTimeout(()=>{const f=1600+Math.random()*900;tone(f,.09,'triangle',.08);setTimeout(()=>tone(f*1.5,.12,'sine',.06),45)},140+i*70+Math.random()*50)},
};

/* ---------- particles ---------- */
function burst(x0,y0,colors,n=22,spread=1){
  for(let i=0;i<n;i++){
    const p=document.createElement('div');p.className='pt';const s=5+Math.random()*9;
    p.style.cssText=`left:${x0}px;top:${y0}px;width:${s}px;height:${s}px;background:${colors[i%colors.length]};`+(i%3===0?'border-radius:50%;':i%3===1?'clip-path:polygon(50% 0,100% 100%,0 100%);':'border-radius:2px;');
    document.body.appendChild(p);
    const ang=-Math.PI/2+(Math.random()-.5)*2.4*spread, dist=50+Math.random()*110, dx=Math.cos(ang)*dist, dy=Math.sin(ang)*dist;
    const a=p.animate([{transform:'translate(0,0)',opacity:1},{transform:`translate(${dx*.7}px,${dy*.7}px) rotate(${Math.random()*360}deg)`,opacity:1,offset:.55},
      {transform:`translate(${dx}px,${dy+90}px) rotate(${Math.random()*720}deg) scale(.4)`,opacity:0}],{duration:700+Math.random()*500,easing:'cubic-bezier(.15,.7,.4,1)'});
    a.onfinish=()=>p.remove();
  }
}
let liveCoins=0;
function coinBurst(el,n=26){
  if(!el)return; const r=el.getBoundingClientRect(); if(!r.width)return;
  const x0=r.left+r.width/2, y0=r.top+r.height*.38, H=window.innerHeight;
  const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  n=Math.min(n,Math.max(0,140-liveCoins)); if(reduce)n=Math.min(n,8);
  for(let i=0;i<n;i++){
    const c=document.createElement('div');c.className='coin';const s=20+Math.random()*16;c.style.width=c.style.height=s+'px';
    document.body.appendChild(c);liveCoins++;
    const vx=(Math.random()-.5)*Math.min(900,window.innerWidth*1.6), vy=-(520+Math.random()*520), g=1500;
    const T=Math.max(1.1,(-vy+Math.sqrt(vy*vy+2*g*(H-y0+60)))/g), spin=2+Math.floor(Math.random()*4), frames=[];
    for(let k=0;k<=12;k++){const t=T*k/12, x=x0+vx*t-s/2, y=y0+vy*t+.5*g*t*t-s/2;
      frames.push({transform:`translate(${x}px,${y}px) scaleX(${Math.cos(k/12*spin*Math.PI*2).toFixed(2)})`,opacity:k===0?0:1})}
    const a=c.animate(frames,{duration:T*1000,delay:i*18,easing:'linear',fill:'both'});
    a.onfinish=()=>{c.remove();liveCoins--};
  }
}
/* the coin the hero picked up flies into the chest */
function flyCoin(fromEl,toEl){
  return new Promise(res=>{
    if(!fromEl||!toEl){res();return}
    const a=fromEl.getBoundingClientRect(),b=toEl.getBoundingClientRect();
    const g=document.createElement('div');g.className='flycoin';g.innerHTML=COIN_SVG;
    const x0=a.left+a.width/2,y0=a.top+a.height/2,x1=b.left+b.width/2,y1=b.top+b.height/2;
    g.style.left=x0+'px';g.style.top=y0+'px';document.body.appendChild(g);
    const mx=(x1-x0)/2,my=Math.min(y1,y0)-y0-100;
    const an=g.animate([{transform:'translate(0,0) scale(1)'},{transform:`translate(${mx}px,${my}px) scale(1.6) rotate(180deg)`,offset:.45},
      {transform:`translate(${x1-x0}px,${y1-y0}px) scale(.7) rotate(360deg)`}],{duration:950,easing:'cubic-bezier(.4,0,.3,1)'});
    an.onfinish=()=>{g.remove();res()};
  });
}

/* low-poly page background: sky, far hills, trees */
function rng(seed){return()=>{seed=(seed*16807)%2147483647;return(seed-1)/2147483646}}
const pts=a=>a.map(p=>p.join(',')).join(' ');
const LowPolyBG=React.memo(function LowPolyBG(){
  const W=1200,H=800,R=rng(11),els=[];let k=0;
  const poly=(p,f)=>els.push(<polygon key={k++} points={pts(p)} fill={f}/>);
  // sky in faceted bands
  const sky=['#CFEAFB','#C3E4FA','#B7DEF8','#ABD7F5'];
  for(let i=0;i<4;i++){const y0=i*120,y1=y0+130;poly([[0,y0],[W,y0-20],[W,y1],[0,y1+20]],sky[i])}
  // sun + clouds
  poly([[980,90],[1010,60],[1050,60],[1080,90],[1080,130],[1050,160],[1010,160],[980,130]],'#FFE27A');
  poly([[1030,60],[1050,60],[1080,90],[1080,130],[1050,160],[1030,160]],'#FFD23F');
  const cloud=(x,y,s)=>{poly([[x,y],[x+s*.5,y-s*.45],[x+s,y-s*.2],[x+s*1.5,y-s*.5],[x+s*2,y],[x+s*2,y+s*.25],[x,y+s*.25]],'#fff');poly([[x,y+s*.25],[x+s*2,y+s*.25],[x+s*2,y],[x+s*1.2,y+s*.1]],'#E4F2FC')};
  cloud(120,120,70);cloud(560,70,50);cloud(820,200,40);
  // far hills
  poly([[0,470],[160,330],[330,430],[520,300],[700,420],[880,320],[1060,410],[1200,340],[1200,800],[0,800]],'#9ED79A');
  poly([[160,330],[330,430],[160,470]],'#8CCB8A');poly([[520,300],[700,420],[520,460]],'#8CCB8A');poly([[880,320],[1060,410],[880,450]],'#8CCB8A');
  // near ground
  poly([[0,560],[300,520],[640,560],[960,515],[1200,550],[1200,800],[0,800]],'#7CC57F');
  poly([[0,640],[400,610],[800,650],[1200,620],[1200,800],[0,800]],'#6CB872');
  const tree=(x,y,s)=>{
    poly([[x-s*.1,y-s*1.1],[x,y-s*1.1],[x,y],[x-s*.1,y]],'#9C7656');poly([[x,y-s*1.1],[x+s*.1,y-s*1.1],[x+s*.1,y],[x,y]],'#82604A');
    const cy=y-s*1.6, T=[x,cy-s*1.05], L=[x-s*.85,cy-s*.35], Rr=[x+s*.85,cy-s*.35], C=[x+s*.05,cy-s*.15], BL=[x-s*.7,cy+s*.5], BR=[x+s*.7,cy+s*.5], B=[x+s*.05,cy+s*.7];
    poly([T,L,C],'#93DA7F');poly([T,C,Rr],'#6CC86F');poly([L,BL,B,C],'#5BBE6A');poly([C,B,BR,Rr],'#3F9F5F')};
  [[70,600,46],[190,560,34],[1110,590,48],[1000,560,32],[60,760,52],[1150,770,50],[300,740,30],[900,750,34]].forEach(t=>tree(...t));
  return <svg className="bg" viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="xMidYMid slice">{els}</svg>;
});

/* cliff (low-poly rock with a grass cap). edgeL/edgeR = a river on that side (jagged edge) */
function Cliff({w,h,seed=1,edgeL=true,edgeR=true,pal=PALS[0]}){
  const r=rng(seed*7+3), el=[];let k=0;
  const poly=(p,f)=>el.push(<polygon key={k++} points={pts(p)} fill={f}/>);
  const L=edgeL?[[0,0],[6,h*.35],[-4,h*.7],[8,h]]:[[0,0],[0,h]];
  const Rr=edgeR?[[w,0],[w-6,h*.35],[w+4,h*.7],[w-8,h]]:[[w,0],[w,h]];
  poly([...L,...Rr.slice().reverse()],pal.b);
  // facets across the rock, every ~80px
  for(let x=22;x<w-60;x+=70+Math.round(r()*30)){
    const a=24+r()*26, m=h*(.45+r()*.2);
    poly([[x,0],[x+a,0],[x+a*.7,m],[x+a*.1,m-8]],pal.f1);
    poly([[x+a*.1,m-8],[x+a*.7,m],[x+a*1.2,h],[x-6,h]],r()<.5?pal.f2:pal.f3);
    poly([[x+a*.3,m*.4],[x+a*.3+10,m*.4-6],[x+a*.3+16,m*.4+4],[x+a*.3+6,m*.4+9]],'rgba(255,255,255,.18)');
  }
  if(edgeL)poly([[0,0],[6,h*.35],[-4,h*.7],[8,h],[26,h],[16,h*.6],[22,0]],pal.eL);
  if(edgeR)poly([[w,0],[w-6,h*.35],[w+4,h*.7],[w-8,h],[w-28,h],[w-18,h*.55],[w-24,0]],pal.eR);
  // grass cap
  poly([[-2,-4],[w+2,-4],[w,10],[w*.7,13],[w*.35,9],[0,12]],pal.g);
  poly([[-2,-4],[w+2,-4],[w*.6,4],[w*.2,5]],pal.gl);
  return <svg width={w+24} height={h+6} viewBox={`-12 -6 ${w+24} ${h+6}`} style={{display:'block',margin:'-6px 0 0 -12px'}}>{el}</svg>;
}

const OBST={

  fire:{name:'בור עם אש',fx:['#FF8A3D','#FFD23F','#FF6450'],sound:'sizzle'},

  monster:{name:'בור עם מפלצת',fx:['#8E5CF0','#FFC531','#fff'],sound:'chomp'},
};
function Pit({type,w,h,seed=1}){
  const r=rng(seed*11+5), el=[];let k=0;
  const poly=(p,f,props={})=>el.push(<polygon key={k++} points={pts(p)} fill={f} {...props}/>);
  const facets=(c1,c2)=>{for(let x=0;x<w;x+=36){poly([[x,h],[x+18,h*.45+r()*h*.2],[x+36,h]],c1);poly([[x+18,h*.45],[x+36,h],[x+50,h*.5]],c2)}};
  if(type==='water'){
    poly([[0,0],[w,0],[w,h],[0,h]],'#5AB3E6');
    const t=40,n=Math.ceil(w/t);
    for(let i=0;i<n;i++){const x=i*t;poly([[x,0],[x+t,0],[x+t/2,h*.5]],i%2?'#7FC8F0':'#6ABEEC');poly([[x+t/2,h*.5],[x+t*1.5,h*.5],[x+t,h]],i%2?'#3D9BD6':'#4AA6DE')}
    for(let i=0;i<n;i++){const x=i*t+8,y=h*(.22+(i%3)*.18);poly([[x,y],[x+14,y-4],[x+26,y]],'rgba(255,255,255,.75)',{className:'wave',style:{animationDelay:-i*.7+'s'}})}
  }else if(type==='fire'){
    poly([[0,0],[w,0],[w,h],[0,h]],'#5A2318');facets('#6E2A1C','#4A1C14');
    poly([[0,h*.75],[w,h*.7],[w,h],[0,h]],'#C9402F');
    const n=Math.max(3,Math.round(w/22));
    for(let i=0;i<n;i++){const x=(i+.5)*w/n, tip=h*(.05+r()*.15), base=h*.78;
      el.push(<g key={k++} className="flame" style={{animationDelay:-(r()*.5)+'s',animationDuration:.4+r()*.3+'s'}}>
        <polygon points={pts([[x-11,base],[x-5,h*.35],[x,tip],[x+6,h*.3],[x+11,base]])} fill="#FF8A3D"/>
        <polygon points={pts([[x,tip],[x+6,h*.3],[x+11,base],[x,base]])} fill="#FF6450"/>
        <polygon points={pts([[x-6,base],[x,h*.42],[x+6,base]])} fill="#FFD23F"/></g>)}
    for(let i=0;i<Math.max(3,Math.round(w/30));i++){const x=r()*w;el.push(<rect key={k++} className="ember" x={x} y={h*.5} width="4" height="4" fill="#FFD23F" style={{animationDelay:-(r()*1.6)+'s'}}/>)}
  }else if(type==='thorns'){
    poly([[0,0],[w,0],[w,h],[0,h]],'#4B3F6B');facets('#3E3459','#55487A');
    const n=Math.max(4,Math.round(w/14));
    for(let i=0;i<n;i++){const x=(i+.5)*w/n, tip=h*(.18+r()*.2), hw2=w/n*.55;
      el.push(<g key={k++} className="spike" style={{animationDelay:-(r()*1.8)+'s'}}>
        <polygon points={pts([[x-hw2,h],[x,tip],[x,h]])} fill="#D5D0EA"/><polygon points={pts([[x,tip],[x+hw2,h],[x,h]])} fill="#9D97BF"/></g>)}
  }else if(type==='swamp'){
    poly([[0,0],[w,0],[w,h],[0,h]],'#5E7F35');facets('#6E9140','#4F6D2C');
    poly([[0,0],[w,0],[w,h*.16],[0,h*.2]],'#7FA34A');
    for(let i=0;i<Math.max(1,Math.round(w/70));i++){const x=20+r()*(w-40),y=h*.08;poly([[x-12,y],[x-4,y-5],[x+10,y-3],[x+13,y+3],[x-6,y+5]],'#3F9F5F')}
    for(let i=0;i<Math.max(3,Math.round(w/26));i++){const x=8+r()*(w-16);el.push(<circle key={k++} className="bub" cx={x} cy={h*.25} r={3+r()*3} fill="#B5D58A" style={{animationDelay:-(r()*2.4)+'s'}}/>)}
  }else{
    poly([[0,0],[w,0],[w,h],[0,h]],'#3A2F55');facets('#31284A','#45386A');
    const mw=Math.min(w*.7,110), mh=mw*.85, cx=w/2, by=h*.2;     // the monster peeks up from the pit
    el.push(<g key={k++} className="mon">
      <polygon points={pts([[cx-mw*.42,by+mh*.1],[cx-mw*.32,by-mh*.22],[cx-mw*.22,by+mh*.02]])} fill="#FFC531"/>
      <polygon points={pts([[cx+mw*.42,by+mh*.1],[cx+mw*.32,by-mh*.22],[cx+mw*.22,by+mh*.02]])} fill="#E9A913"/>
      <polygon points={pts([[cx-mw/2,h],[cx-mw/2,by+mh*.25],[cx-mw*.3,by],[cx,by-mh*.05],[cx,h]])} fill="#8E5CF0"/>
      <polygon points={pts([[cx,by-mh*.05],[cx+mw*.3,by],[cx+mw/2,by+mh*.25],[cx+mw/2,h],[cx,h]])} fill="#6A3CC4"/>
      <circle className="meye" cx={cx-mw*.17} cy={by+mh*.22} r={mw*.1} fill="#fff"/><circle className="meye" cx={cx+mw*.17} cy={by+mh*.22} r={mw*.1} fill="#fff"/>
      <circle cx={cx-mw*.15} cy={by+mh*.24} r={mw*.045} fill="#33373b"/><circle cx={cx+mw*.19} cy={by+mh*.24} r={mw*.045} fill="#33373b"/>
      <g className="mmouth"><polygon points={pts([[cx-mw*.24,by+mh*.42],[cx+mw*.24,by+mh*.42],[cx+mw*.14,by+mh*.62],[cx-mw*.14,by+mh*.62]])} fill="#2A1F45"/>
        <polygon points={pts([[cx-mw*.16,by+mh*.42],[cx-mw*.1,by+mh*.52],[cx-mw*.04,by+mh*.42]])} fill="#fff"/>
        <polygon points={pts([[cx+mw*.04,by+mh*.42],[cx+mw*.1,by+mh*.52],[cx+mw*.16,by+mh*.42]])} fill="#fff"/></g></g>);
  }
  return <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`} style={{display:'block',overflow:'hidden'}}>{el}</svg>;
}

/* a number plank: flat, one segment per colour, unit lines every U px */
function Plank({p,U,T,cls='',showSum=true}){
  const n=total(p), fs=Math.max(15,Math.min(26,T*.72));
  return (<div className={'plank '+cls} style={{'--U':U+'px','--T':T+'px',width:n*U}}>
    {p.segs.map((s,i)=><div key={i} className="seg" style={{width:s.n*U,'--m':PC[s.c].m}}/>)}
    <span className="pnum" style={{fontSize:fs}}>{n}</span>
    {showSum&&p.segs.length>1&&<span className="psum" dir="ltr">{p.segs.map(s=>s.n).join('+')}</span>}
  </div>);
}

/* the teaching hand: 'cut' = a quick stroke down through a plank, 'join' = drag one plank onto another */
function HandDemo({demo,U,T}){
  const handRef=useRef(null), lineRef=useRef(null), ghostRef=useRef(null);
  useEffect(()=>{
    const anims=[], opt={duration:2200,iterations:Infinity,easing:'ease-in-out'};
    if(demo.kind==='cut'){
      const {x,y0,y1}=demo;
      anims.push(handRef.current.animate([
        {transform:`translate(${x-14}px,${y0-40}px)`,opacity:0},
        {transform:`translate(${x-14}px,${y0}px)`,opacity:1,offset:.2},
        {transform:`translate(${x-14}px,${y0}px)`,opacity:1,offset:.35},
        {transform:`translate(${x-18}px,${y1}px)`,opacity:1,offset:.5},
        {transform:`translate(${x-18}px,${y1}px)`,opacity:1,offset:.75},
        {transform:`translate(${x-18}px,${y1+20}px)`,opacity:0}],opt));
      anims.push(lineRef.current.animate([
        {transform:`translate(${x-2}px,${y0}px) scaleY(0)`,opacity:0},
        {transform:`translate(${x-2}px,${y0}px) scaleY(0)`,opacity:1,offset:.35},
        {transform:`translate(${x-2}px,${y0}px) scaleY(1)`,opacity:1,offset:.5},
        {transform:`translate(${x-2}px,${y0}px) scaleY(1)`,opacity:0,offset:.75},
        {transform:`translate(${x-2}px,${y0}px) scaleY(1)`,opacity:0}],opt));
    }else{
      const {a,b}=demo;     // centres
      const hk=[{transform:`translate(${a.x-14}px,${a.y}px)`,opacity:0},
        {transform:`translate(${a.x-14}px,${a.y}px)`,opacity:1,offset:.15},
        {transform:`translate(${a.x-14}px,${a.y}px)`,opacity:1,offset:.25},
        {transform:`translate(${b.x-14}px,${b.y}px)`,opacity:1,offset:.7},
        {transform:`translate(${b.x-14}px,${b.y}px)`,opacity:0}];
      anims.push(handRef.current.animate(hk,opt));
      const gw=demo.w;
      anims.push(ghostRef.current.animate([
        {transform:`translate(${a.x-gw/2}px,${a.y-T/2}px)`,opacity:0},
        {transform:`translate(${a.x-gw/2}px,${a.y-T/2}px)`,opacity:.6,offset:.25},
        {transform:`translate(${b.x-gw/2}px,${b.y-T/2}px)`,opacity:.6,offset:.7},
        {transform:`translate(${b.x-gw/2}px,${b.y-T/2}px)`,opacity:0}],opt));
    }
    return()=>anims.forEach(a=>a.cancel());
  },[demo]);
  return (<>
    {demo.kind==='cut'&&<i ref={lineRef} className="demoline" style={{height:demo.y1-demo.y0}}/>}
    {demo.kind==='join'&&<div ref={ghostRef} className="ghost"><Plank p={demo.p} U={U} T={T} showSum={false}/></div>}
    <div ref={handRef} className="hand"><HandIcon/></div>
  </>);
}

/* ---------- app ---------- */
function App(){
  const [screen,setScreen]=useState('start');      // start | play | end
  const [ri,setRi]=useState(0);
  const [rounds,setRounds]=useState([]);           // all 5 made at the start, so the next pit is already there
  const [planks,setPlanks]=useState([]);           // [{id,segs,key,x,y,z}] x,y = top-left on the board
  const [fallN,setFallN]=useState(0);
  const [drag,setDrag]=useState(null);
  const [phase,setPhase]=useState('busy');         // build | busy
  const [bridge,setBridge]=useState(null);         // {p, state:'fit'|'short'|'long'} the try in the current pit
  const [built,setBuilt]=useState([]);             // bridges that stay behind: [{i,p}]
  const [worldI,setWorldI]=useState(0),[walkDur,setWalkDur]=useState(0);   // the world scrolls to pit worldI
  const [hero,setHero]=useState({walk:false,vis:false,cheer:false});
  const [coinTaken,setCoinTaken]=useState(-1);
  const [hl,setHl]=useState([]);
  const [fx,setFx]=useState({}),[fxN,setFxN]=useState(0);
  const [hot,setHot]=useState(false);
  const [trail,setTrail]=useState(null);
  const [demo,setDemo]=useState(null);             // teaching hand
  const [measurePop,setMeasurePop]=useState(0);
  const [caption,setCaption]=useState(''),[capN,setCapN]=useState(0),[talking,setTalking]=useState(false);
  const [progress,setProgress]=useState(0),[bumpN,setBumpN]=useState(0);
  const [sound,setSound]=useState(true);
  const [lidOpen,setLidOpen]=useState(false),[taps,setTaps]=useState(0),[leaving,setLeaving]=useState(false);
  const [size,setSize]=useState({w:360,h:560});

  const boardRef=useRef(null), chestRef=useRef(null), coinRef=useRef(null), bigChestRef=useRef(null);
  const R=useRef({}); R.current={...R.current,rounds,planks,phase,ri,round:rounds[ri]};
  const flow=useRef(0), finRef=useRef(null), lastSay=useRef(''), nudges=useRef([]), stats=useRef([]);
  const dragRef=useRef(null), strokeRef=useRef(null), zTop=useRef(10), idN=useRef(0);
  const teach=useRef('cut'), teachTimer=useRef(null);      // cut → join → done

  useEffect(()=>{const el=boardRef.current;if(!el)return;const m=()=>setSize({w:el.clientWidth,h:el.clientHeight});m();
    if(typeof ResizeObserver==='undefined'){window.addEventListener('resize',m);return()=>window.removeEventListener('resize',m)}
    const ro=new ResizeObserver(m);ro.observe(el);return()=>ro.disconnect()},[screen]);

  /* geometry: one unit U for the river and the planks (lengths can be compared by eye) */
  const W=size.w, H=size.h;
  const U=Math.max(16,Math.min(46,Math.floor((Math.min(W,1000)-80)/MAXLEN),Math.floor((W-24)/17)));
  const T=Math.max(28,Math.round(U*1.3));            // thick enough for a finger
  const Lx=Math.round((W-MAXLEN*U)/2);               // the edge the hero stands at, on screen
  const groundH=Math.round(Math.max(110,Math.min(230,H*.3)));
  const groundY=H-groundH;
  const hs=Math.max(46,Math.min(76,Math.round(H*.12))), hw=hs*.75;
  const heroX=Lx-hw-6;                               // the hero never moves; the world does
  const C=Math.max(hw+70,Math.round(U*5),W-Lx+40);   // the land between two pits: wide, so the next pit is out of view
  // world x of each pit: E[i] = left edge, S[i] = right edge (start of the next land)
  const E=[],S=[];{let e=Lx;rounds.forEach((r,i)=>{E[i]=e;S[i]=e+r.gap*U;e=S[i]+C});E[rounds.length]=e}   // E[5] = where the chest waits
  const gap=rounds[ri]?rounds[ri].gap:7;
  const offset=(E[worldI]??Lx)-Lx;
  const topY=60, maxY=groundY-hs-T-8;
  R.current.geo={U,T,Lx,groundY,W,H,topY,maxY,C,hw};

  const tts=()=>soundOn&&speechOn&&hasTTS&&heVoice;
  const newFlow=()=>{const f=++flow.current;return()=>f===flow.current};
  const later=(alive,ms,fn)=>setTimeout(()=>{if(alive())fn()},ms);
  function say(text,{voice=true}={}){
    return new Promise(res=>{
      if(finRef.current)finRef.current();
      setCaption(text);setCapN(n=>n+1);lastSay.current=text;setTalking(true);
      let done=false,timer;
      const fin=()=>{if(done)return;done=true;clearTimeout(timer);if(finRef.current===fin){finRef.current=null;setTalking(false)}res()};
      finRef.current=fin;
      const sp=toSpeech(text);
      if(voice&&tts()){
        try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(sp);u.voice=heVoice;u.lang=heVoice.lang;u.rate=.95;
          u.onend=fin;u.onerror=fin;timer=setTimeout(fin,sp.length*130+3000);speechSynthesis.speak(u)}catch(e){timer=setTimeout(fin,1500)}
      }else timer=setTimeout(fin,voice?Math.max(1300,sp.length*62):700);
    });
  }
  const quiet=t=>say(t,{voice:R.current.ri===0});   // after the first obstacle: text in the bubble only
  const hush=()=>{if(hasTTS)try{speechSynthesis.cancel()}catch(e){};if(finRef.current)finRef.current()};
  const clearNudges=()=>{nudges.current.forEach(clearTimeout);nudges.current=[]};
  function armNudges(alive){
    clearNudges();
    if(teach.current==='join'||teach.current==='drag')return;   // the hand teaches first
    nudges.current=[
      later(alive,16000,()=>say('רמז: אפשר לחבר שני קרשים, ואפשר לחתוך קרש בכל מקום.')),
      later(alive,32000,()=>{const r=R.current.round;setHl(R.current.planks.filter(p=>p.key).map(p=>p.id));say(`נסו את שני הקרשים שקופצים. ביחד הם יוצרים ${r.gap}?`)}),
    ];
  }
  const bump=(id,kind)=>{setFx({[id]:kind});setFxN(n=>n+1)};

  /* ---------- the teaching hand: join two planks → drag the plank of the right size to the pit → later, cut ---------- */
  function armTeach(ms){
    clearTimeout(teachTimer.current);
    if(teach.current==='done')return;
    teachTimer.current=setTimeout(showTeach,ms);
  }
  function showTeach(){
    const {planks,phase}=R.current, {U,T}=R.current.geo;
    if(phase!=='build'||teach.current==='done')return;
    const g=R.current.round.gap, fit=planks.find(x=>total(x)===g);
    if(fit&&(teach.current==='drag'||teach.current==='join')){
      teach.current='drag';
      const {Lx,groundY}=R.current.geo;
      setDemo({kind:'join',p:fit,w:g*U,a:{x:fit.x+g*U/2,y:fit.y+T/2},b:{x:Lx+g*U/2,y:groundY+T/2}});
      say('הקרש בדיוק באורך הנכון! גוררים אותו אל הבור, והוא יהיה גשר.',{voice:R.current.ri===0});
    }else if(teach.current==='drag'){
      return;
    }else if(teach.current==='cut'){
      const p=[...planks].filter(x=>total(x)>=2).sort((a,b)=>total(b)-total(a))[0]; if(!p)return;
      const k=Math.max(1,Math.floor(total(p)/2));
      setDemo({kind:'cut',x:p.x+k*U,y0:p.y-50,y1:p.y+T+40});
      say('אפשר גם לחתוך קרש: מתחילים קצת מעליו, ומעבירים אצבע מהר למטה דרך הקרש, כמו סכין.',{voice:R.current.ri<=1});
    }else{
      const ps=[...planks].sort((a,b)=>a.x-b.x); if(ps.length<2)return;
      const r=R.current.round, keys=ps.filter(x=>x.key);
      const [a,b]=keys.length===2?keys:[ps[0],ps[1]];
      setDemo({kind:'join',p:a,w:total(a)*U,a:{x:a.x+total(a)*U/2,y:a.y+T/2},b:{x:b.x+total(b)*U/2,y:b.y+T/2}});
      say('גוררים קרש ומשחררים אותו על הקרש השני, והם מתחברים.',{voice:R.current.ri===0});
    }
  }
  function touchedBoard(){ if(demo)setDemo(null); armTeach(6000) }

  /* lay the planks out in rows, centred, in the free sky area */
  function layout(list){
    const {U,T,W,topY,maxY}=R.current.geo, gapX=22, rowH=T+44, maxW=W-24;
    const rows=[[]];let w=0;
    list.forEach(p=>{const pw=total(p)*U;if(rows[rows.length-1].length&&w+gapX+pw>maxW){rows.push([]);w=0}w+=(w?gapX:0)+pw;rows[rows.length-1].push(p)});
    const totalH=(rows.length-1)*rowH+T, y0=Math.max(topY+20,topY+20+(maxY-topY-20-totalH)/2);
    const out=[];
    rows.forEach((row,r)=>{const rw=row.reduce((s,p,i)=>s+total(p)*U+(i?gapX:0),0);let x=(W-rw)/2;
      row.forEach(p=>{out.push({...p,fall:true,x:Math.round(x),y:Math.round(y0+r*rowH),z:++zTop.current});x+=total(p)*U+gapX})});
    return out;
  }
  const clampPos=(x,y,w)=>{const {W,topY,maxY}=R.current.geo;return{x:Math.max(4,Math.min(W-w-4,x)),y:Math.max(topY,Math.min(Math.max(topY,maxY),y))}};

  async function start(){
    audio();
    lastGap=null;const types=['water',...shuffle(['fire','thorns','swamp','monster'])];
    const rs=Array.from({length:ROUNDS},(_,i)=>({...genRound(i),type:types[i]}));
    stats.current=[];setRounds(rs);R.current.rounds=rs;setBuilt([]);setWorldI(0);setWalkDur(0);setCoinTaken(-1);setProgress(0);
    teach.current='join';setScreen('play');
    await sleep(250);
    playRound(0,true);
  }

  async function playRound(i,first){
    const alive=newFlow(), r=R.current.rounds[i];
    clearNudges();setDemo(null);
    const laid=layout(r.planks);
    setRi(i);R.current.ri=i;R.current.round=r;setPlanks(laid);R.current.planks=laid;setFallN(n=>n+1);setBridge(null);setHl([]);setFx({});
    setPhase('busy');R.current.phase='busy';
    stats.current[i]={gap:r.gap,wrong:0,merges:0,cuts:0};
    log('round_start',{gap:r.gap,planks:r.planks.map(total)});
    if(first){await sleep(800); if(!alive())return; setHero({walk:false,vis:true,cheer:false});sfx.thud()}
    await sleep(700); if(!alive())return;
    setMeasurePop(n=>n+1);
    setPhase('build');R.current.phase='build';
    if(first){
      await say(`החבר שלנו רוצה להגיע למטבע, אבל יש ${OBST[r.type].name} בדרך. הבור ברוחב ${r.gap}. בואו נבנה לו גשר!`); if(!alive())return;
    }else{
      say(i===ROUNDS-1?`${OBST[r.type].name}, המכשול האחרון! רוחב ${r.gap}.`:`${OBST[r.type].name}, רוחב ${r.gap}.`,{voice:false});
    }
    armTeach(first?2500:teach.current==='cut'?9000:5000);
    armNudges(alive);
  }

  function resetPlanks(){
    const r=R.current.round; if(!r)return;
    const laid=layout(r.planks);
    setPlanks(laid);R.current.planks=laid;setFallN(n=>n+1);setFx({});sfx.thud();
  }

  /* ---------- pointer: drag a plank, or swipe on the board to cut ---------- */
  const boardXY=e=>{const b=boardRef.current.getBoundingClientRect();return{x:e.clientX-b.left,y:e.clientY-b.top}};
  function overRiver(px,py,w,pointerY){
    const {groundY,Lx,U,T}=R.current.geo, g=R.current.round.gap;
    return (pointerY>groundY-70||py+T>groundY-30)&&px+w>Lx-10&&px<Lx+g*U+10;
  }
  function plankDown(e,p){
    if(R.current.phase!=='build')return;
    e.stopPropagation();e.preventDefault();audio();touchedBoard();
    const q=boardXY(e);
    dragRef.current={id:p.id,dx:q.x-p.x,dy:q.y-p.y,start:{x:p.x,y:p.y},moved:false};
    try{e.currentTarget.setPointerCapture(e.pointerId)}catch(_){}
    const z=++zTop.current;
    setPlanks(ps=>ps.map(x=>x.id===p.id?{...x,z}:x));setDrag(p.id);sfx.pick();setHl([]);
  }
  function plankMove(e){
    const d=dragRef.current;if(!d)return;
    e.stopPropagation();
    const q=boardXY(e), px=q.x-d.dx, py=q.y-d.dy;
    d.moved=true;
    const ps=R.current.planks.map(x=>x.id===d.id?{...x,x:px,y:py}:x);
    R.current.planks=ps;setPlanks(ps);
    const p=ps.find(x=>x.id===d.id); if(p)setHot(overRiver(px,py,total(p)*R.current.geo.U,q.y));
  }
  function plankUp(e){
    const d=dragRef.current;if(!d)return;dragRef.current=null;e.stopPropagation();setDrag(null);setHot(false);
    const {planks}=R.current, p=planks.find(x=>x.id===d.id); if(!p)return;
    const q=boardXY(e), {U,T}=R.current.geo, w=total(p)*U;
    if(!d.moved){sfx.drop();return}
    if(overRiver(p.x,p.y,w,q.y)){tryBridge(p,d.start);return}
    let t=null,best=0;
    for(const o of planks){if(o.id===p.id)continue;const ow=total(o)*U;
      const ox=Math.min(p.x+w,o.x+ow)-Math.max(p.x,o.x), oy=Math.min(p.y+T,o.y+T)-Math.max(p.y,o.y);
      const inside=q.x>o.x-8&&q.x<o.x+ow+8&&q.y>o.y-10&&q.y<o.y+T+10;
      const score=(ox>=U*.35&&oy>=T*.2)?ox*oy:inside?1:0;
      if(score>best){best=score;t=o}}
    if(t){mergeInto(p,t);return}
    const c=clampPos(p.x,p.y,w), ps=planks.map(x=>x.id===p.id?{...x,...c}:x);
    R.current.planks=ps;setPlanks(ps);sfx.drop();
  }

  function boardDown(e){
    if(R.current.phase!=='build'||screen!=='play')return;
    touchedBoard();
    const q=boardXY(e);strokeRef.current={pts:[q]};
    try{e.currentTarget.setPointerCapture(e.pointerId)}catch(_){}
    setTrail({pts:[q],fade:false});
  }
  function boardMove(e){
    const s=strokeRef.current;if(!s)return;
    const q=boardXY(e);s.pts.push(q);if(s.pts.length>40)s.pts.shift();
    setTrail({pts:[...s.pts],fade:false});
  }
  function boardUp(){
    const s=strokeRef.current;if(!s)return;strokeRef.current=null;
    setTrail(t=>t&&{...t,fade:true});setTimeout(()=>setTrail(null),380);
    const {planks}=R.current, {U,T}=R.current.geo, s0=s.pts[0], AWAY=22;
    const near=planks.some(o=>{const ow=total(o)*U;const dx=Math.max(o.x-s0.x,0,s0.x-(o.x+ow)),dy=Math.max(o.y-s0.y,0,s0.y-(o.y+T));return Math.hypot(dx,dy)<AWAY});
    if(near)return;
    // a cut = the stroke goes from above a plank to below it (or back), across the plank
    for(const p of [...planks].sort((a,b)=>b.z-a.z)){
      const w=total(p)*U, top=p.y, bot=p.y+T, mid=p.y+T/2;
      if(!s.pts.some(o=>o.y<top+2)||!s.pts.some(o=>o.y>bot-2))continue;
      let cx=null;
      for(let i=1;i<s.pts.length;i++){const a=s.pts[i-1],b=s.pts[i];if((a.y-mid)*(b.y-mid)<=0&&a.y!==b.y){cx=a.x+(b.x-a.x)*(mid-a.y)/(b.y-a.y);break}}
      if(cx==null||cx<p.x-6||cx>p.x+w+6)continue;
      cutPlank(p,cx-p.x);return;
    }
  }

  /* cut anywhere: at the unit line nearest to the stroke (a colour segment can be cut too) */
  function cutPlank(p,atX){
    const alive=newFlow(), {U}=R.current.geo, orig=R.current.round.planks, n=total(p);
    if(n<2){bump(p.id,'nope');sfx.nope();say('אי אפשר לחתוך את 1. הוא הכי קטן.');armNudges(alive);return}
    clearNudges();hush();
    const k=Math.max(1,Math.min(n-1,Math.round(atX/U)));
    const Ls=[],Rs=[];let acc=0;
    p.segs.forEach(s=>{
      if(acc+s.n<=k)Ls.push(s);else if(acc>=k)Rs.push(s);else{Ls.push({...s,n:k-acc});Rs.push({...s,n:acc+s.n-k})}
      acc+=s.n});
    const part=segs=>{const o=segs.length===1&&orig.find(x=>x.segs[0].c===segs[0].c&&x.segs[0].n===segs[0].n);
      return {id:'c'+(++idN.current),segs,key:!!(o&&o.key)}};
    const L=part(Ls), Rt=part(Rs);
    const lw=total(L)*U, cl=clampPos(p.x-12,p.y,lw), cr=clampPos(p.x+lw+12,p.y,total(Rt)*U);
    const next=R.current.planks.flatMap(x=>x.id!==p.id?[x]:[{...L,...cl,z:++zTop.current},{...Rt,...cr,z:++zTop.current}]);
    R.current.planks=next;setPlanks(next);setFx({[L.id]:'split',[Rt.id]:'split'});setFxN(x=>x+1);sfx.chop();
    stats.current[R.current.ri].cuts++;
    log('cut',{from:n,into:[total(L),total(Rt)]});
    if(teach.current==='cut')teach.current='done';
    quiet(`⁦${n}⁩ זה ⁦${total(L)}+${total(Rt)}⁩`).then(()=>{if(alive())armNudges(alive)});
  }

  function mergeInto(p,t){
    const alive=newFlow(); const {planks,round}=R.current, {U}=R.current.geo;
    clearNudges();hush();
    const first=p.x+total(p)*U/2<t.x+total(t)*U/2;           // the plank on the left comes first
    const segs=first?[...p.segs,...t.segs]:[...t.segs,...p.segs];
    const a=total(first?p:t), b=total(first?t:p), w=(a+b)*U;
    const m={id:'m'+(++idN.current),segs,key:false,...clampPos(first?t.x-total(p)*U:t.x,t.y,w),z:++zTop.current};
    const next=planks.filter(x=>x.id!==p.id&&x.id!==t.id).concat(m);
    R.current.planks=next;setPlanks(next);bump(m.id,'merged');setHl([]);sfx.merge();
    stats.current[R.current.ri].merges++;
    log('merge',{a,b,sum:a+b});
    if(teach.current==='join')teach.current='drag';
    if(teach.current==='drag'&&a+b===round.gap)armTeach(1600);
    (async()=>{
      await quiet(`⁦${a}+${b}⁩ זה ${a+b}!`); if(!alive())return;   // LTR isolate, so "1+4" is not shown as "4+1"
      if(alive())armNudges(alive);
    })();
  }

  async function tryBridge(p,home){
    const alive=newFlow(); clearNudges();hush();clearTimeout(teachTimer.current);setDemo(null);
    const {round,ri}=R.current, n=total(p), g=round.gap, geo=R.current.geo;
    const state=n===g?'fit':n<g?'short':'long';
    setPhase('busy');R.current.phase='busy';setBridge({p,state});setHl([]);
    const rest=R.current.planks.filter(x=>x.id!==p.id);R.current.planks=rest;setPlanks(rest);
    KP.answer(state==='fit');log('bridge_attempt',{gap:g,plank:n,correct:state==='fit'});
    await sleep(160); if(!alive())return;
    if(state==='fit'){
      sfx.thud();sfx.win();
      if(teach.current==='drag')teach.current='cut';
      say(`${n}! הגשר מוכן!`,{voice:false});
      await sleep(380); if(!alive())return;
      // walk: the hero walks on the spot, the world slides left to the next pit
      const dist=g*geo.U+geo.C, dur=Math.max(2.4,Math.min(4,dist/240)), speed=dist/dur;
      setWalkDur(dur);setWorldI(ri+1);setHero({walk:true,vis:true,cheer:false});R.current.planks=[];setPlanks([]);
      const steps=Math.floor(dur/.135);for(let k=0;k<steps;k++)later(alive,k*135,()=>sfx.step(k));
      // the coin reaches the hero when the bridge has passed under him
      later(alive,((g*geo.U+22)/speed)*1000,async()=>{
        sfx.coin();setCoinTaken(ri);
        await flyCoin(coinRef.current,chestRef.current);
        setProgress(ri+1);setBumpN(b=>b+1);tone(988,.25,'sine');setTimeout(()=>tone(1319,.3,'sine'),120);
      });
      await sleep(dur*1000+60); if(!alive())return;
      setBuilt(b=>[...b,{i:ri,p}]);setBridge(null);setWalkDur(0);
      setHero({walk:false,vis:true,cheer:true});
      log('round_done',stats.current[ri]);
      await sleep(700); if(!alive())return;
      setHero({walk:false,vis:true,cheer:false});
      if(ri+1<ROUNDS){
        playRound(ri+1);return;
      }
      log('session_done',stats.current);
      setLidOpen(false);setTaps(0);setScreen('end');
      [523,659,784,1047,1319].forEach((f,j)=>setTimeout(()=>tone(f,.25),j*120));
      await sleep(500); if(!alive())return;
      await say('כל הכבוד! עברנו את כל המכשולים והגענו לתיבת האוצר! לחצו עליה ותראו מה יש בפנים.');
      return;
    }
    // wrong: too short falls into the water, too long does not fit; then it comes back where it was
    round.wrong++;stats.current[ri].wrong++;
    if(state==='short'){
      const b=boardRef.current.getBoundingClientRect(), o=OBST[round.type];
      setTimeout(()=>{sfx[o.sound]();burst(b.left+geo.Lx+n*geo.U,b.top+geo.groundY+40,o.fx,20,.8)},450);
    }else{ sfx.thud();setTimeout(sfx.nope,350) }
    await sleep(1250); if(!alive())return;
    setBridge(null);
    const back=[...R.current.planks,{...p,...home,fall:false,z:++zTop.current}];R.current.planks=back;setPlanks(back);setFx({[p.id]:'merged'});setFxN(x=>x+1);
    const msg=state==='short'?`${n} קצר מדי. הבור ברוחב ${g}, חסר עוד ${g-n}.`:`${n} ארוך מדי. הבור ברוחב ${g}.`;
    setPhase('build');R.current.phase='build';
    if(round.wrong>=2){
      const laid=layout(round.planks);R.current.planks=laid;setPlanks(laid);setFallN(x=>x+1);
      setHl(round.planks.filter(x=>x.key).map(x=>x.id));
      await say(msg+' רמז: שני הקרשים שקופצים יוצרים ביחד '+g+'.');
    }else{
      await say(msg+' ננסה שוב!');
    }
    if(alive()){armNudges(alive);armTeach(6000)}
  }

  function tapChest(){
    audio();hush();
    const first=taps===0;setTaps(t=>t+1);log('chest_tap',taps+1);
    setLidOpen(false);setTimeout(()=>setLidOpen(true),70);
    setTimeout(()=>{sfx.jackpot();coinBurst(bigChestRef.current,first?34:22)},200);
  }
  async function goNext(){
    if(leaving)return;setLeaving(true);hush();
    await KP.complete({rounds:ROUNDS,firstTry:stats.current.filter(s=>s&&!s.wrong).length});
    KP.next();
  }
  const [speech,setSpeech]=useState(true);
  function toggleSpeech(){const v=!speech;setSpeech(v);speechOn=v;if(!v&&hasTTS)try{speechSynthesis.cancel()}catch(e){}}
  function toggleSound(){const v=!sound;setSound(v);soundOn=v;if(!v&&hasTTS)try{speechSynthesis.cancel()}catch(e){}}
  useEffect(()=>()=>{clearNudges();hush();clearTimeout(teachTimer.current)},[]);

  /* ---------- render ---------- */
  const Header=(
    <header>
      <div className="title"><BridgeIcon s={26}/><span>בונים גשר</span></div>
      <div className="treasure" style={screen==='end'?{visibility:'hidden'}:null}>
        <div className="pbar"><div className="pfill" style={{width:(progress/ROUNDS*100)+'%'}}/></div>
        <Chest key={'c'+bumpN} innerRef={chestRef} count={progress} bump={bumpN>0}/>
      </div>
      <div className="tools">
        {screen!=='end'&&<button className="iconbtn" title="חזרה על ההוראה" aria-label="חזרה על ההוראה" onClick={()=>say(lastSay.current)} disabled={screen!=='play'||!lastSay.current}>↻</button>}
        <button className="iconbtn" title="קול" aria-label="קול" onClick={toggleSound}>{sound?'🔊':'🔇'}</button>
        {KP.inCourse&&<button className="iconbtn" title="חזרה לקורס" aria-label="חזרה לקורס" onClick={()=>{hush();KP.exit()}}>✕</button>}
      </div>
    </header>);

  const Talk=(
    <div className="talk">
      <div className="spawn"><Player s={68} talking={!!talking}/>
        <button className="speechbtn" title={speech?'להשתיק את הדיבור':'להפעיל את הדיבור'} aria-label={speech?'להשתיק את הדיבור':'להפעיל את הדיבור'} onClick={toggleSpeech}><SpeechIcon on={speech}/></button></div>
      <div className="bubble" aria-live="polite"><div className="txt" key={capN}>{caption||'…'}</div></div>
    </div>);

  const riverTop=groundY+Math.round(T*.6);
  const worldW=(S[ROUNDS-1]??W)+W*3;
  const cliffs=rounds.length?[{x0:-W*2,x1:E[0],l:false,r:true},...rounds.map((r,i)=>({x0:S[i],x1:i<ROUNDS-1?E[i+1]:S[i]+C+W*3,l:true,r:i<ROUNDS-1}))]:[];
  const cs=Math.round(Math.max(110,Math.min(190,W*.42,groundY*.45)));
  // small things on each stretch of land (never where the hero stands or the coin is)
  const decor=[];
  cliffs.forEach((c,k)=>{const rr=rng(k*13+5), th=THEME[k%THEME.length];
    const a=k===0?c.x1-W:c.x0+70, b=(k<ROUNDS?c.x1:E[ROUNDS])-hw-40, n=Math.max(1,Math.min(5,Math.floor((b-a)/80)));
    for(let j=0;j<n;j++){const kind=th[Math.floor(rr()*th.length)], h=Math.round(hs*DSIZE[kind]*(.8+rr()*.4));
      decor.push({key:k+'-'+j,kind,h,x:Math.round(a+(b-a)*(j+.2+rr()*.6)/n)})}
    if(k===ROUNDS){for(let j=0;j<3;j++){const kind=th[j%th.length],h=Math.round(hs*DSIZE[kind]);decor.push({key:'end'+j,kind,h,x:E[ROUNDS]+cs+16+j*60})}}});
  // far away things on the horizon: they slide slower (depth) and change along the way
  const far=[];{const rr=rng(77);let x=-W;const end=(E[ROUNDS]??W)*.5+W*2;while(x<end){const k=Math.min(THEME.length-1,Math.max(0,Math.floor((x*2)/(C+5*U)))),th=THEME[k];
    const kind=th[Math.floor(rr()*th.length)];far.push({key:far.length,kind,h:Math.round(hs*DSIZE[kind]*.6),x:Math.round(x)});x+=70+rr()*140}}
  const touched=rounds[ri]&&(planks.length!==rounds[ri].planks.length||planks.some(p=>p.segs.length>1));
  const showMeasure=screen==='play'&&rounds[ri]&&!(bridge&&bridge.state==='fit')&&walkDur===0&&!built.some(b=>b.i===ri);
  const Board=(
    <div className="board" ref={boardRef} onPointerDown={boardDown} onPointerMove={boardMove} onPointerUp={boardUp} onPointerCancel={boardUp}
      style={screen==='start'?{visibility:'hidden'}:null}>
      <div className="far" style={{left:0,top:0,width:1,height:H,transform:`translateX(${-offset*.5}px)`,transition:walkDur?`transform ${walkDur}s linear`:'none'}}>
        {far.map(d=><div key={d.key} style={{position:'absolute',left:d.x,top:groundY-d.h+6,opacity:.8}}><Decor kind={d.kind} h={d.h}/></div>)}
      </div>
      {/* the world: river, land, bridges, coins. It slides left while the hero walks on the spot */}
      <div className="world" style={{left:0,top:0,width:worldW,height:H,transform:`translateX(${-offset}px)`,transition:walkDur?`transform ${walkDur}s linear`:'none'}}>
        {rounds.map((r,i)=><div key={'pit'+i} style={{left:E[i]-14,top:riverTop,width:r.gap*U+28,height:H-riverTop}}><Pit type={r.type} w={r.gap*U+28} h={Math.max(10,H-riverTop)} seed={i+1}/></div>)}
        {cliffs.map((c,k)=><div key={k} style={{left:c.x0,top:groundY,width:c.x1-c.x0,height:groundH}}><Cliff w={c.x1-c.x0} h={groundH} seed={k+1} edgeL={c.l} edgeR={c.r} pal={PALS[k%PALS.length]}/></div>)}
        {decor.map(d=><div key={d.key} style={{left:d.x,top:groundY-d.h+5}}><Decor kind={d.kind} h={d.h}/></div>)}
        {rounds.length>0&&<button ref={bigChestRef} className={'wchest'+(screen==='end'&&taps===0?' idle':'')} aria-label="לפתוח את תיבת האוצר"
          style={{left:E[ROUNDS]+2,top:groundY-Math.round(cs*.8)+6,width:cs}} onPointerDown={e=>e.stopPropagation()} onClick={()=>{if(screen==='end')tapChest()}}>
          <Chest key={'big'+taps} count={ROUNDS} open={lidOpen} bump={taps>0} s={cs}/></button>}
        {built.map(b=><div key={b.i} style={{left:E[b.i],top:groundY+4,zIndex:2}}><Plank p={b.p} U={U} T={T} showSum={false}/></div>)}
        {bridge&&<div style={{left:E[ri],top:bridge.state==='long'?groundY-T+4:groundY+4,zIndex:2}}>
          <div className={'bridge '+bridge.state}><Plank p={bridge.p} U={U} T={T} showSum={false}/></div></div>}
        {rounds.map((r,i)=>i>=ri&&coinTaken<i&&<div key={'coin'+i} className="coin2" ref={i===ri?coinRef:null}
          style={{left:S[i]+Math.min(26,C/2-17),top:groundY-Math.round(hs*.5)-10}}><Coin s={Math.round(hs*.5)}/></div>)}
        {showMeasure&&<div className={'measure'+(hot?' hot':'')} style={{left:E[ri],top:groundY+3-18,width:gap*U,height:36}}>
          <span key={measurePop} className="mnum pop">{gap}</span></div>}
      </div>
      <div className="hero" style={{left:heroX,top:groundY-hs+2,width:hw,height:hs,opacity:hero.vis?1:0}}>
        <div className={'in'+(hero.vis?' show':'')} key={hero.vis?'v':'h'}>
          <Player s={hs} view="side" shadow={false} happy walking={hero.walk} cheer={hero.cheer}/></div></div>
      {screen==='play'&&<button className="reset" title="לסדר מחדש" aria-label="לסדר מחדש" disabled={phase!=='build'||!touched}
        onPointerDown={e=>e.stopPropagation()} onClick={()=>{hush();resetPlanks()}}>↺</button>}
      {planks.map((p,k)=>{const c=drag===p.id?{x:p.x,y:p.y}:clampPos(p.x,p.y,total(p)*U);return(
        <div key={p.id} className={'pk'+(drag===p.id?' dragging':'')} style={{left:c.x,top:c.y,zIndex:drag===p.id?40:5+(p.z%30)}}
          onPointerDown={e=>plankDown(e,p)} onPointerMove={plankMove} onPointerUp={plankUp} onPointerCancel={plankUp}>
          <div key={'f'+fallN} className={p.fall?'fall':''} style={{animationDelay:k*.12+'s'}}>
            <Plank key={fx[p.id]?fx[p.id]+fxN:'p'} p={p} U={U} T={T} cls={(hl.includes(p.id)?'hl ':'')+(fx[p.id]||'')}/>
          </div>
        </div>)})}
      {screen==='end'&&<div className="endpanel" onPointerDown={e=>e.stopPropagation()}>
        <div className="h1 fall">כל הכבוד!</div>
        <div className="note fall" style={{animationDelay:'.2s'}}>{taps===0?'לחצו על תיבת האוצר':'אפשר ללחוץ שוב!'}</div>
        <div className="fall" style={{animationDelay:'.5s'}}><button className="cta" onClick={goNext} disabled={leaving}>המשך</button></div>
      </div>}
      {demo&&<HandDemo key={JSON.stringify(demo)} demo={demo} U={U} T={T}/>}
      {trail&&trail.pts.length>1&&<svg className={'trail'+(trail.fade?' fade':'')} width={W} height={H}>
        <polyline points={trail.pts.map(o=>o.x+','+o.y).join(' ')} strokeWidth="6"/></svg>}
    </div>);

  let overlay=null;
  if(screen==='start'){
    overlay=(<div className="center" key="start">
      <div className="fall"><Player s={130}/></div>
      <div className="h1 fall" style={{animationDelay:'.2s'}}>בונים גשר</div>
      <div className="note fall" style={{animationDelay:'.35s'}}>מחברים וחותכים קרשים עד שהם בדיוק ברוחב הבור, ועוזרים לחבר שלנו להגיע למטבעות.</div>
      <div className="fall" style={{animationDelay:'.5s'}}><button className="cta" onClick={start}>מתחילים</button></div>
      {hasTTS&&!heVoice&&<div className="note">לא נמצא קול בעברית בדפדפן הזה, אז הקריינות תופיע ככתוביות.</div>}
    </div>);
  }

  return(<>
    <LowPolyBG/>
    <div className="app">
      <div className="top">{Header}{screen!=='start'&&Talk}</div>
      {Board}
      {overlay}
    </div></>);
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
