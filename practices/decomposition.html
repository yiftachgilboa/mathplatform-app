<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kidodo · פירוק מספרים</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.23.5/babel.min.js"></script>
<script src="/practices/kidodo-practice.js"></script>
<style>
:root{--ink:#1E2549;--blue:#3D6FE0;--coral:#FF6450;--yellow:#FFC531;--teal:#1FB5A2;--purple:#8E5CF0;--soft:#F1E3C6;--panel:#FFF7E6;--white:#fff}
*{box-sizing:border-box;margin:0}
html,body{overflow:hidden;height:100%}
body{font-family:Rubik,system-ui,sans-serif;color:var(--ink);background:#BFE4A0}
button{font-family:inherit;cursor:pointer;border:0}
.bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
.app{position:relative;z-index:1;max-width:960px;margin:0 auto;padding:10px 14px 12px;display:flex;flex-direction:column;gap:10px;height:100vh;height:100dvh}

/* header */
header{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:6px}
.title{justify-self:start;min-width:0;max-width:100%;font-weight:800;font-size:16px;display:flex;align-items:center;gap:6px;color:#2E6B3E;background:rgba(255,255,255,.85);padding:6px 14px 6px 12px;clip-path:polygon(0 0,100% 0,calc(100% - 12px) 100%,0 100%)}
.title svg{flex:none}
.title span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;gap:6px;justify-content:flex-end}
@media(max-width:419px){.title span{display:none}.title{padding:6px 16px 6px 8px}}
@media(min-width:700px){header{gap:10px}.title{font-size:19px;gap:8px;padding:6px 14px 6px 16px}.tools{gap:8px}}
.iconbtn{width:44px;height:44px;border-radius:50%;font-size:19px;color:#2E6B3E;background:#F7F2DF;box-shadow:0 4px 0 rgba(60,130,60,.25)}
.iconbtn:disabled{opacity:.45}
.treasure{display:flex;align-items:center;gap:8px;background:none;padding:4px 0}
.treasure .chest{width:48px;height:38px}
.pbar{width:64px;height:16px;border-radius:8px;background:rgba(46,107,62,.18);overflow:hidden}
@media(min-width:700px){.treasure{gap:10px;padding:4px 14px}.treasure .chest{width:62px;height:50px}.pbar{width:130px;height:18px;border-radius:9px}}
.pfill{height:100%;border-radius:9px;background:linear-gradient(180deg,#FFD95A 0 50%,#FFC531 50%);transition:width .8s cubic-bezier(.3,1.4,.5,1)}
.gemslot{width:18px;height:18px;transform:rotate(45deg);background:rgba(60,120,60,.18);transition:background .4s}
.gemslot.on{animation:gemIn .5s;background-image:linear-gradient(135deg,rgba(255,255,255,.45) 0 50%,transparent 50%)}
@keyframes gemIn{40%{transform:rotate(45deg) scale(1.7)}}
.chest.bump{animation:bump .5s}
@keyframes bump{30%{transform:scale(1.25,.85)}60%{transform:scale(.9,1.15)}}
.lid{transition:transform .5s cubic-bezier(.3,1.6,.5,1);transform-origin:10px 30px;transform-box:view-box}
.chest.open .lid{transform:rotate(-35deg) translate(-6px,-10px)}

/* stage = game board */
.stage{position:relative;flex:1;min-height:220px;max-height:400px}
.scene,.center{z-index:1}
.scene{position:absolute;inset:0}
.bgroup{position:absolute;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;transition:left .8s cubic-bezier(.5,0,.3,1),top .8s cubic-bezier(.5,0,.3,1)}
.bgroup.side{left:64px}
.bgroup.side .cols{gap:20px}
/* guess tag sits above the slot in the tower scene, so it never leaves the screen */
.bgroup.side .chip{right:auto;left:50%;top:auto;bottom:calc(100% + 22px);margin:0;transform:translateX(-50%)}
@media(min-width:700px){.bgroup.side{left:26%}.bgroup.side .cols{gap:30px}}
.bgroup.side .block{font-size:20px}
.bgroup.side .chip{font-size:13px;padding:3px 10px}
.bgroup.side .q{font-size:22px}
.block{transition:height .8s cubic-bezier(.5,0,.3,1),width .8s cubic-bezier(.5,0,.3,1)}
.slot{transition:height .8s cubic-bezier(.5,0,.3,1),width .8s cubic-bezier(.5,0,.3,1)}
.cols{transition:gap .8s}
.tgroup{position:absolute;right:50px;bottom:28px}
@media(min-width:700px){.tgroup{right:auto;left:62%;transform:translateX(-50%)}}

/* entrance animations */
.fall{animation:fall .9s cubic-bezier(.3,.9,.4,1) both}
@keyframes fall{0%{transform:translateY(-480px)}45%{transform:translateY(0) scale(1.08,.88)}60%{transform:translateY(-34px) scale(.96,1.05)}75%{transform:translateY(0) scale(1.03,.96)}86%{transform:translateY(-9px)}100%{transform:translateY(0)}}
.hp{position:relative;animation:hpIn 1.15s cubic-bezier(.25,.8,.35,1) both}
@keyframes hpIn{0%{transform:translateY(-560px)}55%{transform:translateY(0)}64%{transform:translateY(5px) scale(1.04,.95)}74%,100%{transform:translateY(0)}}
.hand{position:absolute;left:50%;bottom:calc(100% - 20px);width:64px;margin-left:-32px;pointer-events:none;animation:handOut 1.15s both;z-index:5}
@keyframes handOut{0%,58%{transform:translateY(0) rotate(0);opacity:1}68%{transform:translateY(-6px) rotate(-6deg)}100%{transform:translateY(-560px) rotate(-10deg);opacity:1}}

/* flat 3D boxes */
.cols{display:flex;align-items:flex-end;gap:46px;transition:gap .8s}
.col{display:flex;flex-direction:column;transition:gap .5s}
.block{--D:14px;position:relative;height:58px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:32px;color:#fff;background:var(--m);transition:height .5s}
.bt,.bs,.bsh{position:absolute;pointer-events:none}
.bt{top:calc(-1 * var(--D));left:0;right:calc(-1 * var(--D));height:var(--D);background:var(--l);clip-path:polygon(var(--D) 0,100% 0,calc(100% - var(--D)) 100%,0 100%)}
.bs{right:calc(-1 * var(--D));width:var(--D);top:calc(-1 * var(--D));bottom:0;background:var(--d);clip-path:polygon(0 var(--D),100% 0,100% calc(100% - var(--D)),0 100%)}
.bsh{left:-30px;right:0;bottom:-11px;height:11px;background:rgba(60,130,60,.28);clip-path:polygon(16px 0,100% 0,calc(100% - 14px) 100%,0 100%);z-index:-1}
.bn{position:relative;z-index:1;text-shadow:0 2px 0 rgba(0,0,0,.15)}
.block.big{--l:#FF9887;--m:#FF6450;--d:#C9402F}
.block.part{--l:#8AABFF;--m:#3D6FE0;--d:#2546A8}
.block.ans{--l:#FFE48A;--m:#FFC531;--d:#CC9300;color:var(--ink);width:100%;height:100%}
.block.ans .bn{text-shadow:none}
.slot .block .bsh{display:none}
.merged .block.part .bt{display:none}
.hl{animation:hl .9s ease-in-out 2}
@keyframes hl{50%{transform:scale(1.1);filter:brightness(1.15)}}
.drag{touch-action:none;cursor:grab;position:relative}
.drag.dragging{cursor:grabbing;z-index:20}
.drag.dragging .block{filter:brightness(1.08)}
.slot .hp,.slot .drag{width:100%;height:100%}
.slot svg.box{position:absolute;left:0;top:-14px;overflow:visible}
.slot{position:relative;display:flex;align-items:center;justify-content:center}
.slot.filled{background:transparent}
.slot .hp{width:100%}
.q{position:relative;font-size:34px;font-weight:800;color:#2E6B3E;animation:qpulse 1.2s infinite}
@keyframes qpulse{50%{transform:scale(1.25);color:var(--coral)}}
.chip{position:absolute;right:calc(100% + 12px);top:50%;margin-top:-16px;white-space:nowrap;color:#fff;padding:5px 16px;font-weight:700;font-size:16px;background:linear-gradient(180deg,#A47BFF 0 50%,#8E5CF0 50%);clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 50%,calc(100% - 10px) 100%,10px 100%,0 50%)}
.merged .col{gap:0!important}
.merged .cols{animation:flash .9s}
@keyframes flash{30%{transform:scale(1.06)}}
.eq{font-size:34px;font-weight:800;margin-top:30px;background:rgba(255,255,255,.8);padding:4px 22px;border-radius:30px;letter-spacing:2px;display:flex;gap:12px;align-items:center}
.eq .t{color:var(--coral)}.eq .p{color:var(--blue)}.eq .a{color:#D99A00}

/* tower = low-poly building */
.tower{position:relative;width:150px}
.shaft{position:absolute;left:4px;width:40px;background:#CFE0FF}
.doors{position:absolute;left:4px;width:40px;z-index:3;display:flex;justify-content:space-between;pointer-events:none}
.doors i{width:50%;background:rgba(170,205,255,.5);border:2px solid #2D57C2;transition:width .4s}
.doors.open i{width:3px;border-width:0;background:#2D57C2}
.floor{position:absolute;right:0;left:0;display:flex;align-items:center;transition:background .25s;background:linear-gradient(90deg,#FFD08E 0 50%,#F6B265 50%)}
.floor:nth-child(even){background:linear-gradient(90deg,#FFC778 0 50%,#EEA452 50%)}
.floor::after{content:"";position:absolute;right:6px;top:22%;width:14%;height:56%;background:linear-gradient(135deg,#FFF3C4 0 50%,#FFE38A 50%)}
.floor.target{background:linear-gradient(90deg,#FF8E7E 0 50%,#F2604D 50%)!important}
.floor.lit{background:linear-gradient(90deg,#FFE760 0 50%,#FFCF1A 50%)!important}
.floor.target.lit{background:linear-gradient(90deg,#4BE6CB 0 50%,#1DB59F 50%)!important}
.roof{position:absolute;left:-10px;right:-10px;height:34px;background:linear-gradient(90deg,#FF7A5C 0 50%,#D9503A 50%);clip-path:polygon(50% 0,100% 100%,0 100%)}
.fnum{position:absolute;right:-48px;width:38px;height:30px;line-height:30px;text-align:center;font-weight:800;font-size:20px;color:var(--blue);background:#F7F2DF;border-radius:15px}
.flag{position:absolute;left:8px;top:50%;margin-top:-15px;transform-origin:bottom left;animation:wave 1s infinite alternate;z-index:1}
@keyframes wave{to{transform:skewY(-8deg)}}
.ground{position:absolute;left:-30px;right:0;height:12px;bottom:-11px!important;background:rgba(60,130,60,.28);clip-path:polygon(16px 0,100% 0,calc(100% - 14px) 100%,0 100%);z-index:-1}
.base{position:absolute;left:0;right:0;bottom:6px;background:linear-gradient(90deg,#7FA2FF 0 50%,#3D6FE0 50%);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:12px}
.cabin{position:absolute;left:4px;width:40px;z-index:1;background:linear-gradient(90deg,#86A8FF 0 50%,#3D6FE0 50%)}
.cabin::before{content:"";position:absolute;left:50%;top:15%;bottom:15%;width:2px;margin-left:-1px;background:#fff}
.hero{position:absolute;transition:bottom .38s cubic-bezier(.4,1.5,.6,1),left .38s;z-index:2}
.hero .in.show{animation:fall .6s both}
.mascot .leg,.mascot .armS{transform-origin:50% 0;transform-box:fill-box}
.mascot.walking .l1{animation:legA .26s infinite alternate}
.mascot.walking .l2,.mascot.walking .armS{animation:legA .26s infinite alternate-reverse}
@keyframes legA{from{transform:rotate(28deg)}to{transform:rotate(-28deg)}}
.mascot.walking .body{animation:wbob .13s infinite alternate}
@keyframes wbob{to{transform:translateY(-1.5px)}}
.hero.shake .in{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.stepnum{position:absolute;z-index:3;font-weight:800;font-size:24px;color:var(--teal);animation:floatup .7s forwards;pointer-events:none}
@keyframes floatup{to{transform:translateY(-30px);opacity:0}}

/* talk */
.talk{display:flex;align-items:flex-end;gap:12px;min-height:90px;flex:none}
.bubble{flex:1;background:#fff;padding:10px 14px;font-size:17px;line-height:1.5;font-weight:500;position:relative;box-shadow:0 6px 0 rgba(60,130,60,.25);margin-bottom:14px;border-radius:14px}
@media(min-width:700px){.bubble{padding:12px 18px;font-size:19px}}
.bubble::before{content:"";position:absolute;right:-16px;bottom:14px;border:12px solid transparent;border-left-color:#fff;border-right:0}
.bubble .txt{animation:txtIn .35s both}
@keyframes txtIn{from{opacity:0;transform:translateY(6px)}}
.mascot{flex:none;overflow:visible}
.spawn{position:relative;flex:none;display:flex;justify-content:center;padding-bottom:6px}
.spawn::before{content:"";position:absolute;bottom:0;left:50%;width:96px;height:34px;margin-left:-48px;border-radius:50%;background:#F6A3A0;box-shadow:0 0 0 5px rgba(255,255,255,.7),0 0 0 11px rgba(255,255,255,.3)}
.spawn svg{position:relative}
.mascot .body{transform-origin:50% 100%;transform-box:fill-box}
.mascot.talking .body{animation:bob .32s infinite alternate}
@keyframes bob{to{transform:scale(1.03,.97) rotate(-2deg)}}
.mascot .mouth{transform-origin:center;transform-box:fill-box;transform:scaleY(.35)}
.mascot.talking .mouth{animation:mouth .16s infinite alternate}
@keyframes mouth{from{transform:scaleY(.25)}to{transform:scaleY(1.3)}}
.mascot .eye{transform-origin:center;transform-box:fill-box;animation:blink 4s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.mascot .arm{transform-origin:0 0;transform-box:fill-box}
.mascot.talking .arm{animation:arm .5s infinite alternate}
@keyframes arm{to{transform:rotate(-40deg)}}
.mascot .feather{transform-origin:0 100%;transform-box:fill-box;animation:feather 1.6s infinite alternate}
@keyframes feather{to{transform:rotate(12deg)}}

/* pad: gem buttons */
.pad{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;min-height:56px;flex:none}
.key{width:50px;height:50px;border-radius:50%;font-size:26px;font-weight:800;color:#2E5A3A;background-color:#F7F2DF;background-image:linear-gradient(160deg,#FFFBEE 0 50%,#EFE7CC 50%);box-shadow:0 6px 0 rgba(60,130,60,.28);transition:transform .12s}
.key:hover:not(:disabled){background-image:linear-gradient(180deg,#FFE27A 0 50%,#FFC531 50%)}
.key:active:not(:disabled){transform:scale(.9)}
.key:disabled{cursor:default;opacity:.6}
.keywrap.wiggle .key{animation:wig .55s infinite}
@keyframes wig{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
@media(min-width:700px){.pad{gap:6px;min-height:64px}.key{width:62px;height:62px;font-size:30px}}

/* screens */
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:20px}
.center .h1,.center .note{background:rgba(255,255,255,.8);padding:6px 18px;border-radius:20px}
.cta{font-size:26px;font-weight:800;padding:16px 48px;color:#fff;background:linear-gradient(180deg,#FF8270 0 50%,#FF6450 50%);clip-path:polygon(16px 0,calc(100% - 16px) 0,100% 50%,calc(100% - 16px) 100%,16px 100%,0 50%);transition:transform .12s}
.cta.alt{background:linear-gradient(180deg,#fff 0 50%,#EFE3CB 50%);color:var(--ink)}
.cta:active{transform:scale(.93)}
.h1{font-size:30px;font-weight:800}
.note{color:#6E6A80;font-size:15px;max-width:440px}

/* finish screen: only the big chest + continue */
.app.ending .stage{max-height:none}
.endscreen{gap:12px}
.bigchest{background:none;padding:0;line-height:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation;filter:drop-shadow(0 10px 0 rgba(60,130,60,.25))}
.bigchest .chest{width:min(72vw,300px,42dvh);height:auto}
.bigchest.idle .chest{animation:chestCall 1.6s ease-in-out infinite}
@keyframes chestCall{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(-5deg) scale(1.04)}80%{transform:rotate(5deg) scale(1.04)}90%{transform:rotate(-3deg)}}
.bigchest:active .chest{transform:scale(.94)}
.bigchest:focus-visible{outline:4px solid #fff;outline-offset:6px;border-radius:20px}
.endscreen .cta{min-height:56px}
.coin{position:fixed;left:0;top:0;border-radius:50%;pointer-events:none;z-index:1001;will-change:transform,opacity;
  background:radial-gradient(circle at 35% 30%,#FFF4B0 0 18%,#FFD84A 19% 55%,#E9A913 56% 100%);box-shadow:inset 0 0 0 3px #C98A00}
.coin::after{content:"";position:absolute;inset:26%;border-radius:50%;border:2px solid rgba(201,138,0,.55)}
@media(prefers-reduced-motion:reduce){.bigchest.idle .chest{animation:none}}

/* particles */
.pt{position:fixed;pointer-events:none;z-index:999;will-change:transform,opacity}
.flygem{position:fixed;width:26px;height:26px;margin:-13px 0 0 -13px;transform:rotate(45deg);z-index:1000;pointer-events:none;background-image:linear-gradient(135deg,rgba(255,255,255,.5) 0 50%,transparent 50%)!important}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const {useState,useEffect,useRef} = React;

/* ---------- helpers ---------- */
const WORDS=['אפס','אחת','שתיים','שלוש','ארבע','חמש','שש','שבע','שמונה','תשע','עשר','אחת עשרה','שתים עשרה'];
const floorsWord=n=>n===1?'קומה אחת':n===2?'שתי קומות':`${WORDS[n]} קומות`;
const SPOKEN=['אֶפֶס','אַחַת','שְׁתַּיִם','שָׁלוֹשׁ','אַרְבַּע','חָמֵשׁ','שֵׁשׁ','שֶׁבַע','שְׁמוֹנֶה','תֵּשַׁע','עֶשֶׂר','אַחַת עֶשְׂרֵה','שְׁתֵּים עֶשְׂרֵה'];
const toSpeech=t=>t.replace(/\d+/g,m=>SPOKEN[+m]??m).replace(/־/g,' ');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const rand=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const LS='kidodo-decomp-first';
const GEMC=['#FF6450','#3D6FE0','#1FB5A2','#8E5CF0'];

function genRounds(){
  let last=null; try{last=localStorage.getItem(LS)}catch(e){}
  const seen=new Set(),out=[];
  for(let i=0;i<4;i++){
    const [lo,hi]=i<2?[3,7]:[5,9];
    let t,p,k,g=0;
    do{t=rand(lo,hi);p=rand(1,t-1);k=t+'-'+Math.min(p,t-p);g++}
    while((seen.has(k)||(i===0&&k===last))&&g<300);
    seen.add(k); out.push({total:t,part:p,answer:t-p,guess:null,guessMs:null,wrong:[]});
  }
  try{localStorage.setItem(LS,out[0].total+'-'+out[0].part)}catch(e){}
  return out;
}

/* voice + tones */
let heVoice=null, actx=null;
const hasTTS=typeof window!=='undefined'&&'speechSynthesis' in window;
function loadVoice(){try{const hv=speechSynthesis.getVoices().filter(v=>/^(he|iw)/i.test(v.lang));heVoice=hv.find(v=>/hila|carmit|female|woman/i.test(v.name))||hv.find(v=>!/avri|asaf|male/i.test(v.name))||hv[0]||null}catch(e){}}
if(hasTTS){loadVoice();try{speechSynthesis.onvoiceschanged=loadVoice}catch(e){}}
let soundOn=true;
function tone(f,d=.15,type='triangle',vol=.12){
  if(!actx||!soundOn)return;
  try{const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=f;
    g.gain.setValueAtTime(vol,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d);
    o.connect(g).connect(actx.destination);o.start();o.stop(actx.currentTime+d)}catch(e){}
}
function popSound(){tone(900,.08,'square',.05);setTimeout(()=>tone(300,.12,'sawtooth',.05),40)}
const log=(ev,data)=>console.log('[kidodo]',ev,data||'');
/* link to the course (public/practices/kidodo-practice.js). Opened alone, it does nothing. */
const KP=window.KidodoPractice||{inCourse:false,answer(){},complete:()=>Promise.resolve(),next(){location.reload()},exit(){history.back()}};

/* ---------- particles ---------- */
function explode(el,colors){
  const r=el.getBoundingClientRect(); if(!r.width)return;
  let c=colors; if(!c){const bg=getComputedStyle(el).backgroundColor; c=[bg&&bg!=='rgba(0, 0, 0, 0)'?bg:'#22304F','#FFC531'];}
  const n=Math.min(38,14+Math.round(r.width*r.height/500));
  for(let i=0;i<n;i++){
    const p=document.createElement('div');p.className='pt';
    const s=5+Math.random()*10, x=r.left+Math.random()*r.width, y=r.top+Math.random()*r.height;
    const shape=Math.random(); p.style.cssText=`left:${x}px;top:${y}px;width:${s}px;height:${s}px;background:${c[i%c.length]};`+
      (shape<.33?'border-radius:50%;':shape<.66?'clip-path:polygon(50% 0,100% 100%,0 100%);':'border-radius:2px;');
    document.body.appendChild(p);
    const ang=Math.atan2(y-(r.top+r.height/2),x-(r.left+r.width/2))+(Math.random()-.5);
    const dist=60+Math.random()*140, dx=Math.cos(ang)*dist, dy=Math.sin(ang)*dist-40;
    const a=p.animate([{transform:'translate(0,0) rotate(0) scale(1)',opacity:1},
      {transform:`translate(${dx*.7}px,${dy*.7}px) rotate(${Math.random()*360}deg) scale(1)`,opacity:1,offset:.6},
      {transform:`translate(${dx}px,${dy+60}px) rotate(${Math.random()*720}deg) scale(.4)`,opacity:0}],
      {duration:700+Math.random()*500,easing:'cubic-bezier(.15,.7,.4,1)'});
    a.onfinish=()=>p.remove();
  }
}
/* coins that jump out of the chest and fall with gravity */
let liveCoins=0;
function coinBurst(el,n=26){
  if(!el)return; const r=el.getBoundingClientRect(); if(!r.width)return;
  const x0=r.left+r.width/2, y0=r.top+r.height*.38, H=window.innerHeight;
  const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  n=Math.min(n,Math.max(0,140-liveCoins)); if(reduce)n=Math.min(n,8);
  for(let i=0;i<n;i++){
    const c=document.createElement('div');c.className='coin';
    const s=20+Math.random()*16; c.style.width=c.style.height=s+'px';
    document.body.appendChild(c);liveCoins++;
    const vx=(Math.random()-.5)*Math.min(900,window.innerWidth*1.6), vy=-(520+Math.random()*520), g=1500;
    const T=Math.max(1.1,(-vy+Math.sqrt(vy*vy+2*g*(H-y0+60)))/g), spin=2+Math.floor(Math.random()*4), frames=[];
    for(let k=0;k<=12;k++){const t=T*k/12, x=x0+vx*t-s/2, y=y0+vy*t+.5*g*t*t-s/2;
      frames.push({transform:`translate(${x}px,${y}px) scaleX(${Math.cos(k/12*spin*Math.PI*2).toFixed(2)})`,opacity:k===0?0:1})}
    const a=c.animate(frames,{duration:T*1000,delay:i*18,easing:'linear',fill:'both'});
    a.onfinish=()=>{c.remove();liveCoins--};
  }
}

function flyGem(fromEl,toEl,color){
  return new Promise(res=>{
    if(!fromEl||!toEl){res();return}
    const a=fromEl.getBoundingClientRect(),b=toEl.getBoundingClientRect();
    const g=document.createElement('div');g.className='flygem';g.style.background=color;
    const x0=a.left+a.width/2,y0=a.top+a.height/2,x1=b.left+b.width/2,y1=b.top+b.height/2;
    g.style.left=x0+'px';g.style.top=y0+'px';document.body.appendChild(g);
    const mx=(x1-x0)/2,my=Math.min(y1,y0)-y0-120;
    const an=g.animate([{transform:'translate(0,0) rotate(45deg) scale(.3)'},{transform:`translate(${mx}px,${my}px) rotate(225deg) scale(1.8)`,offset:.45},
      {transform:`translate(${x1-x0}px,${y1-y0}px) rotate(405deg) scale(.8)`}],{duration:1000,easing:'cubic-bezier(.4,0,.3,1)'});
    an.onfinish=()=>{g.remove();res()};
  });
}

  const [cabinF,setCabinF]=useState(1),[cabinDur,setCabinDur]=useState(0),[doors,setDoors]=useState(true),[dragN,setDragN]=useState(0);

    const ro=new ResizeObserver(m);ro.observe(el);return()=>ro.disconnect()},[screen]);

  function say(text){
    return new Promise(res=>{

    setPhase('climb');R.current.phase='climb';setScene('tower');
    towerIntro(alive,r);showPad(alive,900);
    await sleep(900); if(!alive())return;
    if(i===0){
      await say('עכשיו בואו נשתמש במוח החושב. נסתכל על המגדל שלנו.'); if(!alive())return;
      setHl('total');
      await say(`המספר ${r.total}, שקודם היה קובייה, הוא כמו הקומה ${r.total}.`); if(!alive())return;
      setHl('part');
      await say(`הקובייה ${r.part}, היא כמו המעלית שכבר הביאה אותנו לקומה ${r.part}.`); if(!alive())return;
      setHl('gap');
      await say(`ועכשיו צריך לחשוב כמה קומות נצטרך לעלות כדי להגיע לקומה ${r.total}. מספר הקומות שנעלה, הוא הקובייה שתשלים את ${r.part} כדי ליצור את ${r.total}.`); if(!alive())return;
      setHl(null);
    }else{
      setHl('gap');
      await say(`אנחנו בקומה ${r.part}, ורוצים להגיע לקומה ${r.total}. כמה קומות לטפס?`); if(!alive())return;
      setHl(null);
    }
  }

  async function towerIntro(alive,r){
    setCabinDur(0);setCabinF(1);setDoors(true);setHeroDur(0);setHero(1);setHeroPos('out');setFacing('right');setWalking(false);setHeroVis(false);
    await sleep(1000); if(!alive())return false;
    setHeroVis(true); await sleep(500); if(!alive())return false;
    setHeroDur(1.1);setWalking(true);setHeroPos('cab'); await sleep(1150); if(!alive())return false;
    setWalking(false);setFacing('back'); await sleep(350);
    setDoors(false);tone(700,.08); await sleep(450); if(!alive())return false;
    if(r.part>1){const d=.5+.35*(r.part-1);setCabinDur(d);setHeroDur(d);setCabinF(r.part);setHero(r.part);await sleep(d*1000+120); if(!alive())return false;}
    tone(1047,.25,'sine');setDoors(true); await sleep(420); if(!alive())return false;
    setFacing('right');setHeroDur(.6);setWalking(true);setHeroPos('a'); await sleep(650); if(!alive())return false;
    setWalking(false);setFacing('front');
    return true;
  }

  async function onClimb(n){
    const alive=newFlow(), i=R.current.ri, r=R.current.rounds[i], top=r.total+1;
    hush();setHl(null);setBusy(true);R.current.busy=true;setCaption(`מטפסים ${floorsWord(n)}…`);setCapN(c=>c+1);
    if(heroRef.current.hero!==r.part||heroRef.current.pos!=='a'){
      setCabinDur(0);setCabinF(r.part);setDoors(true);setHeroDur(0);setHero(r.part);setHeroPos('a');setHeroVis(true);setWalking(false);setFacing('front');
      await sleep(80); if(!alive())return;
    }
    setTalking(true);
    for(let k=1;k<=n;k++){
      const f=r.part+k;
      if(f>top){setTalking(false);setShake(true);tone(160,.25,'square',.08);await sleep(450);setShake(false);break}
      const nx=k%2?'b':'a';
      setFacing(nx==='b'?'right':'left');setWalking(true);setHeroDur(.42);setHeroPos(nx);
      setHero(f);setLitTo(f);setStepPop({f,k});tone(392+k*60,.14);
      setCaption(`מטפסים ${floorsWord(n)}… ${f}`);
      await Promise.all([sayWord(SPOKEN[f]),sleep(420)]); if(!alive()){setTalking(false);return}
    }
    setTalking(false);setWalking(false);setFacing('front');
    const ok=n===r.answer; log('climb_attempt',{n,correct:ok}); KP.answer(ok);
    if(ok){await sleep(300);if(alive())summary(i);return}
    r.wrong.push(n);
    await sleep(250); if(!alive())return;
    boom(`[data-key="${n}"]`);
    setTimeout(()=>setRemoved(x=>[...x,n]),50);
    later(alive,350,()=>{setFacing('front');setHeroDur(.4);setHero(r.part);setHeroPos('a');setLitTo(r.part)});
    later(alive,700,()=>{setBusy(false);R.current.busy=false});
    say(n<r.answer?`עוד לא הגענו לקומה ${r.total}. ננסה שוב!`:'עלינו יותר מדי. ננסה שוב!');
  }

  async function summary(i){
    const alive=newFlow(), r=R.current.rounds[i];
    setPhase('summary');R.current.phase='summary';setHappy(true);setPadOn(false);
    [523,659,784,1047].forEach((f,j)=>setTimeout(()=>tone(f,.2),j*110));
    await sleep(600); if(!alive())return;
    boom('[data-boom="t"],[data-boom="k"]',['#FFC531','#F6B265','#FF6450','#3D6FE0']);
    await sleep(400); if(!alive())return;
    setDragN(d=>d+1);setScene('blocks');
    await sleep(1000); if(!alive())return;
    setSlot('answer');
    if(r.guess===r.answer) setChip('ok');
    else later(alive,650,()=>{boom('[data-boom="chip"]',['#8E5CF0','#fff']);setTimeout(()=>setChip('none'),30)});
    await sleep(1100); if(!alive())return;
    const d=Math.abs(r.guess-r.answer);
    if(d===0) await say(`מעולה! בהתחלה ניחשנו ${r.guess}. עם המוח האיטי בדקנו, וגילינו שצדקנו!`);
    else if(d===1) await say(`מעולה! בהתחלה ניחשנו ${r.guess}, וזה היה קרוב. עם המוח האיטי בדקנו, וגילינו שהתשובה היא ${r.answer}.`);
    else await say(`מעולה! בהתחלה ניחשנו ${r.guess}. עם המוח האיטי בדקנו, וגילינו שהתשובה היא ${r.answer}.`);
    if(!alive())return;
    setMerged(true);tone(440,.3,'sine');await sleep(900); if(!alive())return;
    setMerged(false);setShowEq(true);
    await say(`ועכשיו בואו נראה את זה: ${r.total} מורכב מ־${r.part} ו־${r.answer}.`); if(!alive())return;
    await flyGem(eqRef.current,chestRef.current,GEMC[i]); if(!alive())return;
    setProgress(i+1);setBumpN(b=>b+1);tone(988,.25,'sine');setTimeout(()=>tone(1319,.3,'sine'),120);
    log('round_done',r);
    if(i===0) await say('בואו ננסה עוד שלוש פעמים, ונמלא את תיבת האוצר שלנו!');
    else if(i<3) await say('עוד אחד!');
    if(!alive())return;
    boom('[data-boom="b"]',['#FF6450','#3D6FE0','#FFC531']);
    await sleep(500); if(!alive())return;
    if(i<3){playRound(i+1);return}
    log('session_done',R.current.rounds);
    setScene('none');setLidOpen(false);setTaps(0);setScreen('end');
    [523,659,784,1047,1319].forEach((f,j)=>setTimeout(()=>tone(f,.25),j*120));
    await sleep(700); if(!alive())return;
    await say('כל הכבוד! ניחשנו, בדקנו, ושוב ניחשנו. ככה המוח המהיר שלנו לומד להרגיש מספרים. מילאנו את תיבת האוצר! לחצו עליה ותראו מה יש בפנים.');
  }

  /* finish screen: every tap opens the chest again and throws coins (just for fun, the reward does not change) */
  function tapChest(){
    try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume()}catch(e){}
    hush();
    const first=taps===0; finish(); setTaps(t=>t+1); log('chest_tap',taps+1);
    setLidOpen(false);setTimeout(()=>setLidOpen(true),70);   // chest remounts closed, then the lid pops open
    setTimeout(()=>{coinSound();coinBurst(bigChestRef.current,first?34:22)},200);
  }

  async function goNext(){
    if(leaving)return; setLeaving(true); hush();
    await finish();
    KP.next();
  }
  const doneReq=useRef(null);      // reported once, when the chest is opened (or on ״המשך״)
  function finish(){const rs=R.current.rounds;if(!doneReq.current)doneReq.current=KP.complete({rounds:rs.length,firstTry:rs.filter(r=>!r.wrong.length).length});return doneReq.current}

  function pick(n){
    const {phase,busy,rounds,ri,removed}=R.current; const r=rounds[ri];
    if(busy||!r||n<1||n>r.total-1)return;
    if(phase==='guess')onGuess(n);
    else if(phase==='climb'&&!removed.includes(n))onClimb(n);
  }
  useEffect(()=>{const h=e=>{const n=parseInt(e.key,10);if(n>=1&&n<=9)pick(n)};window.addEventListener('keydown',h);return()=>window.removeEventListener('keydown',h)});
  useEffect(()=>()=>{clearNudges();hush()},[]);
  useEffect(()=>{if(KP.embedded)start()},[]);   // inside the course its Play button is the start screen
  // back after a pause: the last instruction is said again
  useEffect(()=>{if(KP.onResume)KP.onResume(()=>{if(R.current.rounds.length&&!R.current.busy&&lastSay.current)say(lastSay.current)})},[]);

  function toggleSound(){const v=!sound;setSound(v);soundOn=v;if(!v&&hasTTS)try{speechSynthesis.cancel()}catch(e){}}

  /* ---------- render ---------- */
  const r=rounds[ri];
  const Header=(
    <header>
      <div className="title"><Bolt s={26}/><span>פירוק מספרים</span></div>
      <div className="treasure" style={screen==='end'?{visibility:'hidden'}:null}>
        <div className="pbar"><div className="pfill" style={{width:(progress/4*100)+'%'}}/></div>
        <Chest key={'c'+bumpN} innerRef={chestRef} count={progress} open={chestOpen} bump={bumpN>0}/>
      </div>
      <div className="tools">
        {screen!=='end'&&<button className="iconbtn" title="חזרה על ההוראה" aria-label="חזרה על ההוראה" onClick={()=>say(lastSay.current)} disabled={screen!=='play'||!lastSay.current}>↻</button>}
        <button className="iconbtn" title="קול" aria-label="קול" onClick={toggleSound}>{sound?'🔊':'🔇'}</button>
        {KP.inCourse&&<button className="iconbtn" title="חזרה לקורס" aria-label="חזרה לקורס" onClick={()=>{hush();KP.exit()}}>✕</button>}
      </div>
    </header>);

  const Talk=(
    <div className="talk">
      <div className="spawn"><Mascot talking={talking} s={96}/></div>
      <div className="bubble" aria-live="polite"><div className="txt" key={capN}>{caption||'…'}</div></div>
    </div>);

  let stageContent=null;
  if(screen==='start'){
    stageContent=(<div className="center" key="start">
      <div className="fall"><Mascot s={140}/></div>
      <div className="h1 fall" style={{animationDelay:'.2s'}}>בואו נתאמן בפירוק מספרים</div>
      <div className="note fall" style={{animationDelay:'.35s'}}>ננחש עם המוח המהיר, נבדוק במדרגות עם המוח החושב, ונמלא את תיבת האוצר.</div>
      <div className="fall" style={{animationDelay:'.5s'}}><button className="cta" onClick={start}>מתחילים</button></div>
      {hasTTS&&!heVoice&&!window.KidodoVoice&&<div className="note">לא נמצא קול בעברית בדפדפן הזה, אז הקריינות תופיע ככתוביות.</div>}
    </div>);
  }else if(screen==='end'){
    stageContent=(<div className="center endscreen" key="end">
      <div className="h1 fall">כל הכבוד!</div>
      <div className="fall" style={{animationDelay:'.15s'}}>
        <button ref={bigChestRef} className={'bigchest'+(taps===0?' idle':'')} onClick={tapChest} aria-label="לפתוח את תיבת האוצר">
          <Chest key={'big'+taps} count={4} open={lidOpen} bump={taps>0} s={300}/>
        </button>
      </div>
      {taps>0&&<div ref={KP.coinBadge}/>}
      <div className="note fall" style={{animationDelay:'.3s'}}>{taps===0?'לחצו על התיבה':'אפשר ללחוץ שוב!'}</div>
      <div className="fall" style={{animationDelay:'.6s'}}>
        <button className="cta" onClick={goNext} disabled={leaving}>המשך</button>
      </div>
    </div>);
  }else if(r&&(scene==='blocks'||scene==='tower')){
    const side=scene==='tower';
    const top=r.total+1, vis=top, fh=Math.max(14,Math.min(40,(stageH-80)/vis)), groundB=28;
    const U=side?fh:Math.min(34,Math.max(16,(stageH-120)/r.total)), W=side?40:72, D=14, gap=merged?0:(side?3:16);
    const sh=r.answer*U-gap/2;
    const gTop=side?(stageH-groundB-r.total*U):Math.max(D+6,(stageH-r.total*U-(showEq?80:0))/2);
    const Big=<Block cls="big" boom="b" w={W} h={r.total*U} hl={hl==='total'}>{r.total}</Block>;
    const Part=<Block cls="part" boom="b" w={W} h={r.part*U-gap/2} hl={hl==='part'}>{r.part}</Block>;
    let tower=null;
    if(side){
      const TH=vis*fh, hs=Math.round(Math.max(18,Math.min(50,fh-4))), hw=hs*.75;
      const y=f=>(f-1)*fh, ch=fh-2;
      const X={out:-hw-34,cab:4+(40-hw)/2,a:54,b:100}[heroPos];
      const ease=heroDur>.7?'linear':'ease-out';
      tower=(<div className="tgroup"><div className="tower fall" data-boom="t" style={{height:TH}}>
        <div className="ground" style={{bottom:0}}/>
        {Array.from({length:vis},(_,k)=>{const f=k+1;return(
          <div key={f} className={'floor'+(f===r.total?' target':'')+(f>r.part&&f<=litTo?' lit':'')+((hl==='total'&&f===r.total)||(hl==='gap'&&f>r.part&&f<=r.total)?' hl':'')} style={{bottom:y(f)+1,height:fh-2}}>
            {(f===r.part||f===r.total)&&<span className="fnum" style={f===r.total?{color:'var(--coral)'}:null}>{f}</span>}
          </div>)})}
        <div className="shaft" style={{bottom:0,height:r.part*fh}}/>
        <div className={'cabin'+(hl==='part'?' hl':'')} style={{bottom:y(cabinF)+1,height:ch,transition:`bottom ${cabinDur}s linear`}}/>
        <div className="roof" style={{bottom:TH}}/>
        <div className={'hero'+(shake?' shake':'')} style={{bottom:y(hero)+1,left:X,width:hw,height:hs,opacity:heroVis?1:0,transition:`bottom ${heroDur}s ${ease}, left ${heroDur}s linear`}}>
          <div className={'in'+(heroVis?' show':'')} key={heroVis?'v':'h'}><Hero happy={happy} s={hs} facing={facing} walking={walking}/></div></div>
        <div className={'doors'+(doors?' open':'')} style={{bottom:y(cabinF)+1,height:ch,transition:`bottom ${cabinDur}s linear`}}><i/><i/></div>
        {stepPop&&<span key={stepPop.f+'-'+stepPop.k+'-'+litTo} className="stepnum" style={{bottom:y(stepPop.f)+hs*.6,left:X+(heroPos==='b'?-30:hw+2)}}>+{stepPop.k}</span>}
      </div></div>);
    }
    stageContent=(<div className="scene" key={'r'+ri}>
      <div className={'bgroup'+(side?' side':'')+(merged?' merged':'')} style={{top:gTop}}>
        <div className="cols">
          <HandPlace delay={0}><Drag key={'d1'+dragN}>{Big}</Drag></HandPlace>
          <div className="col" style={{gap}}>
            <div className="fall" style={{animationDelay:'1.9s',position:'relative',zIndex:5}}><Drag key={'d4'+dragN}>
              <div className={'slot'+(slot==='answer'?' filled':'')+(hl==='gap'?' hl':'')} data-boom="b" style={{width:W,height:sh}}>
                {slot!=='answer'&&<svg className="box" width={W+D} height={sh+D} viewBox={`0 0 ${W+D} ${sh+D}`}>
                  <rect x="1.5" y={D+1.5} width={W-3} height={sh-3} fill="rgba(255,255,255,.45)" stroke="rgba(46,107,62,.6)" strokeWidth="2.5" strokeDasharray="7 5"/>
                  <polygon points={`1.5,${D+1.5} ${D+1.5},1.5 ${W+D-1.5},1.5 ${W-1.5},${D+1.5}`} fill="rgba(255,255,255,.6)" stroke="rgba(46,107,62,.6)" strokeWidth="2.5" strokeDasharray="7 5"/>
                  <polygon points={`${W-1.5},${D+1.5} ${W+D-1.5},1.5 ${W+D-1.5},${sh-1.5} ${W-1.5},${sh+D-1.5}`} fill="rgba(255,255,255,.3)" stroke="rgba(46,107,62,.6)" strokeWidth="2.5" strokeDasharray="7 5"/>
                </svg>}
                {slot!=='answer'&&<span className="q">?</span>}
                {slot==='answer'&&<HandPlace delay={0}><Drag key={'d3'+dragN}><Block cls="ans">{r.answer}</Block></Drag></HandPlace>}
                {chip!=='none'&&r.guess!=null&&<span className="chip fall" data-boom="chip">ניחוש: {r.guess}{chip==='ok'?' ✓':''}</span>}
              </div>
            </Drag></div>
            <HandPlace delay={.95}><Drag key={'d2'+dragN}>{Part}</Drag></HandPlace>
          </div>
        </div>
        {showEq&&<div className="eq fall" dir="ltr" ref={eqRef} data-boom="b"><span className="t">{r.total}</span>=<span className="p">{r.part}</span>+<span className="a">{r.answer}</span></div>}
      </div>
      {tower}
    </div>);
  }

  const showKeys=screen==='play'&&r&&(phase==='guess'||phase==='climb')&&padN>0;
  return(<>
    <LowPolyBG/>
    <div className={'app'+(screen==='end'?' ending':'')}>{Header}
      <div className="stage" ref={stageRef}>{stageContent}</div>
      {screen!=='end'&&Talk}
      {screen!=='end'&&<div className={'pad keywrap'+(wiggle&&phase==='guess'?' wiggle':'')} key={'p'+padN}>
        {showKeys&&Array.from({length:r.total-1},(_,k)=>{const n=k+1;
          if(phase==='climb'&&removed.includes(n))return null;
          return <div key={n} className="fall" style={{animationDelay:(phase==='guess'?1.9:1.0)+k*.07+'s'}}>
            <button className="key" data-boom="k" data-key={n} disabled={!padOn||busy} onClick={()=>pick(n)}>{n}</button></div>})}
      </div>}
    </div></>);
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
