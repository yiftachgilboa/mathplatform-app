<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kidodo · תאומי עשר</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>

<style>
:root{--ink:#33373b;--kblue:#176fbe;--coral:#FF6450}
*{box-sizing:border-box;margin:0}
html,body{overflow:hidden;height:100%}
body{font-family:Rubik,system-ui,sans-serif;color:var(--ink);background:#CDEBFA;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:0}
.bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block;filter:saturate(1.15) brightness(.86) contrast(.94)}
.dim{position:fixed;inset:0;z-index:0;background:linear-gradient(180deg,transparent 0 38%,rgba(18,42,66,.2) 62%);pointer-events:none}
.app{position:relative;z-index:1;display:flex;flex-direction:column;height:100vh;height:100dvh}
/* the top row lies over the board (a long sentence never changes the size of the 6 × 10 area) */
.top{position:absolute;left:0;right:0;top:0;max-width:960px;margin:0 auto;padding:10px 14px 0 66px;display:flex;align-items:flex-start;gap:10px;min-height:66px;z-index:8;pointer-events:none}
.top header{margin-top:8px}
.top>*{pointer-events:auto}
header{display:flex;align-items:center;flex:none;margin-inline-start:auto}
.side{position:absolute;left:10px;top:10px;display:flex;flex-direction:column;gap:8px;z-index:90}
.iconbtn{width:44px;height:44px;border-radius:50%;color:var(--kblue);background:#F4F8FF;box-shadow:0 4px 0 rgba(23,111,190,.22);display:flex;align-items:center;justify-content:center}
.treasure{display:flex;align-items:center;gap:8px;padding:4px 0}
.pwrap{position:relative;display:flex;align-items:center;padding-inline-start:16px}
.pbar{width:64px;height:16px;border-radius:8px;background:rgba(23,111,190,.16);overflow:hidden}
.pfill{height:100%;border-radius:9px;background:linear-gradient(180deg,#FFD95A 0 50%,#FFC531 50%);transition:width .8s cubic-bezier(.3,1.4,.5,1)}
.pcount{position:absolute;inset-inline-start:-6px;top:50%;margin-top:-17px;min-width:34px;height:34px;padding:0 6px;border-radius:17px;background:#fff;color:#9B6A00;font-weight:500;font-size:16px;line-height:34px;text-align:center;box-shadow:0 3px 0 rgba(23,111,190,.2)}
.pcount.bump,.chest.bump{animation:bump .5s}
@keyframes bump{30%{transform:scale(1.25,.85)}60%{transform:scale(.9,1.15)}}
@media(min-width:700px){.treasure{gap:10px;padding:4px 14px}.pbar{width:130px;height:18px;border-radius:9px}}
.talk{display:flex;align-items:center;gap:10px;flex:1 1 auto;min-width:0}
.spawn{flex:none;line-height:0}
.bubble{flex:0 1 540px;min-width:0;background:#fff;padding:8px 14px;font-size:16px;line-height:1.35;font-weight:500;position:relative;box-shadow:0 5px 0 rgba(23,111,190,.18);border-radius:14px}
.bubble::before{content:"";position:absolute;right:-12px;top:50%;margin-top:-10px;border:10px solid transparent;border-left-color:#fff;border-right:0}
.bubble .txt{animation:txtIn .35s both}
@keyframes txtIn{from{opacity:0;transform:translateY(6px)}}
@media(max-width:559px){.bubble{font-size:13.5px;padding:6px 10px}.pbar{width:36px;height:12px}.treasure{gap:4px}.talk{gap:8px}}
@media(min-width:700px){.bubble{padding:12px 18px;font-size:19px}}

.board{position:relative;flex:1;min-height:0;overflow:hidden;overflow:clip;touch-action:none;user-select:none;-webkit-user-select:none}
.board>*{position:absolute}
.world{will-change:transform;z-index:1;direction:ltr}
.world>*{position:absolute}
.world.front{z-index:5;pointer-events:none}
.hero{z-index:4;pointer-events:none}
.hero .in.show{animation:heroIn .6s both}
@keyframes heroIn{from{transform:translateY(-140px)}60%{transform:translateY(0) scale(1.06,.92)}to{transform:none}}
.winhop{animation:winHop .55s cubic-bezier(.3,0,.5,1) infinite alternate}
@keyframes winHop{from{transform:translateY(0) scale(1.04,.96)}to{transform:translateY(-22px)}}
.monster{z-index:3;pointer-events:none;transform-origin:50% 100%}
.quake{animation:quake .65s}
@keyframes quake{10%,50%,90%{transform:translate(-9px,3px)}30%,70%{transform:translate(9px,-3px)}100%{transform:none}}
.shake{animation:shake2 .35s}
@keyframes shake2{25%{transform:translateY(3px)}75%{transform:translateY(-2px)}}

/* the rocks: flat cushion blocks, one colour per number. The 6 × 10 area has no visible frame */
.pile{z-index:6;left:0;top:0;direction:ltr;pointer-events:none}
.blk{position:absolute;touch-action:none;cursor:grab;will-change:transform;pointer-events:auto}
.blk svg{position:absolute;inset:1.5px;width:calc(100% - 3px);height:calc(100% - 3px);display:block}
.blk b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:500;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.22);pointer-events:none}
.blk.dark b{color:#6b4700;text-shadow:0 1px 0 rgba(255,255,255,.5)}
.blk.dragging{z-index:30;cursor:grabbing}
.blk.dragging svg{filter:brightness(1.1) drop-shadow(0 6px 6px rgba(23,80,130,.3))}
.ten{position:absolute;z-index:40;pointer-events:none;font-weight:500;color:#fff;text-shadow:0 0 12px rgba(255,255,255,.9),0 3px 0 rgba(23,80,130,.25);animation:ten 1.15s ease-out forwards;transform:translate(-50%,-50%)}
@keyframes ten{0%{transform:translate(-50%,-50%) scale(.5);opacity:0}18%{transform:translate(-50%,-60%) scale(1.15);opacity:1}55%{opacity:1}100%{transform:translate(-50%,-110%) scale(1.35);opacity:0}}
.combo{position:absolute;z-index:42;pointer-events:none;font-weight:500;color:#fff;background:linear-gradient(180deg,#FF8270 0 50%,#FF6450 50%);padding:4px 16px;border-radius:16px;box-shadow:0 4px 0 rgba(160,40,20,.3);animation:combo 1.1s cubic-bezier(.3,1.5,.5,1) forwards;transform:translate(-50%,-50%);white-space:nowrap}
@keyframes combo{0%{transform:translate(-50%,-50%) scale(0) rotate(-12deg)}25%{transform:translate(-50%,-50%) scale(1.15) rotate(3deg)}70%{transform:translate(-50%,-60%) scale(1);opacity:1}100%{transform:translate(-50%,-90%) scale(.9);opacity:0}}
.coin2{z-index:2;pointer-events:none;animation:coinIn .5s cubic-bezier(.3,1.6,.5,1) both}
.coin2 span{animation:bob 1.4s ease-in-out infinite alternate}
@keyframes coinIn{from{transform:scale(0)}}
@keyframes bob{to{transform:translateY(-8px)}}
.cloud{animation:cloudDrift linear infinite}
@keyframes cloudDrift{from{transform:translateX(-220px)}to{transform:translateX(1300px)}}
.hand{position:absolute;left:0;top:0;z-index:60;pointer-events:none;opacity:0;filter:drop-shadow(0 4px 4px rgba(23,80,130,.3))}
.ghost{position:absolute;left:0;top:0;z-index:58;pointer-events:none;opacity:0}
.wchest{background:none;padding:0;line-height:0;touch-action:manipulation;z-index:3;filter:drop-shadow(0 8px 0 rgba(23,80,130,.18))}
.wchest .chest{width:100%;height:auto;display:block}
.wchest.idle .chest{animation:chestCall 1.6s ease-in-out infinite}
@keyframes chestCall{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(-5deg) scale(1.04)}80%{transform:rotate(5deg) scale(1.04)}90%{transform:rotate(-3deg)}}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:20px;z-index:80}
.endscreen{background:rgba(255,255,255,.55);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.stars{display:flex;gap:14px;align-items:flex-end}
.star{width:min(26vw,120px);aspect-ratio:100/96;animation:starIn .55s cubic-bezier(.3,1.6,.5,1) both}
.star:nth-child(2){width:min(32vw,150px)}
@keyframes starIn{from{transform:scale(0) rotate(-40deg);opacity:0}}
.rise{animation:rise .5s ease-out both}
@keyframes rise{from{transform:translateY(24px);opacity:0}}
.endbtns{position:absolute;left:0;right:0;bottom:max(22px,5dvh);display:flex;justify-content:center;gap:clamp(56px,22vw,220px)}
.endbtn{width:112px;height:64px;display:flex;align-items:center;justify-content:center;clip-path:polygon(16px 0,calc(100% - 16px) 0,100% 50%,calc(100% - 16px) 100%,16px 100%,0 50%);transition:transform .12s}
.endbtn:active{transform:scale(.93)}
.endbtn.next{background:linear-gradient(180deg,#2f8f62 0 50%,#237a52 50%)}
.endbtn.again{background:linear-gradient(180deg,#2f5f9e 0 50%,#244f88 50%)}
.coinp{position:fixed;left:0;top:0;pointer-events:none;z-index:1001;will-change:transform,opacity;line-height:0}
.flycoin{position:fixed;width:30px;height:30px;margin:-15px 0 0 -15px;z-index:1000;pointer-events:none}
.pt{position:fixed;pointer-events:none;z-index:999;will-change:transform,opacity}
@media(prefers-reduced-motion:reduce){.cloud,.coin2 span,.wchest.idle .chest,.winhop{animation:none}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const {useState,useEffect,useLayoutEffect,useRef,useMemo} = React;

/* ---------- helpers ---------- */
const SPOKEN=['אֶפֶס','אַחַת','שְׁתַּיִם','שָׁלוֹשׁ','אַרְבַּע','חָמֵשׁ','שֵׁשׁ','שֶׁבַע','שְׁמוֹנֶה','תֵּשַׁע','עֶשֶׂר'];
const toSpeech=t=>t.replace(/\d+/g,m=>SPOKEN[+m]??m).replace(/[⁦⁩]/g,'').replace(/־/g,' ').replace(/\+/g,' ועוד ').replace(/×/g,' ');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const rand=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const shuffle=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
const log=(ev,data)=>console.log('[kidodo]',ev,data||'');
const KP=window.KidodoPractice||{inCourse:false,answer(){},complete:()=>Promise.resolve(),next(){location.reload()},exit(){history.back()}};

/* ---------- the board: 6 columns × 10 rows (row 0 = on the ground). All parameters here ---------- */
const PCOLS=6, ROWS=5;   // the pile stands in 6 columns, up to 5 rows (big rocks, easy to drag)
let GC=6;                // columns you can drag in: from the pile to the right edge of the screen (set by the layout)
const LEVELS=[{h:2,n:6},{h:3,n:10},{h:4,n:14},{h:5,n:18}];   // after the tutorial: 4 piles, each one higher
const TUT=[{v:3,c:1},{v:4,c:2},{v:6,c:4},{v:7,c:5}];               // the tutorial: 4 rocks, 2 different pairs (drag the 6 to the 4)
const PAIRS=[[1,9],[2,8],[3,7],[4,6],[5,5]];
const DIRS=[[1,0],[-1,0],[0,1],[0,-1]];
/* every number has its own colour (the kidodo palette and its relatives) */
const NUMC={1:'#EF5C55',2:'#F79A2E',3:'#FFC531',4:'#8CC63F',5:'#1FB5A2',6:'#4FB3F0',7:'#3D5FD8',8:'#8E5CF0',9:'#EC6BAE'};
const mix=(hex,t)=>{const n=parseInt(hex.slice(1),16),c=[n>>16,n>>8&255,n&255].map(v=>Math.round(t>0?v+(255-v)*t:v*(1+t)));return '#'+c.map(v=>v.toString(16).padStart(2,'0')).join('')};
/* a rock: a cushion block, four faces lit from the top-left (the art library's light), with a chamfer */
const BLOCK_SVG={};
for(let v=1;v<=9;v++){const b=NUMC[v],k=12,cx=47,cy=44;
  const P=(...a)=>a.map(p=>p.join(',')).join(' ');
  BLOCK_SVG[v]=`<svg viewBox="0 0 100 100" preserveAspectRatio="none">`+
    `<polygon points="${P([0,k],[k,0],[100-k,0],[100,k],[cx,cy])}" fill="${mix(b,.32)}"/>`+
    `<polygon points="${P([0,k],[cx,cy],[0,100-k])}" fill="${mix(b,.14)}"/>`+
    `<polygon points="${P([100,k],[100,100-k],[cx,cy])}" fill="${mix(b,-.14)}"/>`+
    `<polygon points="${P([0,100-k],[cx,cy],[100,100-k],[100-k,100],[k,100])}" fill="${mix(b,-.27)}"/>`+
    `<polygon points="${P([cx-20,cy-18],[cx+22,cy-16],[cx+20,cy+20],[cx-18,cy+22])}" fill="${b}" opacity=".55"/></svg>`}

/* the numbers of a pile: n/2 pairs, every kind of pair before any repeats */
function pairVals(n){const out=[];let bag=[];while(out.length<n){if(!bag.length)bag=shuffle(PAIRS);const [a,b]=bag.pop();out.push(a,b)}return out}
const key=(c,r)=>c+','+r;
const occMap=(list,skip)=>{const o={};list.forEach(b=>{if(b.id!==skip)o[key(b.c,b.r)]=b});return o};
/* a hint: the two twins that are closest, and a straight path (one turn at most) that brings one next to the other */
function findMove(list){let best=null;
  for(const a of list)for(const b of list){if(a===b||a.v+b.v!==10)continue;
    for(const [dc,dr] of DIRS){const c=b.c+dc,r=b.r+dr;if(c<0||c>=GC||r<0||r>=ROWS||(c===a.c&&r===a.r))continue;
      const d=Math.abs(c-a.c)+Math.abs(r-a.r);
      if(!best||d<best.d)best={d,id:a.id,v:a.v,path:[[a.c,a.r],...(a.c!==c&&a.r!==r?[[c,a.r]]:[]),[c,r]]}}}
  return best}
/* twins that touch (each rock in one pair at most) */
function findPairs(list){const occ=occMap(list),used={},out=[];
  [...list].sort((a,b)=>a.r-b.r||a.c-b.c).forEach(b=>{if(used[b.id])return;
    for(const [dc,dr] of DIRS){const o=occ[key(b.c+dc,b.r+dr)];if(o&&!used[o.id]&&o.v+b.v===10){used[b.id]=used[o.id]=1;out.push([b,o]);break}}});
  return out}
/* gravity: every column falls together → {list, falls: id → rows fallen} */
function gravity(list){const falls={},out=[];
  for(let c=0;c<GC;c++){list.filter(b=>b.c===c).sort((a,b)=>a.r-b.r).forEach((b,i)=>{if(b.r!==i)falls[b.id]=b.r-i;out.push({...b,r:i})})}
  return {list:out,falls}}
let idN=0;
/* a pile: column heights up to h, numbers placed so that no twins touch at the start */
function genPile(vals,h){
  const n=vals.length;let last=null;
  for(let tries=0;tries<80;tries++){
    const hs=Array(PCOLS).fill(0);hs[rand(0,PCOLS-1)]=Math.min(h,n);let left=n-Math.min(h,n);
    while(left>0){const c=rand(0,PCOLS-1);if(hs[c]<h){hs[c]++;left--}}
    const cells=[];hs.forEach((k,c)=>{for(let r=0;r<k;r++)cells.push([c,r])});
    const at={};cells.forEach(([c,r],i)=>at[key(c,r)]=i);
    const vs=shuffle(vals);
    const bad=i=>{const [c,r]=cells[i];let k=0;for(const [dc,dr] of DIRS){const j=at[key(c+dc,r+dr)];if(j!=null&&vs[i]+vs[j]===10)k++}return k};
    let T=0;for(let i=0;i<n;i++)T+=bad(i);
    for(let it=0;T>0&&it<6000;it++){const i=rand(0,n-1),j=rand(0,n-1);if(vs[i]===vs[j])continue;
      const b0=bad(i)+bad(j);[vs[i],vs[j]]=[vs[j],vs[i]];const b1=bad(i)+bad(j);
      if(b1>b0||(b1===b0&&Math.random()<.6))[vs[i],vs[j]]=[vs[j],vs[i]];else{T=0;for(let k=0;k<n;k++)T+=bad(k)}}
    const list=cells.map(([c,r],i)=>({id:'b'+(++idN),v:vs[i],c,r}));last=list;
    if(T===0)return list;
  }
  return last;
}

/* ---------- sound: all made in code (Web Audio) ---------- */
let heVoice=null, actx=null, soundOn=true, noiseBuf=null;
const hasTTS=typeof window!=='undefined'&&'speechSynthesis' in window;
function loadVoice(){try{const hv=speechSynthesis.getVoices().filter(v=>/^(he|iw)/i.test(v.lang));heVoice=hv.find(v=>/hila|carmit|female|woman/i.test(v.name))||hv.find(v=>!/avri|asaf|male/i.test(v.name))||hv[0]||null}catch(e){}}
if(hasTTS){loadVoice();try{speechSynthesis.onvoiceschanged=loadVoice}catch(e){}}
function audio(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume()}catch(e){}}
function tone(f,d=.15,type='triangle',vol=.12,slideTo,delay=0){
  if(!actx||!soundOn)return;
  try{const t=actx.currentTime+delay,o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
    if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,t+d);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g).connect(actx.destination);o.start(t);o.stop(t+d+.02)}catch(e){}
}
function noise(d,{type='bandpass',f=800,f2,q=1,vol=.25}={}){
  if(!actx||!soundOn)return;
  try{if(!noiseBuf){noiseBuf=actx.createBuffer(1,actx.sampleRate,actx.sampleRate);const ch=noiseBuf.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=Math.random()*2-1}
    const t=actx.currentTime,s=actx.createBufferSource(),fl=actx.createBiquadFilter(),g=actx.createGain();
    s.buffer=noiseBuf;fl.type=type;fl.Q.value=q;fl.frequency.setValueAtTime(f,t);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+d);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
    s.connect(fl).connect(g).connect(actx.destination);s.start(t);s.stop(t+d)}catch(e){}
}
function monsterVoice(d=1,vol=1,pitch=1){
  if(!actx||!soundOn)return;
  try{const t=actx.currentTime,o=actx.createOscillator(),lfo=actx.createOscillator(),lg=actx.createGain(),out=actx.createGain();
    o.type='sawtooth';o.frequency.setValueAtTime(110*pitch,t);o.frequency.linearRampToValueAtTime(190*pitch,t+d*.25);o.frequency.exponentialRampToValueAtTime(70*pitch,t+d);
    lfo.frequency.value=7;lg.gain.value=9*pitch;lfo.connect(lg).connect(o.frequency);
    out.gain.setValueAtTime(.0001,t);out.gain.exponentialRampToValueAtTime(.32*vol,t+.08);out.gain.setValueAtTime(.32*vol,t+d*.55);out.gain.exponentialRampToValueAtTime(.0001,t+d);
    [[700,5,1],[1150,6,.7],[2600,8,.25]].forEach(([f,q,g])=>{const bp=actx.createBiquadFilter(),gg=actx.createGain();bp.type='bandpass';bp.frequency.value=f;bp.Q.value=q;gg.gain.value=g;o.connect(bp).connect(gg).connect(out)});
    out.connect(actx.destination);o.start(t);lfo.start(t);o.stop(t+d+.05);lfo.stop(t+d+.05);noise(d*.9,{f:900,f2:400,q:1.2,vol:.16*vol})}catch(e){}
}
const PENTA=[0,2,4,7,9,12,14,16,19,21];
const note=st=>523.25*Math.pow(2,st/12);
let lastLand=0;
const sfx={
  pick(){tone(620,.05,'sine',.06)},
  tick(){tone(1100,.025,'sine',.025)},
  drop(){tone(330,.06,'sine',.06)},
  land(){const now=performance.now();if(now-lastLand<70)return;lastLand=now;tone(170,.08,'sine',.1,95);noise(.05,{type:'lowpass',f:700,vol:.12})},
  thud(){noise(.14,{type:'lowpass',f:500,vol:.4});tone(110,.18,'sine',.18,60)},
  /* a pair pops: a soft "bloop" up, a hiss of dust and a bell; the higher the combo, the higher the bell */
  pop(level=1){const f=note(PENTA[Math.min(level-1,PENTA.length-1)]);
    tone(f*.5,.16,'sine',.18,f*1.2);noise(.16,{type:'highpass',f:2600,f2:6000,vol:.06});
    tone(f,.35,'sine',.09,null,.07);tone(f*1.5,.4,'sine',.05,null,.1);tone(f*2,.3,'triangle',.03,null,.13)},
  combo(level){for(let i=0;i<=Math.min(level,6);i++)tone(note(PENTA[i+2]),.22,'triangle',.07,null,.12+i*.07);tone(note(PENTA[Math.min(level+4,9)]),.6,'sine',.07,null,.2+level*.07)},
  growl(v=1){monsterVoice(.75,.55*v,1)},
  roar(){monsterVoice(1.25,1,1.25)},
  splash(){noise(.7,{type:'lowpass',f:3200,f2:300,vol:.35})},
  win(){[523,659,784,1047].forEach((f,j)=>tone(f,.2,'triangle',.12,null,j*.11))},
  coin(){tone(988,.08,'square',.05);tone(1319,.25,'square',.05,null,.08)},
  swap(){tone(480,.05,'sine',.04,620)},
  step(i){tone(i%2?330:294,.05,'triangle',.05)},
  jackpot(){tone(330,.12,'square',.05);tone(660,.1,'square',.05,null,.07);for(let i=0;i<7;i++){const f=1600+Math.random()*900;tone(f,.09,'triangle',.08,null,.14+i*.07);tone(f*1.5,.12,'sine',.06,null,.19+i*.07)}},
};

/* ---------- particles (light: plain divs + Web Animations, capped) ---------- */
let livePts=0;
function burst(x0,y0,colors,n=12){
  n=Math.min(n,Math.max(0,150-livePts));
  for(let i=0;i<n;i++){
    const p=document.createElement('div');p.className='pt';const s=5+Math.random()*9;

  /* ---------- drag: a rock follows the finger along a row or a column (no diagonal), smoothly. It can pass other rocks:

  const cellXY=e=>{const bb=boardRef.current.getBoundingClientRect(),g=R.current.geo;return {x:(e.clientX-bb.left-g.gx)/g.cell-.5,y:(g.baseY-(e.clientY-bb.top))/g.cell-.5}};
  const twinNear=(c,r,v,skip)=>{for(const [dc,dr] of DIRS){const o=R.current.blocks.find(b=>b.id!==skip&&b.c===c+dc&&b.r===r+dr);if(o&&o.v+v===10)return o}return null};
  function dragTo(d,tx,ty){
    tx=Math.max(0,Math.min(GC-1,tx));ty=Math.max(0,Math.min(ROWS-1,ty));
    // on a row or on a column: near a cell's centre it may turn, between centres it keeps its line
    const nx=Math.round(d.x),ny=Math.round(d.y),SN=.34;
    const horiz=Math.abs(d.x-nx)<SN&&Math.abs(d.y-ny)<SN?Math.abs(tx-d.x)>=Math.abs(ty-d.y):Math.abs(d.y-ny)<Math.abs(d.x-nx);
    if(horiz){d.y=ny;d.x=tx}else{d.x=nx;d.y=ty}

    const goal=[Math.round(d.x),Math.round(d.y)];
    while(d.cell[0]!==goal[0]||d.cell[1]!==goal[1]){
      const [c,r]=d.cell,nc=goal[0]!==c?[c+Math.sign(goal[0]-c),r]:[c,r+Math.sign(goal[1]-r)];

  }

    if(el)el.style.transform=`translate(${((d.vx-d.c0)*cell).toFixed(1)}px,${(-(d.vy-d.r0)*cell).toFixed(1)}px)`;

  async function endDrag(hit){

  /* twins that touch after a fall pop too: every step of the chain is a combo (more coins) */
  async function chain(level,alive){

  async function popPairs(pairs,level,alive,byChild){

  }
  const doneReq=useRef(null);
  function finish(){if(!doneReq.current)doneReq.current=KP.complete({rounds:R.current.rounds.length,coins,stars:starCount(stats.current.caught),caught:stats.current.caught,pairs:stats.current.pairs,combos:stats.current.combos,bestCombo:stats.current.best});return doneReq.current}
  async function goNext(){if(leaving)return;setLeaving(true);hush();await finish();KP.next()}
  function restart(){doneReq.current=null;hush();clearTimeout(hintT.current);setDemo(null);setEndStage(null);setLidOpen(false);setCoins(0);setBumpN(0);
    setHero({walk:false,vis:false,cheer:false,win:false});scaredRef.current=false;setScared(false);start()}
  useEffect(()=>{if(endStage!=='done')return;const n=starCount(stats.current.caught);for(let i=0;i<3;i++)setTimeout(()=>i<n?tone(784+i*196,.3,'sine',.12):tone(260,.15,'triangle',.05),150+i*350)},[endStage]);
  function toggleSound(){const v=!sound;setSound(v);soundOn=v;if(!v&&hasTTS)try{speechSynthesis.cancel()}catch(e){}}
  useEffect(()=>()=>{hush();clearTimeout(hintT.current)},[]);
  useEffect(()=>{if(KP.claimCorner)KP.claimCorner()},[]);
  useEffect(()=>{if(KP.onResume)KP.onResume(()=>{if(R.current.round&&R.current.round.tut&&R.current.phase==='play'&&lastSay.current&&!dragRef.current)say(lastSay.current)})},[]);
  useEffect(()=>{start()},[]);
  useEffect(()=>{if(/[?&]debug=1/.test(location.search))window.__twins={caught:()=>caughtRef.current(),R}},[]);   // tests only

  /* ---------- render ---------- */
  const n=rounds.length;
  const Side=(<div className="side">
    {KP.embedded?<span style={{width:44,height:44,flex:'none'}} aria-hidden="true"/>:<button className="iconbtn" title="יציאה" aria-label="יציאה" onClick={()=>{hush();KP.exit()}}>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>}
    <button className="iconbtn" title="קול" aria-label="קול" onClick={toggleSound}><SpeakerIcon on={sound}/></button></div>);
  const Header=(<header><div className="treasure" style={screen==='end'?{visibility:'hidden'}:null}>
    <div className="pwrap"><div className="pbar"><div className="pfill" style={{width:(n?progress/n*100:0)+'%'}}/></div>
      <span className={'pcount'+(bumpN?' bump':'')} key={'k'+bumpN} dir="ltr">{coins}</span></div>
    <Chest key={'c'+bumpN} innerRef={chestRef} bump={bumpN>0} s={W<560?42:56}/></div></header>);
  const ah=W<560?54:66;
  const Talk=(<div className="talk"><div className="spawn" ref={alienRef}><Alien h={ah} input={alienInput}/></div>
    <div className="bubble" aria-live="polite"><div className="txt" key={capN}>{caption||'…'}</div></div></div>);

  // the land: one island per stretch (each its biome), joined edge to edge; the chest waits on the last (ice)
  const strips=[];if(n){let x0=-W*2;for(let k=0;k<=n;k++){const x1=k<n?P[k+1]-D/2:P[n]+W*3;strips.push({k,x0,x1});x0=x1}}
  const decor=[];
  strips.forEach(s=>{const rr=rng(world.seed*7+s.k*13+5),th=(PAL_BY[world.biomes[Math.min(s.k,world.biomes.length-1)]]||PAL_BY.meadow).decor;
    const keepOut=[[P[s.k]-hw-50,P[s.k]+GC*cell+30]];   // never behind the pile or the hero (the background does not compete)
    for(let j=0,t=0;j<3&&t<20;t++){const x=Math.round(s.x0+40+rr()*(s.x1-s.x0-80));if(keepOut.some(([a,b])=>x>a-60&&x<b))continue;
      const spec=th[Math.floor(rr()*th.length)];decor.push({key:s.k+'-'+j,spec,h:Math.round(hs*spec.size*(.8+rr()*.4)),x,tall:spec.tall});j++}});
  const pal=k=>PAL_BY[world.biomes[Math.min(k,world.biomes.length-1)]]||PAL_BY.meadow;
  const wstyle={left:0,top:0,width:(P[n]||W)+W*4,height:H,transform:`translateX(${-offset}px)`,transition:walkDur?`transform ${walkDur}s linear`:'none'};

  const Board=(<div className="board" ref={boardRef} onScroll={e=>{e.currentTarget.scrollLeft=0;e.currentTarget.scrollTop=0}}>
    <div className="world" style={wstyle}>
      {strips.map(s=><div key={'g'+s.k} style={{left:s.x0,top:groundY,width:s.x1-s.x0,height:groundH}}><Cliff w={Math.round(s.x1-s.x0)} h={groundH} seed={world.seed+s.k+1} edgeL={s.k===0} edgeR={s.k===n} pal={pal(s.k)}/></div>)}
      {decor.filter(d=>d.tall).map(d=><div key={d.key} style={{left:d.x,top:groundY+2-d.h}}><Decor spec={d.spec} h={d.h} seed={Math.abs(d.x>>3)}/></div>)}
      {n>0&&<button ref={bigChestRef} className={'wchest'+(endStage==='chest'?' idle':'')} aria-label="לפתוח את תיבת האוצר" tabIndex={-1}
        style={{left:P[n],top:groundY-Math.round(cs*CHEST_VB[3]/CHEST_VB[2])+8,width:cs}} onClick={()=>{if(screen==='end')tapChest()}}>
        <Chest open={lidOpen} s={cs}/></button>}
    </div>
    <div className="hero" ref={heroRef} style={{left:heroX,top:baseY-hs,width:hw,height:hs,opacity:hero.vis?1:0}}>
      <div className={'in'+(hero.vis?' show':'')} key={hero.vis?'v':'h'}><div className={hero.win?'winhop':''}><Hero s={hs} input={heroInput}/></div></div></div>
    {screen==='play'&&<div ref={monRef} className="monster" style={{left:0,top:baseY-mh,width:mw,height:mh}}><Monster w={mw} h={mh} st={monArt}/></div>}
    <div className="world front" style={wstyle}>
      {decor.filter(d=>!d.tall).map(d=><div key={d.key} style={{left:d.x,top:baseY+4-d.h}}><Decor spec={d.spec} h={d.h} seed={Math.abs(d.x>>3)}/></div>)}
    </div>
    <div className={'pile'+(jolt?' shake':'')} style={{width:W,height:H}}>
      {blocks.map(b=><Block key={b.id} b={b} cell={cell} x={cx(b.c)} y={cy(b.r)} dragging={drag===b.id} refFn={el=>{if(el)blkEls.current[b.id]=el;else delete blkEls.current[b.id]}}
        onDown={e=>blkDown(e,b)} onMove={blkMove} onUp={blkUp}/>)}
    </div>
    {fxs.map(f=>f.k==='ten'?<div key={f.id} className="ten" style={{left:f.x,top:f.y,fontSize:Math.round(cell*1.25)}} onAnimationEnd={()=>setFxs(l=>l.filter(x=>x.id!==f.id))}>10</div>
      :<div key={f.id} className="combo" style={{left:f.x,top:f.y,fontSize:Math.round(Math.max(20,cell*.55))}} onAnimationEnd={()=>setFxs(l=>l.filter(x=>x.id!==f.id))}>{f.t}</div>)}
    {demo&&!demo.tap&&<HandDemo key={JSON.stringify(demo.pts)} pts={demo.pts} cell={cell} v={demo.v}/>}
    {demo&&demo.tap&&<TapHand x={demo.x} y={demo.y}/>}
  </div>);

  let overlay=null;
  if(endStage==='done'){const stars=starCount(stats.current.caught);
    overlay=(<div className="center endscreen" style={{justifyContent:'flex-start',paddingTop:'max(60px,11dvh)'}}>
      <div className="stars" dir="ltr">{[0,1,2].map(i=><div key={i} className="star" style={{animationDelay:.15+i*.35+'s'}}><StarIcon on={i<stars}/></div>)}</div>
      <div className="rise" style={{animationDelay:'1.1s'}}><div ref={KP.coinBadge}/></div>
      <div className="endbtns rise" style={{animationDelay:'1.3s'}}>
        <button className="endbtn again" onClick={restart} aria-label="להתחיל מחדש" title="להתחיל מחדש">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2.8" strokeLinecap="round" strokeLinejoin="round"><path d="M4 12a8 8 0 1 0 2.5-5.8"/><path d="M4 4v5h5"/></svg></button>
        <button className="endbtn next" onClick={goNext} disabled={leaving} aria-label="המשך" title="המשך">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2.8" strokeLinecap="round" strokeLinejoin="round"><path d="M20 12H4M10 6l-6 6 6 6"/></svg></button>
      </div></div>);
  }
  return(<>
    <LowPolyBG/><div className="dim"/>
    <div className={'app'+(quake?' quake':'')} onPointerDownCapture={()=>audio()}>
      {Side}
      <div className="top">{screen==='play'&&Talk}{Header}</div>
      {Board}{overlay}
    </div></>);
}
function TapHand({x,y}){
  const ref=useRef(null);
  useEffect(()=>{const a=ref.current.animate([{transform:`translate(${x-14}px,${y+18}px)`,opacity:1},{transform:`translate(${x-14}px,${y}px) scale(.92)`,opacity:1,offset:.45},
    {transform:`translate(${x-14}px,${y+18}px)`,opacity:1}],{duration:1000,iterations:Infinity,easing:'ease-in-out'});return()=>a.cancel()},[x,y]);
  return <div ref={ref} className="hand"><HandIcon/></div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
