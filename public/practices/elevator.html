<style>
:root{--ink:#33373b;--night:#06070d;--panel:#12141f;--gold:#FFD65A;--ok:#1FA36A;--bad:#EF5C55;--sky:#2EB6EA}
*{box-sizing:border-box;margin:0}
html,body{overflow:hidden;height:100%}
body{font-family:Rubik,system-ui,sans-serif;color:var(--ink);background:var(--night);-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:0;color:inherit}
button:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
.app{position:relative;display:flex;flex-direction:column;height:100vh;height:100dvh;user-select:none;-webkit-user-select:none}
.scene{position:relative;flex:1;min-height:0;overflow:hidden}
.scene>*{position:absolute}
/* the city and the tower lose their color; every solved case gives some of it back */
.gray{transition:filter 1.2s ease;pointer-events:none}
.bg{inset:0;width:100%;height:100%;display:block}
.blinds{inset:-20%;pointer-events:none;opacity:.5;background:repeating-linear-gradient(172deg,transparent 0 34px,rgba(235,232,255,.06) 38px 52px,transparent 58px 72px);-webkit-mask-image:radial-gradient(circle at 24% 34%,#000 0,transparent 46%);mask-image:radial-gradient(circle at 24% 34%,#000 0,transparent 46%)}
.vig{inset:0;pointer-events:none;z-index:8;background:radial-gradient(ellipse at 50% 48%,transparent 52%,rgba(6,8,24,.62) 100%)}
.side{left:10px;top:10px;direction:ltr;display:flex;gap:6px;z-index:90}
.iconbtn{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#176fbe;background:#F4F8FF;box-shadow:0 4px 0 rgba(0,0,0,.28)}
.iconbtn.off{color:#8b95a5}

.slab.pop{animation:slabIn .3s cubic-bezier(.3,1.5,.5,1) both}
@keyframes slabIn{from{transform:translateY(-30px) scale(.7,1.2);opacity:0}}
.plate{display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;background:rgba(13,16,40,.62);border-radius:8px;z-index:3;transition:transform .25s,background .25s,color .25s;pointer-events:none;animation:friendIn .4s cubic-bezier(.3,1.7,.5,1)}
.plate.cur{background:var(--gold);color:#3a2b00;transform:scale(1.22);box-shadow:0 0 14px rgba(255,214,90,.7)}
.glow{border-radius:50%;pointer-events:none;z-index:2;background:radial-gradient(circle,rgba(255,226,130,.95) 0 22%,rgba(255,214,90,.4) 45%,transparent 70%);mix-blend-mode:screen}
.bulb{width:10px;height:10px;border-radius:50%;background:#ff7d6e;box-shadow:0 0 12px 4px rgba(255,110,90,.8);animation:blink 1.8s steps(1) infinite;z-index:3;pointer-events:none}
@keyframes blink{0%,100%{opacity:1}55%{opacity:.1}70%{opacity:.8}78%{opacity:.1}}

.boardx{z-index:6}
.boardx>svg{position:absolute;left:0;top:0}
.pin{position:absolute;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff9d90,#d63a3a 60%,#8f1c22);box-shadow:1px 3px 2px rgba(0,0,0,.4)}
.paper{position:absolute;background:#fbf6e6;border-radius:3px;box-shadow:0 3px 0 rgba(0,0,0,.28);display:flex;align-items:center;justify-content:center;direction:ltr;font-weight:700;color:#2b2f33;transform:rotate(-1deg)}
.paper .n{background:none;font-weight:700;font-size:inherit;line-height:1;padding:0;position:relative;display:flex;align-items:center;justify-content:center;border-radius:50%;transition:opacity .3s,transform .3s,color .3s}
.paper .n.ask{animation:ring 1.1s infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(46,182,234,.75)}70%,100%{box-shadow:0 0 0 11px rgba(46,182,234,0)}}
.paper .n.lit{color:#b06f00;transform:scale(1.18);background:radial-gradient(circle,rgba(255,226,120,.95),rgba(255,226,120,.25) 60%,transparent 72%)}
.paper .dim{opacity:.28}
.paper .s{padding:0 .12em;transition:opacity .3s}
.paper .res{color:#9aa3ad;min-width:.9em;text-align:center}
.paper .res.bad{color:var(--bad);animation:shake .4s}
.paper.blank>*{opacity:0!important;transition:none!important}
.pol.sil svg{filter:brightness(0);opacity:.7}
.pol.show{animation:qm 1s ease-in-out 3}
.paper .res.done{color:var(--ok);animation:mpop .5s}
@keyframes mpop{40%{transform:scale(1.5)}}
.pols{position:absolute;display:flex;justify-content:space-between;direction:rtl}
.pol{background:#fbf6e6;border-radius:2px;display:flex;align-items:center;justify-content:center;color:#b8b09a;font-weight:700;box-shadow:0 2px 0 rgba(0,0,0,.3);overflow:hidden}
.pol.now{outline:2px solid var(--gold)}
.pol.in svg{animation:mpop .5s}

.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.beam{inset:0;width:100%;height:100%;pointer-events:none;z-index:7;transition:opacity .3s}
.lift,.herox{left:0;top:0;will-change:transform;pointer-events:none}
.herox .hop{animation:winHop .5s cubic-bezier(.3,0,.5,1) infinite alternate}
@keyframes winHop{from{transform:translateY(0) scale(1.04,.96)}to{transform:translateY(-14%)}}
.qm{position:absolute;font-weight:700;color:var(--gold);text-shadow:0 2px 0 rgba(0,0,0,.5);animation:qm 1.6s ease-in-out infinite;pointer-events:none}
@keyframes qm{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-8px) rotate(8deg)}}
.friend{z-index:6;pointer-events:none;transform-origin:50% 100%;animation:friendIn .6s cubic-bezier(.3,1.7,.5,1) both}
@keyframes friendIn{from{transform:scale(0)}}
.plus1{z-index:10;font-weight:700;color:var(--gold);text-shadow:0 2px 0 rgba(0,0,0,.55);pointer-events:none;animation:plus 1.1s both;direction:ltr}
@keyframes plus{0%{opacity:0;transform:translateY(14px) scale(.6)}25%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0;transform:translateY(-22px)}}
.stamp{z-index:30;pointer-events:none;border:5px double currentColor;color:#ff6a5e;background:rgba(20,16,36,.55);border-radius:10px;padding:8px 18px;font-weight:700;white-space:nowrap;transform:translate(-50%,-50%) rotate(-12deg);animation:stamp .5s cubic-bezier(.3,1.5,.5,1) both}
@keyframes stamp{from{transform:translate(-50%,-50%) rotate(-30deg) scale(3);opacity:0}60%{transform:translate(-50%,-50%) rotate(-10deg) scale(.92);opacity:1}}

/* the panel under the stage: what is said, and what can be pressed now */
.panel{flex:none;position:relative;z-index:40;background:linear-gradient(180deg,var(--panel),#0a0b12);padding:10px 12px max(12px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:9px;align-items:center}
.say{position:relative;width:100%;max-width:820px;background:#fff;border-radius:14px;padding:8px 14px;font-size:17px;line-height:1.3;font-weight:500;min-height:60px;display:flex;align-items:center;gap:10px;text-align:right;cursor:pointer}
.say .tail{position:absolute;top:-11px;border:11px solid transparent;border-bottom-color:#fff;border-top:0;margin-left:-11px;transition:left .25s}
.say .who{flex:none;font-size:13px;font-weight:700;color:#7a5a2e;background:#f4e6cb;border-radius:8px;padding:3px 8px}
.say .who.kid{color:#8f1c22;background:#ffdcd7}
.say .txt{animation:txtIn .3s both}
@keyframes txtIn{from{opacity:0;transform:translateY(6px)}}
.acts{width:100%;min-height:106px;display:flex;align-items:center;justify-content:center;gap:12px;direction:ltr;flex-wrap:wrap}
.big{min-width:84px;height:72px;padding:0 16px;border-radius:18px;font-size:38px;font-weight:700;background:#fff;box-shadow:0 6px 0 rgba(0,0,0,.35);transition:transform .1s}
.big:active{transform:translateY(4px)}
.big.good{background:var(--ok);color:#fff}
.skipb{height:46px;padding:0 22px;border-radius:23px;background:rgba(255,255,255,.14);color:#fff;font-size:17px;font-weight:500;direction:rtl}
.pips{display:flex;gap:14px;align-items:center}
.pip{width:34px;height:34px;border-radius:50%;border:4px dashed rgba(255,255,255,.55);color:transparent;font-weight:700;font-size:21px;font-style:normal;display:flex;align-items:center;justify-content:center}
.pip.f{background:var(--gold);border:0;color:#3a2b00;animation:mpop .35s}
.pip.f.over{background:var(--bad);color:#fff}
@media(min-width:700px){.say{font-size:20px;padding:10px 18px}.acts{min-height:92px}}
@media(min-width:700px) and (max-height:700px){.say{font-size:18px;min-height:50px;padding:6px 16px}.acts{min-height:80px}.big{height:64px}}
/* a low wide window (phone on its side): the panel sits beside the stage */
@media(max-height:480px) and (min-aspect-ratio:5/4){.app{flex-direction:row}.panel{width:44%;justify-content:center;order:0}.scene{order:1}.say .tail{display:none}.acts{min-height:0}.big{height:60px}.big{min-width:68px}}

.wchest{background:none;padding:0;line-height:0;filter:drop-shadow(0 6px 0 rgba(0,0,0,.3))}
.wchest.idle .chest{animation:chestBreath 1.1s ease-in-out infinite;transform-origin:50% 100%}
@keyframes chestBreath{0%,100%{transform:scale(1)}50%{transform:scale(1.13)}}
.hand{position:absolute;left:0;top:0;z-index:70;pointer-events:none;opacity:0;filter:drop-shadow(0 4px 4px rgba(0,0,0,.4))}
.pt{position:fixed;pointer-events:none;z-index:999;will-change:transform,opacity}
.coinp{position:fixed;left:0;top:0;pointer-events:none;z-index:1001;will-change:transform,opacity;line-height:0}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:20px;z-index:80}
.endscreen{background:rgba(16,19,46,.62);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.stars{display:flex;gap:14px;align-items:flex-end}
.star{width:min(26vw,120px);aspect-ratio:100/96;animation:starIn .55s cubic-bezier(.3,1.6,.5,1) both}
.star:nth-child(2){width:min(32vw,150px)}
@keyframes starIn{from{transform:scale(0) rotate(-40deg);opacity:0}}
.rise{animation:rise .5s ease-out both}
@keyframes rise{from{transform:translateY(24px);opacity:0}}
.endbtns{position:absolute;left:0;right:0;bottom:max(22px,5dvh);display:flex;justify-content:center;gap:clamp(56px,22vw,220px)}
/* end buttons: bevelled tiles like the rocks of ״תאומי עשר״ (one shape for every game), a white icon on the face */
.endbtn{width:92px;height:92px;display:flex;align-items:center;justify-content:center;background:none center/100% 100% no-repeat;filter:drop-shadow(0 6px 0 rgba(20,10,40,.28));transition:transform .12s}
.endbtn svg{width:40px;height:40px}
.endbtn:active{transform:scale(.93)}
.endbtn:disabled{opacity:.6}
