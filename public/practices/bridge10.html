<style>
:root{--ink:#33373b;--blue:#3D6FE0;--kblue:#176fbe;--coral:#FF6450;--yellow:#FFC531;--teal:#1FB5A2;--purple:#8E5CF0;--panel:#FFF7E6}
*{box-sizing:border-box;margin:0}
html,body{overflow:hidden;height:100%}
body{font-family:Fredoka,system-ui,sans-serif;color:var(--ink);background:#CDEBFA;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:0}
.bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block;filter:saturate(1.15) brightness(.86) contrast(.94)}   /* the backdrop a little darker and richer, so the play layer stands out */
.app{position:relative;z-index:1;display:flex;flex-direction:column;height:100vh;height:100dvh}
.top{flex:none;width:100%;max-width:960px;margin:0 auto;padding:10px 14px 0 66px;display:flex;flex-direction:row;align-items:center;gap:10px;min-height:66px;position:relative;z-index:8;pointer-events:none}
.top>*{pointer-events:auto}

/* header (same frame as the other practices) */
header{display:flex;justify-content:center;align-items:center;flex:none;margin-inline-start:auto}
.side{position:absolute;left:10px;top:10px;display:flex;flex-direction:column;gap:8px;z-index:90}
.side .iconbtn{display:flex;align-items:center;justify-content:center}
.dim{position:fixed;inset:0;z-index:0;background:linear-gradient(180deg,transparent 0 38%,rgba(18,42,66,.2) 62%);pointer-events:none}
.lidopen{transform-origin:40px 30px;transform-box:view-box;animation:lidUp .45s cubic-bezier(.3,1.5,.5,1) both}
@keyframes lidUp{from{transform:scaleY(.15)}}
.title{justify-self:start;min-width:0;max-width:100%;font-weight:700;font-size:16px;display:flex;align-items:center;gap:6px;color:var(--kblue);background:rgba(255,255,255,.88);padding:6px 14px 6px 12px;clip-path:polygon(0 0,100% 0,calc(100% - 12px) 100%,0 100%)}

.tools{display:flex;gap:6px;justify-content:flex-end}
@media(max-width:419px){.title span{display:none}.title{padding:6px 16px 6px 8px}}
@media(min-width:700px){header{gap:10px}.title{font-size:19px;gap:8px;padding:6px 14px 6px 16px}.tools{gap:8px}}
.iconbtn{width:44px;height:44px;border-radius:50%;font-size:19px;color:var(--kblue);background:#F4F8FF;box-shadow:0 4px 0 rgba(23,111,190,.22)}
.iconbtn:disabled{opacity:.45}
.treasure{display:flex;align-items:center;gap:8px;padding:4px 0}
.treasure .chest{width:48px;height:38px}
.pbar{width:64px;height:16px;border-radius:8px;background:rgba(23,111,190,.16);overflow:hidden}
@media(min-width:700px){.treasure{gap:10px;padding:4px 14px}.treasure .chest{width:62px;height:50px}.pbar{width:130px;height:18px;border-radius:9px}}
.pfill{height:100%;border-radius:9px;background:linear-gradient(180deg,#FFD95A 0 50%,#FFC531 50%);transition:width .8s cubic-bezier(.3,1.4,.5,1)}
.chest.bump{animation:bump .5s}
@keyframes bump{30%{transform:scale(1.25,.85)}60%{transform:scale(.9,1.15)}}

/* board: the whole lower screen. Ground + river at the bottom, edge to edge; planks lie anywhere above */
.board{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.board>*{position:absolute}
.world{will-change:transform;z-index:1}
/* the page is RTL; the world is drawn in px from the left (cliff graphics overflow their box), so it must be LTR */
.world,.far{direction:ltr}
.world>*{position:absolute}
.far{will-change:transform}
.wchest{background:none;padding:0;line-height:0;touch-action:manipulation;z-index:3;filter:drop-shadow(0 8px 0 rgba(23,80,130,.18))}
.wchest .chest{width:100%;height:auto;display:block}
.wchest.idle .chest{animation:chestCall 1.6s ease-in-out infinite}
.wchest:active .chest{transform:scale(.94)}
.monster{z-index:3;pointer-events:none;transform-origin:50% 100%}
.monster .ml{transform-origin:50% 0;transform-box:fill-box}
.monster.mwalk .ml1{animation:legA .38s infinite alternate}.monster.mwalk .ml2{animation:legA .38s infinite alternate-reverse}
.monster.mwalk .mbody{animation:mstep .19s infinite alternate}
@keyframes mstep{to{transform:translateY(-3px)}}
.monster .mpupil{transform:translate(var(--px,0px),var(--py,0px));transition:transform .16s ease-out}
.monster .mbrow{transform-box:fill-box;transform-origin:50% 50%;transform:translateY(var(--by,0px)) rotate(var(--br,0deg));transition:transform .22s ease-out}
.monster .marmL{transform-box:fill-box;transform-origin:100% 30%}
.monster.mwalk .marmL{animation:marm .38s ease-in-out infinite alternate}
@keyframes marm{from{transform:rotate(-12deg)}to{transform:rotate(14deg)}}
.monster .mspike{transform-box:fill-box;transform-origin:50% 100%;transition:transform .28s cubic-bezier(.3,1.6,.5,1)}
.quake{animation:quake .65s}
@keyframes quake{10%,50%,90%{transform:translate(-9px,3px)}30%,70%{transform:translate(9px,-3px)}100%{transform:none}}
.stars{display:flex;gap:14px;align-items:flex-end}
.star{width:min(26vw,120px);aspect-ratio:100/96;animation:starIn .55s cubic-bezier(.3,1.6,.5,1) both}
.star:nth-child(2){width:min(32vw,150px)}
@keyframes starIn{from{transform:scale(0) rotate(-40deg);opacity:0}}
.cta.arrow{padding:12px 44px;display:flex;align-items:center;justify-content:center}
.cloud{animation:cloudDrift linear infinite}
@keyframes cloudDrift{from{transform:translateX(-220px)}to{transform:translateX(1300px)}}
@media(prefers-reduced-motion:reduce){.cloud{animation:none}}
.rise{animation:rise .5s ease-out both}
@keyframes rise{from{transform:translateY(24px);opacity:0}}
.endscreen{background:rgba(255,255,255,.55);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);z-index:80}
.idle{animation:idleHop 4.5s ease-in-out infinite}
.winhop{animation:winHop .55s cubic-bezier(.3,0,.5,1) infinite alternate}
@keyframes winHop{from{transform:translateY(0) scale(1.04,.96)}to{transform:translateY(-22px)}}
@keyframes idleHop{0%,78%,100%{transform:translateY(0)}83%{transform:translateY(-16px)}88%{transform:translateY(0) scale(1.04,.96)}92%{transform:translateY(-7px)}96%{transform:translateY(0)}}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick .5s ease-in-out infinite alternate}
@keyframes flick{0%{transform:scale(1,1)}50%{transform:scale(.9,1.14)}100%{transform:scale(1.08,.86)}}
.ember{animation:ember 1.6s linear infinite}
@keyframes ember{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-70px);opacity:0}}
.spike{transform-box:fill-box;transform-origin:50% 100%;animation:spike 1.8s ease-in-out infinite alternate}
@keyframes spike{to{transform:translateY(-4px) scaleY(1.06)}}
.bub{transform-box:fill-box;transform-origin:center;animation:bub 2.4s ease-in infinite}
@keyframes bub{0%{transform:translateY(24px) scale(.3);opacity:0}30%{opacity:1}85%{transform:translateY(-6px) scale(1);opacity:1}100%{transform:translateY(-8px) scale(1.7);opacity:0}}
.mon{animation:mon 2.2s ease-in-out infinite alternate}
.mwalkpit{transform-box:view-box;transform-origin:0 0;animation:mwalkpit 7s linear infinite}
@keyframes mwalkpit{0%{transform:translateX(var(--x0)) scaleX(1)}49.9%{transform:translateX(var(--x1)) scaleX(1)}50%{transform:translateX(var(--x1)) scaleX(-1)}99.9%{transform:translateX(var(--x0)) scaleX(-1)}100%{transform:translateX(var(--x0)) scaleX(1)}}
.wf{animation:wf .77s step-end infinite}
@keyframes wf{0%{opacity:1}27%{opacity:0}100%{opacity:0}}
@media(prefers-reduced-motion:reduce){.mwalkpit,.wf{animation:none}.wf+.wf{opacity:0}}
@keyframes mon{to{transform:translateY(-14px)}}
.mon .meye{transform-box:fill-box;transform-origin:center;animation:blink 3.5s infinite}
.mon .mmouth{transform-box:fill-box;transform-origin:50% 0;animation:chomp 1.1s ease-in-out infinite alternate}
@keyframes chomp{from{transform:scaleY(.3)}to{transform:scaleY(1)}}
@media(prefers-reduced-motion:reduce){.flame,.ember,.spike,.bub,.mon,.mon .mmouth,.wchest.idle .chest,.idle{animation:none}}
.measure.hot::before{background:#FFE27A}.measure.hot .mnum{transform:scale(1.2);color:#fff;background:var(--coral)}
.hand{position:absolute;left:0;top:0;z-index:60;pointer-events:none;opacity:0;filter:drop-shadow(0 4px 4px rgba(23,80,130,.3))}
.demoline{position:absolute;left:0;top:0;width:5px;border-radius:3px;background:#fff;transform-origin:top;z-index:59;pointer-events:none;opacity:0;box-shadow:0 0 8px #fff}
.ghost{position:absolute;left:0;top:0;z-index:58;pointer-events:none;opacity:0}
.measure{display:flex;align-items:center;justify-content:center;transition:width .9s cubic-bezier(.5,0,.3,1),opacity .3s;pointer-events:none}
.measure::before{content:"";position:absolute;left:0;right:0;top:50%;height:3px;margin-top:-1.5px;background:#fff;border-radius:2px}
.mnum{transition:transform .2s,background .2s,color .2s;position:relative;z-index:1;min-width:44px;height:36px;padding:0 10px;border-radius:18px;background:#fff;color:var(--coral);font-weight:700;font-size:24px;line-height:36px;text-align:center;box-shadow:0 4px 0 rgba(23,111,190,.22)}
.mnum.pop{animation:mpop .6s}
@keyframes mpop{40%{transform:scale(1.35)}}
.hero{z-index:4;pointer-events:none}
.world.front{z-index:5;pointer-events:none}
.hero .in.show{animation:heroIn .6s both}
@keyframes heroIn{from{transform:translateY(-140px)}60%{transform:translateY(0) scale(1.06,.92)}to{transform:none}}
.coin2{z-index:2;animation:bob 1.4s ease-in-out infinite alternate;pointer-events:none}
@keyframes bob{to{transform:translateY(-8px)}}
.wave{animation:wave 3s ease-in-out infinite alternate}
@keyframes wave{to{transform:translateX(14px)}}

/* number planks: flat, one colour per original plank, a line on every unit */
.pk{z-index:5;touch-action:none;cursor:grab}
.pk.dragging{cursor:grabbing;z-index:40}
.pk.home{transition:left .3s cubic-bezier(.3,1.3,.5,1),top .3s cubic-bezier(.3,1.3,.5,1)}
.plank{position:relative;display:flex;height:var(--T);direction:ltr;border-radius:calc(var(--T)*.17);overflow:visible}
.seg{position:relative;height:100%;background:var(--m)}
.seg:first-of-type{border-radius:calc(var(--T)*.17) 0 0 calc(var(--T)*.17)}.seg:last-of-type{border-radius:0 calc(var(--T)*.17) calc(var(--T)*.17) 0}.seg:only-of-type{border-radius:calc(var(--T)*.17)}
.seg+.seg{box-shadow:inset 3px 0 0 #fff}
.pnum{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.18);pointer-events:none}
.psum{position:absolute;left:50%;bottom:calc(100% + 5px);transform:translateX(-50%);white-space:nowrap;font-weight:700;font-size:15px;color:var(--ink);background:rgba(255,255,255,.9);padding:1px 9px;border-radius:10px;pointer-events:none}
.pk.dragging .plank{filter:brightness(1.08);box-shadow:0 10px 18px rgba(23,80,130,.25)}
.alienlp{transform-origin:50% 100%}
.alienlp.talking{animation:mbob .32s infinite alternate}
.plank.hl{animation:hl .9s ease-in-out 3}
@keyframes hl{50%{transform:translateY(-6px) scale(1.06);filter:brightness(1.15)}}
.plank.merged{animation:merge .5s}
@keyframes merge{30%{transform:scale(1.12,.86)}65%{transform:scale(.96,1.06)}}
.plank.split{animation:split .45s}
@keyframes split{30%{transform:scale(.9,1.1) rotate(-3deg)}}
.plank.nope{animation:shake .4s}
.bridge{z-index:2}
.bridge.fit{animation:fitIn .45s cubic-bezier(.3,1.4,.5,1) both}
@keyframes fitIn{from{transform:translateY(-50px) scaleY(2.2)}}
.bridge.short{transform-origin:0 50%;animation:tipOff 1.3s cubic-bezier(.5,0,.8,.6) both}
@keyframes tipOff{0%{transform:translateY(-60px)}25%{transform:translateY(0)}45%{transform:rotate(14deg)}100%{transform:translate(20px,170px) rotate(40deg);opacity:.2}}
.bridge.long{animation:noFit 1.2s both}
@keyframes noFit{0%{transform:translateY(-60px)}25%{transform:translateY(0)}35%,55%,75%{transform:translateX(-8px)}45%,65%{transform:translateX(8px)}85%{transform:none;opacity:1}100%{transform:translateY(60px);opacity:0}}
.trail{left:0;top:0;pointer-events:none;z-index:50;overflow:visible}
.trail polyline{fill:none;stroke:#fff;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 4px rgba(255,255,255,.9))}
.trail.fade{animation:tfade .35s forwards}
@keyframes tfade{to{opacity:0}}
.reset{top:8px;left:12px;width:44px;height:44px;border-radius:50%;font-size:22px;color:var(--kblue);background:#fff;box-shadow:0 4px 0 rgba(23,111,190,.22);z-index:6}
.reset:disabled{opacity:.4}
.fall{animation:fall .8s cubic-bezier(.3,.9,.4,1) both}
@keyframes fall{0%{transform:translateY(-300px)}45%{transform:translateY(0) scale(1.08,.88)}62%{transform:translateY(-22px) scale(.97,1.04)}80%{transform:translateY(0)}90%{transform:translateY(-5px)}100%{transform:none}}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}

/* talk */
.talk{display:flex;align-items:center;gap:10px;flex:1 1 auto;min-width:0}
.bubble{flex:0 1 540px;min-width:0;background:#fff;padding:8px 14px;font-size:16px;line-height:1.35;font-weight:500;position:relative;box-shadow:0 5px 0 rgba(23,111,190,.18);border-radius:14px}
@media(max-width:559px){.bubble{font-size:13.5px;padding:6px 10px}.pbar{width:36px;height:12px}.treasure{gap:4px}.treasure .chest{width:40px;height:32px}
  .talk{gap:8px}.talk .spawn{margin-right:6px}}
@media(min-width:700px){.bubble{padding:12px 18px;font-size:19px}}
.bubble::before{content:"";position:absolute;right:-12px;top:50%;margin-top:-10px;border:10px solid transparent;border-left-color:#fff;border-right:0}
.bubble .txt{animation:txtIn .35s both}
@keyframes txtIn{from{opacity:0;transform:translateY(6px)}}
.spawn{position:relative;flex:none;display:flex;flex-direction:row;align-items:center;gap:8px;padding-bottom:4px}
.spawn::before{content:"";position:absolute;bottom:0;right:-6px;width:58px;height:18px;border-radius:50%;background:#9FD3F2;box-shadow:0 0 0 5px rgba(255,255,255,.7),0 0 0 11px rgba(255,255,255,.3)}
.spawn svg{position:relative}
.mascot{flex:none;overflow:visible}
.mascot .body{transform-origin:50% 100%;transform-box:fill-box}
.mascot.talking .body{animation:mbob .32s infinite alternate}
@keyframes mbob{to{transform:scale(1.03,.97) rotate(-2deg)}}
.mascot .mouth{transform-origin:center;transform-box:fill-box;transform:scaleY(.35)}
.mascot.talking .mouth{animation:mouth .16s infinite alternate}
@keyframes mouth{from{transform:scaleY(.25)}to{transform:scaleY(1.3)}}
.mascot .eye{transform-origin:center;transform-box:fill-box;animation:blink 4s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.mascot .arm{transform-origin:0 0;transform-box:fill-box}
.mascot.talking .arm{animation:arm .5s infinite alternate}
@keyframes arm{to{transform:rotate(-40deg)}}
.mascot .feather{transform-origin:0 100%;transform-box:fill-box;animation:feather 1.6s infinite alternate}
@keyframes feather{to{transform:rotate(12deg)}}
.mascot .leg,.mascot .armS,.mascot .armB{transform-origin:50% 0;transform-box:fill-box;transition:transform .2s}
.scaredpose .mascot .armS{transform:rotate(-72deg)}.scaredpose .mascot .armB{transform:rotate(-100deg)}
.scaredpose .mascot .body{animation:tremble .11s infinite alternate}
@keyframes tremble{from{transform:translateX(-.7px)}to{transform:translateX(.7px)}}
.mascot.walking .l1{animation:legA .26s infinite alternate}
.mascot.walking .l2,.mascot.walking .armS{animation:legA .26s infinite alternate-reverse}
@keyframes legA{from{transform:rotate(28deg)}to{transform:rotate(-28deg)}}
.mascot.walking .body{animation:wbob .13s infinite alternate}
@keyframes wbob{to{transform:translateY(-1.5px)}}
.cheer .body{animation:cheer .35s 3 alternate}
@keyframes cheer{to{transform:translateY(-10px)}}

/* screens */
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:20px;z-index:5}
.center .h1,.center .note{background:rgba(255,255,255,.85);padding:6px 18px;border-radius:20px}
.cta{min-height:56px;font-size:26px;font-weight:700;padding:14px 48px;color:#fff;background:linear-gradient(180deg,#FF8270 0 50%,#FF6450 50%);clip-path:polygon(16px 0,calc(100% - 16px) 0,100% 50%,calc(100% - 16px) 100%,16px 100%,0 50%);transition:transform .12s}
.cta:active{transform:scale(.93)}
.h1{font-size:30px;font-weight:700}
.note{color:#5c6066;font-size:16px;max-width:440px}
.bigchest{background:none;padding:0;line-height:0;touch-action:manipulation;filter:drop-shadow(0 10px 0 rgba(23,111,190,.2))}
.bigchest .chest{width:min(72vw,300px,42dvh);height:auto}
.bigchest.idle .chest{animation:chestCall 1.6s ease-in-out infinite}
@keyframes chestCall{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(-5deg) scale(1.04)}80%{transform:rotate(5deg) scale(1.04)}90%{transform:rotate(-3deg)}}
.bigchest:active .chest{transform:scale(.94)}
.bigchest:focus-visible{outline:4px solid #fff;outline-offset:6px;border-radius:20px}
.coinp{position:fixed;left:0;top:0;pointer-events:none;z-index:1001;will-change:transform,opacity;line-height:0}
.coins{display:flex;align-items:center;gap:4px;font-weight:700;font-size:18px;color:#9B6A00;background:rgba(255,255,255,.85);border-radius:14px;padding:2px 10px 2px 6px}
.coins.bump{animation:bump .5s}
.pwrap{position:relative;display:flex;align-items:center;padding-inline-start:16px}
.pcount{position:absolute;inset-inline-start:-6px;top:50%;margin-top:-17px;min-width:34px;height:34px;padding:0 6px;border-radius:17px;background:#fff;color:#9B6A00;font-weight:700;font-size:16px;line-height:34px;text-align:center;box-shadow:0 3px 0 rgba(23,111,190,.2)}
.pcount.bump{animation:bump .5s}
.endcoins{display:flex;align-items:center;gap:8px;font-weight:700;font-size:32px;color:#9B6A00;background:rgba(255,255,255,.9);border-radius:24px;padding:4px 18px 4px 10px}
.cta.restart{background:linear-gradient(180deg,#fff 0 50%,#EEF3FA 50%);padding:10px 28px}
/* end buttons: the same shape and size, dark with a white symbol, side by side at the bottom (RTL: "again" right, "next" left) */
.endbtns{position:absolute;left:0;right:0;bottom:max(22px,5dvh);display:flex;justify-content:center;gap:clamp(56px,22vw,220px)}
.endbtn{width:112px;height:64px;display:flex;align-items:center;justify-content:center;clip-path:polygon(16px 0,calc(100% - 16px) 0,100% 50%,calc(100% - 16px) 100%,16px 100%,0 50%);transition:transform .12s}

.endbtn.next{background:linear-gradient(180deg,#2f8f62 0 50%,#237a52 50%)}

.coin{position:fixed;left:0;top:0;border-radius:50%;pointer-events:none;z-index:1001;will-change:transform,opacity;
  background:radial-gradient(circle at 35% 30%,#FFF4B0 0 18%,#FFD84A 19% 55%,#E9A913 56% 100%);box-shadow:inset 0 0 0 3px #C98A00}
.coin::after{content:"";position:absolute;inset:26%;border-radius:50%;border:2px solid rgba(201,138,0,.55)}

.pt{position:fixed;pointer-events:none;z-index:999;will-change:transform,opacity}
.flycoin{position:fixed;width:30px;height:30px;margin:-15px 0 0 -15px;z-index:1000;pointer-events:none}
