<style>

/* header */

.title{justify-self:start;min-width:0;max-width:100%;font-weight:800;font-size:16px;display:flex;align-items:center;gap:6px;color:#2E6B3E;background:rgba(255,255,255,.85);padding:6px 14px 6px 12px;clip-path:polygon(0 0,100% 0,calc(100% - 12px) 100%,0 100%)}

/* stage = game board */
.stage{position:relative;flex:1;min-height:220px;max-height:400px}
.scene,.center{z-index:1}
.scene{position:absolute;inset:0}
.bgroup{position:absolute;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;transition:left .8s cubic-bezier(.5,0,.3,1),top .8s cubic-bezier(.5,0,.3,1)}

.cols{display:flex;align-items:flex-end;gap:46px;transition:gap .8s}
.col{display:flex;flex-direction:column;transition:gap .5s}
.block{--D:14px;position:relative;height:58px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:32px;color:#fff;background:var(--m);transition:height .5s}

.bsh{left:-30px;right:0;bottom:-11px;height:11px;background:rgba(60,130,60,.28);clip-path:polygon(16px 0,100% 0,calc(100% - 14px) 100%,0 100%);z-index:-1}

.talk{display:flex;align-items:flex-end;gap:12px;min-height:90px;flex:none}

.mascot .body{transform-origin:50% 100%;transform-box:fill-box}

  background:radial-gradient(circle at 35% 30%,#FFF4B0 0 18%,#FFD84A 19% 55%,#E9A913 56% 100%);box-shadow:inset 0 0 0 3px #C98A00}

.pt{position:fixed;pointer-events:none;z-index:999;will-change:transform,opacity}
